<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5236F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ACE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="ACE">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>ACE</title>
<meta name="description" content="ACE · Aprender. Conquistar. Evoluir. Cada passo de hoje constrói o seu amanhã.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F2F5FA; --grid:rgba(43,85,198,.06); --surface:#FFFFFF; --surface-2:#F6F8FC; --ink:#172033; --muted:#5B6680;
  --line:#DCE3EE; --pen:#2B55C6; --on-pen:#FFFFFF; --pen-soft:#E5ECFC; --mark:#BDF0A4; --mark-ink:#16301A;
  --ok:#1F8A4F; --ok-soft:#E1F4E8; --red:#C63A4F; --red-soft:#FBE7EA; --amber:#B26A00; --amber-soft:#FFF1D6;
  --mat:#D9480F; --port:#6741D9; --hist:#A0591A; --geo:#2B8A3E; --cien:#0B7285; --ing:#C2255C; --rev:#5B6680;
  --shadow:0 1px 2px rgba(23,32,51,.05),0 6px 20px rgba(23,32,51,.06);
  --shadow-lg:0 10px 30px rgba(23,32,51,.16);
  --radius:18px;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tabbar:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E121B; --grid:rgba(138,168,255,.05); --surface:#171D2A; --surface-2:#1C2331; --ink:#E8ECF5; --muted:#9AA5BB;
  --line:#2A3346; --pen:#8FAAFF; --on-pen:#0E121B; --pen-soft:#1F2A45; --mark:#35602A; --mark-ink:#EFFFE8;
  --ok:#5FD18F; --ok-soft:#163323; --red:#FF7F90; --red-soft:#3A1D25; --amber:#FFC266; --amber-soft:#3A2A10;
  --mat:#FF8A4C; --port:#A993FF; --hist:#E3A15F; --geo:#6FCB80; --cien:#52C5D6; --ing:#FF7FAC; --rev:#9AA5BB;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 10px 30px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E121B; --grid:rgba(138,168,255,.05); --surface:#171D2A; --surface-2:#1C2331; --ink:#E8ECF5; --muted:#9AA5BB;
  --line:#2A3346; --pen:#8FAAFF; --on-pen:#0E121B; --pen-soft:#1F2A45; --mark:#35602A; --mark-ink:#EFFFE8;
  --ok:#5FD18F; --ok-soft:#163323; --red:#FF7F90; --red-soft:#3A1D25; --amber:#FFC266; --amber-soft:#3A2A10;
  --mat:#FF8A4C; --port:#A993FF; --hist:#E3A15F; --geo:#6FCB80; --cien:#52C5D6; --ing:#FF7FAC; --rev:#9AA5BB;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img,svg{max-width:100%}
html,body{margin:0}
body{
  background-color:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--display); line-height:1.15; text-wrap:balance; margin:0; letter-spacing:-.01em}
h1{font-size:clamp(26px,6.5vw,36px); font-weight:800}
h2{font-size:22px; font-weight:800}
h3{font-size:18px; font-weight:600}
p{margin:0}
button{font-family:inherit; color:inherit}
:focus-visible{outline:3px solid var(--pen); outline-offset:2px; border-radius:8px}
.eyebrow{font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.muted{color:var(--muted)}
.logo{display:block; border-radius:22%; box-shadow:0 8px 24px rgba(82,54,246,.35)}
.motto{font-size:14px; color:var(--muted); font-style:italic}
.hl{background:linear-gradient(transparent 58%,var(--mark) 58%); padding:0 3px}
svg.i{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none}

/* ---------- estrutura ---------- */
.side{display:none}
main{max-width:760px; margin:0 auto; padding-inline:16px; padding-block:20px calc(var(--tabbar) + 110px + env(safe-area-inset-bottom,0px))}
.view{display:grid; gap:18px; animation:rise .25s ease both}
@keyframes rise{from{transform:translateY(6px); opacity:.6}to{transform:none; opacity:1}}

.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:20; display:grid; grid-template-columns:repeat(5,1fr);
  background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button,.side button.nav{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; height:var(--tabbar);
  background:none; border:0; cursor:pointer; font-size:12px; font-weight:600; color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--pen)}
.tabbar button[aria-current="page"] svg{stroke-width:2.4}

@media (min-width:960px){
  .tabbar{display:none}
  .side{display:flex; flex-direction:column; gap:6px; position:fixed; top:0; bottom:0; left:0; width:240px; padding:28px 16px;
    background:var(--surface); border-right:1px solid var(--line)}
  .side .brand{display:flex; gap:12px; align-items:center; padding:0 8px 22px}
  .side .brand b{display:block; font-family:var(--display); font-weight:800; font-size:26px; line-height:1; letter-spacing:.02em}
  .side .brand small{font-size:11px; color:var(--muted); line-height:1.3}
  .side .brand .logo{width:46px; height:46px; flex:none}
  .side button.nav{flex-direction:row; justify-content:flex-start; gap:12px; height:46px; padding:0 14px; border-radius:12px; font-size:15px}
  .side button.nav:hover{background:var(--surface-2)}
  .side button.nav[aria-current="page"]{background:var(--pen-soft); color:var(--pen)}
  main{margin-left:240px; margin-right:0; max-width:none; padding-inline:max(32px,calc((100vw - 240px - 760px)/2)); padding-block:36px 140px}
}

/* ---------- elementos ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:600; font-size:15px; border-radius:12px; padding:12px 16px;
  border:1px solid var(--line); background:var(--surface); cursor:pointer; text-decoration:none; min-height:46px}
.btn:hover{border-color:var(--pen)}
.btn.primary{background:var(--pen); border-color:var(--pen); color:var(--on-pen)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.block{width:100%}
.btn:disabled{opacity:.45; cursor:not-allowed; filter:none}
.btn.ghost{background:none; border-color:transparent; color:var(--pen); padding-inline:4px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.between{justify-content:space-between}
.pill{display:inline-flex; align-items:center; font-size:12px; font-weight:600; padding:2px 9px; border-radius:99px; color:var(--c);
  background:color-mix(in srgb,var(--c) 13%,transparent); white-space:nowrap}
.flag{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:4px 10px; border-radius:8px; background:var(--mark); color:var(--mark-ink); justify-self:start; width:fit-content}
.progress{height:8px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress i{display:block; height:100%; background:var(--c,var(--pen)); border-radius:99px; transition:width .4s}
.back{display:inline-flex; align-items:center; gap:6px; background:none; border:0; color:var(--muted); font-weight:600; cursor:pointer; padding:6px 0; justify-self:start}
.back:hover{color:var(--pen)}
.sec-title{display:flex; justify-content:space-between; align-items:baseline; gap:10px}

/* ---------- início ---------- */
.hello{display:grid; gap:4px}
.hero{position:relative; overflow:hidden; border-radius:24px; padding:22px; display:grid; gap:14px; color:var(--ink);
  background:color-mix(in srgb,var(--c) 10%,var(--surface)); border:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.hero .top{display:flex; justify-content:space-between; gap:14px; align-items:flex-start}
.hero h2{font-size:clamp(26px,7vw,34px); color:var(--c)}
.count{text-align:center; min-width:84px; background:var(--surface); border-radius:16px; padding:10px 12px; box-shadow:var(--shadow)}
.count b{display:block; font-family:var(--display); font-size:40px; line-height:1; font-variant-numeric:tabular-nums}
.count span{font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.lesson-chips{display:flex; gap:6px; flex-wrap:wrap}
.lchip{font-size:13px; padding:4px 10px; border-radius:99px; background:var(--surface); border:1px solid var(--line)}
.lchip.done{border-color:var(--ok); color:var(--ok)}

.track{list-style:none; margin:0; padding:4px 0 0; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; overflow-x:auto}
.track li{position:relative; display:grid; justify-items:center; gap:4px; text-align:center; min-width:62px; padding-inline:2px}
.track li::before{content:""; position:absolute; top:22px; right:50%; width:100%; height:3px; background:var(--line); z-index:0}
.track li:first-child::before{display:none}
.track li.done::before,.track li.next::before{background:var(--ok)}
.track .dot{position:relative; z-index:1; width:46px; height:46px; border-radius:50%; display:grid; place-items:center; line-height:1;
  font-family:var(--display); font-weight:800; font-size:17px; background:var(--surface); border:3px solid var(--c); color:var(--ink)}
.track .dot small{display:block; font-family:var(--body); font-size:9px; font-weight:600; text-transform:uppercase; color:var(--muted)}
.track li.done .dot{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.track li.done .dot small{color:var(--surface)}
.track li.next .dot{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 25%,transparent)}
.track .nm{font-size:12px; font-weight:600; line-height:1.25}
.track .when{font-size:11px; color:var(--muted)}

.session{display:grid; gap:14px}
.blist{list-style:none; margin:0; padding:0; display:grid}
.bl{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:12px 0; border-top:1px solid var(--line)}
.bl:first-child{border-top:0}
.bl .ck{appearance:none; width:26px; height:26px; border-radius:8px; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center; cursor:pointer; margin:0}
.bl .ck:checked{background:var(--ok); border-color:var(--ok)}
.bl .ck:checked::after{content:""; width:7px; height:12px; border:solid var(--surface); border-width:0 3px 3px 0; transform:rotate(45deg) translate(-1px,-1px)}
.bl .body{display:grid; gap:2px; min-width:0}
.bl .t{font-size:12px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums}
.bl .ttl{font-weight:600; line-height:1.35}
.bl .det{font-size:14px; color:var(--muted); line-height:1.45}
.bl.done .ttl{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--ok)}
.bl.now{background:linear-gradient(90deg,var(--pen-soft),transparent); margin-inline:-18px; padding-inline:18px; border-radius:0}
.bl.now .t::after{content:" · agora"; color:var(--pen)}
.go-btn{width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; cursor:pointer; color:var(--pen)}
.go-btn:hover{border-color:var(--pen)}

.quick{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}
.qcard{display:grid; gap:4px; text-align:left; cursor:pointer; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow)}
.qcard:hover{border-color:var(--pen)}
.qcard b{font-family:var(--display); font-size:18px}
.stats{display:flex; gap:10px; flex-wrap:wrap}
.stat{flex:1 1 140px; display:grid; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px}
.stat b{font-family:var(--display); font-size:22px; font-variant-numeric:tabular-nums}
.stat span{font-size:13px; color:var(--muted)}

/* ---------- agenda ---------- */
details.day{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
details.day[open]{border-color:color-mix(in srgb,var(--pen) 35%,var(--line))}
details.day.today{border-color:var(--pen); box-shadow:0 0 0 1px var(--pen),var(--shadow)}
details.day.past{opacity:.6}
details.day>summary{list-style:none; cursor:pointer; display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:14px 16px}
details.day>summary::-webkit-details-marker{display:none}
.date-box{width:52px; height:56px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line); display:grid; place-items:center; line-height:1; padding:6px 0}
.date-box b{font-family:var(--display); font-size:22px}
.date-box small{font-size:11px; font-weight:600; text-transform:uppercase; color:var(--muted)}
details.day.today .date-box{background:var(--pen); border-color:var(--pen); color:var(--on-pen)}
details.day.today .date-box small{color:var(--on-pen)}
.sum-mid{display:grid; gap:4px; min-width:0}
.dots{display:flex; gap:5px}
.dots i{width:10px; height:10px; border-radius:50%; background:var(--c)}
.frac{font-size:13px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums}
.frac.full{color:var(--ok)}
.day-body{padding:0 18px 16px; display:grid; gap:6px}
.endnote{font-size:13px; color:var(--muted); padding-top:8px; border-top:1px dashed var(--line)}

/* ---------- matérias ---------- */
.subjects{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px}
.scard{display:grid; gap:10px; text-align:left; cursor:pointer; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow)}
.scard:hover{border-color:var(--c)}
.scard .ic{width:44px; height:44px; border-radius:14px; display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:18px;
  background:color-mix(in srgb,var(--c) 15%,transparent); color:var(--c)}
.scard b{font-family:var(--display); font-size:19px}
.scard .meta{font-size:13px; color:var(--muted); line-height:1.4}
.tag{font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px; background:var(--amber-soft); color:var(--amber); justify-self:start}

.subj-head{display:grid; gap:10px; padding:20px; border-radius:24px; background:color-mix(in srgb,var(--c) 10%,var(--surface)); border:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.subj-head h1{color:var(--c)}
.path{list-style:none; margin:0; padding:0; display:grid; gap:0}
.path li{position:relative; display:grid; grid-template-columns:44px 1fr; gap:14px; padding-bottom:12px}
.path li::before{content:""; position:absolute; left:21px; top:44px; bottom:0; width:2px; background:var(--line)}
.path li:last-child::before{display:none}
.path .num{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-family:var(--display); font-weight:800; background:var(--surface); border:2px solid var(--c); color:var(--c); z-index:1}
.path li.done .num{background:var(--c); color:var(--surface)}
.lcard{display:grid; gap:4px; text-align:left; cursor:pointer; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); width:100%}
.lcard:hover{border-color:var(--c)}
.lcard b{font-weight:600; font-size:16px}
.lcard span{font-size:13px; color:var(--muted)}

/* ---------- lição ---------- */
.lesson-top{display:grid; gap:4px}
.seg{display:flex; gap:5px}
.seg i{flex:1; height:6px; border-radius:99px; background:var(--line)}
.seg i.on{background:var(--c)}
.step{display:grid; gap:14px; min-height:260px; align-content:start}
.step h2{font-size:24px}
.stext{display:grid; gap:12px; max-width:62ch}
.stext ul,.stext ol{margin:0; padding-left:22px; display:grid; gap:6px}
.ex{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-variant-numeric:tabular-nums; line-height:1.7}
.ex b{color:var(--c,var(--pen))}
.box{border-radius:14px; padding:12px 14px; display:grid; gap:4px}
.box.warn{background:var(--red-soft)}
.box.tip{background:var(--pen-soft)}
.box .lbl{font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase}
.box.warn .lbl{color:var(--red)} .box.tip .lbl{color:var(--pen)}
.tbl{overflow-x:auto; border:1px solid var(--line); border-radius:12px}
table{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; font-size:15px}
th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); background:var(--surface-2)}
.step-nav{display:grid; grid-template-columns:1fr 2fr; gap:10px}
svg text{fill:var(--ink); font-family:var(--body)}
.done-card{text-align:center; justify-items:center}
.big-check{width:72px; height:72px; border-radius:50%; background:var(--ok-soft); color:var(--ok); display:grid; place-items:center}
.big-check svg{width:38px; height:38px; stroke-width:3}

/* ---------- praticar / quiz ---------- */
.chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px}
.chip{flex:none; font-weight:600; font-size:14px; padding:9px 14px; border-radius:99px; border:1px solid var(--line); background:var(--surface); cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c,var(--pen)); border-color:var(--c,var(--pen)); color:var(--surface)}
.topics{display:grid; gap:10px}
.topic{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; text-align:left; cursor:pointer; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow)}
.topic:hover{border-color:var(--c,var(--pen))}
.topic b{font-weight:600}
.topic span{font-size:13px; color:var(--muted)}
.score-badge{font-family:var(--display); font-weight:800; font-size:15px; padding:4px 10px; border-radius:10px; background:var(--surface-2); font-variant-numeric:tabular-nums}
.score-badge.good{background:var(--ok-soft); color:var(--ok)} .score-badge.mid{background:var(--amber-soft); color:var(--amber)} .score-badge.low{background:var(--red-soft); color:var(--red)}

.quiz-top{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center}
.icon-btn{width:42px; height:42px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; cursor:pointer}
.qnum{font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums}
.qlvl{justify-self:start; width:max-content; font-size:13px; font-weight:700; padding:3px 10px; border-radius:999px}
.qlvl-1{background:var(--ok-soft); color:var(--ok)} .qlvl-2{background:var(--amber-soft); color:var(--amber)} .qlvl-3{background:var(--red-soft); color:var(--red)}
.lvl-sum{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.q{font-family:var(--display); font-size:clamp(20px,5.2vw,26px); font-weight:600; line-height:1.3}
.opts{display:grid; gap:10px}
.opt{display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:center; text-align:left; font-size:17px; background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:12px 14px; cursor:pointer; min-height:58px}
.opt .let{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-weight:700; background:var(--surface-2); border:1px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--pen)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok); background:var(--ok-soft)} .opt.right .let{background:var(--ok); color:var(--surface); border-color:var(--ok)}
.opt.wrong{border-color:var(--red); background:var(--red-soft)} .opt.wrong .let{background:var(--red); color:var(--surface); border-color:var(--red)}
.fb{border-radius:14px; padding:14px 16px; display:grid; gap:4px; animation:rise .2s ease both}

 hist:[

   ["Sociedade romana",`<ul><li><b>Patrícios:</b> ricos, donos de terra.</li><li><b>Plebeus:</b> a maioria livre, como comerciantes e artesãos.</li><li><b>Escravizados:</b> muitos eram prisioneiros de guerra.</li></ul>`],

  {id:"cultura",cap:"Cap. 8",t:"Cultura e crise de Roma",q:"hist/roma",steps:[

   ["Religião",`<p>Roma era <b>politeísta</b>. Os cristãos foram perseguidos, depois tolerados (313) e o cristianismo virou religião oficial (380).</p>`],
   ["A crise",`<ol><li>Fim das conquistas: menos riquezas e menos escravizados.</li><li>Crise econômica e mais impostos.</li><li>Em <b>395</b>, divisão em Ocidente (Roma) e Oriente (Constantinopla).</li></ol>`],

  {id:"bizancio",cap:"Cap. 9",t:"Império Bizantino",q:"hist/bizancio",steps:[
   ["O que foi",`<p>É o <b>Império Romano do Oriente</b>, que durou quase mil anos depois da queda de Roma. Capital: <b>Constantinopla</b>, antiga Bizâncio, hoje Istambul.</p>`],
   ["Poder e Justiniano",`<p>O imperador tinha poder total, inclusive sobre a Igreja. Isso se chama <b>cesaropapismo</b>.</p>

    <p><b>Desmatamento:</b> perda de biodiversidade, erosão do solo, menos chuva.</p><p><b>Chuva ácida:</b> poluentes de fábricas e veículos misturados à chuva.</p>`],

 cien:[
  {id:"esqueleto",cap:"Cap. 8",t:"Sistema esquelético",q:"cien/locomotor",steps:[
   ["Ossos e funções",`<p>Um adulto tem cerca de <b>206 ossos</b>. Maior: <b>fêmur</b>. Menor: <b>estribo</b>, na orelha.</p>
    <ul><li>Sustentação do corpo</li><li>Proteção: crânio protege o cérebro, costelas protegem coração e pulmões</li><li>Movimento, junto com os músculos</li><li>Produção de células do sangue na medula óssea vermelha</li><li>Reserva de cálcio</li></ul>`],
   ["Articulações",`<div class="tbl"><table><tr><th>Tipo</th><th>Exemplo</th></tr><tr><td>Móveis</td><td>joelho, cotovelo, ombro</td></tr><tr><td>Semimóveis</td><td>coluna vertebral</td></tr><tr><td>Imóveis</td><td>ossos do crânio</td></tr></table></div>`],
   ["Ligamento e cartilagem",`<p><b>Ligamento</b> liga osso com osso. <b>Cartilagem</b> protege a ponta dos ossos nas articulações.</p>`]]},
  {id:"musculos",cap:"Cap. 8",t:"Sistema muscular",q:"cien/locomotor",steps:[
   ["Três tipos de músculo",`<div class="tbl"><table><tr><th>Tipo</th><th>Controle</th><th>Onde</th></tr><tr><td>Esquelético</td><td>voluntário</td><td>preso aos ossos</td></tr><tr><td>Liso</td><td>involuntário</td><td>estômago, intestino</td></tr><tr><td>Cardíaco</td><td>involuntário</td><td>coração</td></tr></table></div>`],
   ["Tendão e músculos em par",`<p><b>Tendão</b> liga músculo com osso.</p><p>Os músculos trabalham em pares: ao dobrar o braço, o <b>bíceps contrai</b> e o <b>tríceps relaxa</b>.</p>

    <p><b>Substância pura:</b> um só tipo de material, como água destilada ou ouro.</p><p><b>Mistura:</b> duas ou mais substâncias juntas.</p>`],
   ["Homogênea e heterogênea",`<p><b>Homogênea:</b> uma fase só, parece uma coisa só. Água com sal dissolvido, ar, álcool com água.</p>
    <p><b>Heterogênea:</b> dá para ver mais de uma parte. Água e óleo, água e areia, granito.</p>
    <div class="box tip"><span class="lbl">Atividade</span><p>Na cozinha, misture água com sal e água com óleo. Qual é qual?</p></div>`]]},

  ["O símbolo % quer dizer:",["de cada 100","de cada 10","de cada 1000","dividido por 2","vezes 100"],0,"Por cento = por cem.",1],
  ["1% de 300 = ?",["3","30","0,3","300","1"],0,"1% é dividir por 100.",1],
  ["20% de 50 = ?",["10","20","5","25","2"],0,"10% de 50 = 5. 20% = 2 × 5 = 10.",1],
  ["Qual fração corresponde a 50%?",["1/2","1/5","1/50","5/100","2/5"],0,"50% = 50/100 = metade.",1],
  ["Quanto é 100% de 45?",["45","100","4,5","0","450"],0,"100% é o valor inteiro.",1],
  ["75% de 40 = ?",["30","10","20","35","75"],0,"25% de 40 = 10. 75% = 3 × 10 = 30.",2],
  ["5% de 80 = ?",["4","8","5","40","0,4"],0,"10% de 80 = 8. 5% é a metade: 4.",2],
  ["0,07 corresponde a:",["7%","70%","0,7%","700%","17%"],0,"0,07 = 7/100 = 7%.",2],
  ["Numa turma de 30 alunos, 40% são meninos. Quantos meninos há?",["12","18","40","10","14"],0,"10% de 30 = 3. 40% = 4 × 3 = 12.",2],
  ["Uma blusa de R$ 80 teve 25% de desconto. Qual o novo preço?",["R$ 60","R$ 20","R$ 55","R$ 75","R$ 100"],0,"25% de 80 = 20. 80 − 20 = 60.",2],
  ["Ana tinha R$ 40 e gastou 10%. Quanto sobrou?",["R$ 36","R$ 4","R$ 30","R$ 44","R$ 39"],0,"10% de 40 = 4. 40 − 4 = 36.",2],
  ["Uma conta de luz de R$ 120 vai ter 10% de multa por atraso. Qual o valor total a pagar?",["R$ 132","R$ 130","R$ 12","R$ 108","R$ 122"],0,"10% de 120 = 12. 120 + 12 = 132.",2],
  ["Uma mercadoria de R$ 200 teve aumento de 15%. Qual o novo preço?",["R$ 230","R$ 215","R$ 170","R$ 300","R$ 185"],0,"10% = 20 e 5% = 10, então 15% = 30. 200 + 30 = 230.",3],
  ["Alice acertou 18 de 20 questões. Qual foi a porcentagem de acertos?",["90%","18%","80%","85%","20%"],0,"18/20 = 90/100 = 90%.",3],
  ["Um celular custa R$ 600 à vista ou 10 × R$ 65. Quanto a mais se paga no parcelado?",["R$ 50","R$ 65","R$ 650","R$ 5","R$ 35"],0,"10 × 65 = 650. 650 − 600 = 50.",3],
  ["Qual é maior: 30% de 60 ou 60% de 30?",["São iguais","30% de 60","60% de 30","Não dá para comparar","Depende do arredondamento"],0,"30% de 60 = 18 e 60% de 30 = 18.",3],
  ["Num pacote com 200 balas, 35% são de morango. Quantas são de morango?",["70","35","65","135","75"],0,"10% = 20, 30% = 60, 5% = 10. 60 + 10 = 70.",3],
  ["Um produto de R$ 50 teve desconto de R$ 10. O desconto foi de:",["20%","10%","25%","40%","5%"],0,"10/50 = 20/100 = 20%.",3],

 ],

 "port/cap8":[
  ["Qual o principal objetivo de um cartaz de campanha de conscientização?",["Convencer as pessoas a mudar um comportamento","Vender um produto","Contar uma história inventada","Informar o placar de um jogo","Ensinar uma receita"],0,"Campanha quer mudar atitudes, como economizar água.",1],
  ["O que diferencia o anúncio publicitário do cartaz de campanha?",["O anúncio quer vender um produto ou serviço","O anúncio não usa imagens","O cartaz sempre vende algo","Não há diferença","O anúncio é sempre escrito à mão"],0,"Anúncio vende; campanha conscientiza.",2],
  ["Por que o texto de um outdoor costuma ser curto?",["As pessoas leem rápido, de passagem","Falta espaço na rua","É só para crianças","É proibido escrever muito","Outdoor é feito para ler em casa"],0,"Quem passa de carro tem poucos segundos para ler.",1],
  ["Em \"Economize água!\", o verbo está no:",["modo imperativo","modo subjuntivo","gerúndio","particípio","infinitivo"],0,"Imperativo dá ordem, conselho ou pedido.",1],
  ["Qual frase está no imperativo negativo?",["Não jogue lixo na rua.","Eu não jogo lixo na rua.","Se ele não jogasse lixo...","Jogando lixo na rua.","Eu não jogaria lixo na rua."],0,"É uma ordem com \"não\".",2],
  ["\"Girassol\" (gira + sol) é formada por:",["justaposição","aglutinação","não é palavra composta","derivação por prefixo","abreviação"],0,"As duas palavras ficam inteiras.",2],
  ["\"Planalto\" (plano + alto) é formada por:",["aglutinação","justaposição","derivação","abreviação","não é palavra composta"],0,"O \"o\" de plano sumiu.",2],
  ["Qual palavra é formada por justaposição?",["guarda-chuva","embora","aguardente","planalto","fidalgo"],0,"Guarda + chuva, sem perder nada.",2],
  ["\"O mecânico fez o ___ do carro\" e \"Fomos ao ___ da orquestra\":",["conserto / concerto","concerto / conserto","conserto / conserto","concerto / concerto","consserto / concerto"],0,"Conserto é reparo; concerto é apresentação musical.",2],
  ["Palavras homófonas são:",["iguais no som, diferentes na escrita e no sentido","parecidas no som e na escrita","palavras com o mesmo sentido","palavras com sentidos opostos","palavras de outra língua"],0,"Ex.: cela e sela.",2],
  ["\"Ela fez um ___ ao professor\" (saudação):",["cumprimento","comprimento","cumprimente","comprido","compromisso"],0,"Comprimento é medida de tamanho.",2],
  ["Qual par é de parônimos?",["emigrar / imigrar","cela / sela","cem / sem","acender / ascender","sessão / seção"],0,"Os outros pares têm o mesmo som: são homófonos.",3],
  ["Qual destes textos quer VENDER alguma coisa?",["Anúncio publicitário","Cartaz de campanha de vacinação","Carta de reclamação","Reportagem","Poema"],0,"O anúncio mostra vantagens de um produto para vender.",1],
  ["Um cartaz com a frase \"Vacine seu filho!\" é um exemplo de:",["campanha de conscientização","anúncio de venda","notícia","carta pessoal","receita"],0,"Quer mudar um comportamento, não vender.",1],
  ["Linguagem não verbal é aquela que usa:",["imagens, cores e símbolos","só palavras escritas","só palavras faladas","apenas números","rimas"],0,"Verbal = palavras. Não verbal = imagens, cores, gestos.",1],
  ["Em \"Beba mais água!\", qual palavra está no imperativo?",["Beba","mais","água","Beber","Nenhuma"],0,"\"Beba\" é um conselho, uma ordem.",1],
  ["Um slogan é:",["uma frase curta e fácil de lembrar","um texto longo com vários parágrafos","a assinatura do autor","o preço do produto","uma entrevista"],0,"Ex.: \"Beba com moderação.\"",2],
  ["Qual é o imperativo afirmativo de \"desligar\" (você)?",["Desligue","Desligar","Desligando","Desligou","Desligaria"],0,"\"Desligue a luz ao sair.\"",2],
  ["\"Embora\" (em + boa + hora) é formada por:",["aglutinação","justaposição","derivação","abreviação","não é palavra formada"],0,"Juntou e perdeu sons: em boa hora → embora.",2],
  ["\"Passatempo\" é formada por:",["justaposição","aglutinação","derivação","abreviação","onomatopeia"],0,"Passa + tempo, as duas palavras inteiras.",2],
  ["\"Acender\" a luz e \"ascender\" (subir) são palavras:",["homófonas","parônimas","sinônimas","antônimas","compostas"],0,"Mesmo som, escrita e sentido diferentes.",2],
  ["\"O preso ficou na ___\" e \"Coloque a ___ no cavalo\":",["cela / sela","sela / cela","cela / cela","sela / sela","cella / sela"],0,"Cela é prisão; sela é o assento do cavalo.",2],
  ["\"Paguei ___ reais\" e \"Saí ___ guarda-chuva\":",["cem / sem","sem / cem","cem / cem","sem / sem","sen / cem"],0,"Cem é o número 100; sem indica falta.",1],
  ["O anúncio de um tênis diz: \"Corra mais longe. Seja livre.\" Qual é a intenção?",["convencer o leitor a comprar o tênis","informar uma notícia","reclamar de um produto","ensinar a correr","contar uma história real"],0,"Anúncio usa imperativo para convencer a comprar.",2],
  ["Num outdoor, qual recurso é MAIS importante?",["imagem forte e texto curto","texto longo e detalhado","letras pequenas","muitas informações técnicas","nenhuma imagem"],0,"A pessoa vê de passagem, em poucos segundos.",2],
  ["Transforme em imperativo negativo: \"Desperdice comida.\"",["Não desperdice comida.","Nunca desperdiçou comida.","Não desperdiçar comida.","Não desperdiçando comida.","Desperdice não comida."],0,"Imperativo negativo: \"não\" + verbo (não desperdice).",3],
  ["O imperativo pode expressar tudo isto, EXCETO:",["uma dúvida sobre o passado","uma ordem","um conselho","um pedido","um convite"],0,"Dúvida e hipótese são do subjuntivo.",3],
  ["Qual palavra é formada por aglutinação?",["aguardente","girassol","guarda-roupa","passatempo","beija-flor"],0,"Água + ardente: sumiu o \"a\" de água.",3],
  ["Muitos brasileiros ___ para o Japão (saíram do Brasil). Muitos japoneses ___ para o Brasil (entraram).",["emigraram / imigraram","imigraram / emigraram","emigraram / emigraram","imigraram / imigraram","migraram / migraram"],0,"Emigrar = sair do país. Imigrar = entrar no país.",3],
  ["\"Ela agiu com muita ___ e ninguém percebeu.\" (ser discreto)",["discrição","descrição","discreção","descripção","discriçao"],0,"Discrição vem de discreto. Descrição vem de descrever.",3]
 ],
 "port/cap9":[
  ["O que diferencia a reportagem da notícia?",["A reportagem aprofunda o assunto, com entrevistas e dados","A reportagem é inventada","A reportagem é mais curta","A reportagem não tem título","A reportagem nunca tem fotos"],0,"Reportagem investiga mais a fundo.",2],
  ["O que não pode faltar numa carta de reclamação?",["A descrição do problema e o pedido de solução","Uma piada","Palavrões para mostrar raiva","Um poema","Uma receita de bolo"],0,"Problema claro + o que você quer que resolvam.",1],
  ["A linguagem de uma carta de reclamação deve ser:",["formal, respeitosa e firme","cheia de gírias","agressiva","rimada","cheia de abreviações de internet"],0,"Educação ajuda a resolver o problema.",1],
  ["\"Li Monteiro Lobato nas férias.\" Qual figura de linguagem?",["metonímia","personificação","comparação","onomatopeia","rima"],0,"O autor está no lugar dos livros dele.",2],
  ["\"Bebi dois copos de suco.\" Há metonímia porque:",["o copo está no lugar do suco","o copo ganhou vida","há um exagero","o suco virou copo","há uma comparação com \"como\""],0,"Recipiente no lugar do conteúdo.",2],
  ["\"O vento sussurrava nas janelas.\" Qual figura?",["personificação","metonímia","comparação","onomatopeia","rima"],0,"Sussurrar é ação humana dada ao vento.",1],
  ["\"Espero que você estude.\" O verbo \"estude\" está no:",["presente do subjuntivo","presente do indicativo","futuro do subjuntivo","gerúndio","pretérito perfeito"],0,"Pista: \"que\" + desejo.",2],
  ["\"Se eu estudasse mais, tiraria nota boa.\" \"Estudasse\" está no:",["pretérito imperfeito do subjuntivo","futuro do subjuntivo","presente do indicativo","infinitivo","presente do subjuntivo"],0,"Pista: \"se\" + hipótese.",3],
  ["\"Quando eu terminar a tarefa, vou brincar.\" \"Terminar\" está no:",["futuro do subjuntivo","infinitivo","imperativo","presente do indicativo","gerúndio"],0,"Parece infinitivo, mas o \"quando\" mostra que é futuro do subjuntivo.",3],
  ["Qual é o gerúndio de \"correr\"?",["correndo","corrido","correr","corra","corri"],0,"Gerúndio termina em -ndo.",1],

 "geo/acao":[

const $ = s=>document.querySelector(s);
let NS = "alice:"; // prefixo do armazenamento local; muda por usuário depois do login
let ROLE = "local"; // "local" (sem login), "aluno" ou "tutor"
let STUDENT = {id:null,nome:"Alice"}, TUTOR = null;
const store = {
  get(k,d){try{const v=localStorage.getItem(NS+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(NS+k,JSON.stringify(v))}catch(e){}}
};
const S = {
  checks:store.get("checks",{}), lessons:store.get("lessons",{}), best:store.get("best",{}),
  erros:store.get("erros",{}), tabBest:store.get("tabBest",0),
  meta:store.get("meta",{}), activity:store.get("activity",[]), jogos:store.get("jogos",{})
};
const save = k=>store.set(k,S[k]);
/* toda alteração passa por aqui: guarda quando mudou, para a sincronização saber o que é mais novo */
function setItem(kind,id,val){
  if(ROLE==="tutor" && kind!=="checks") return; // tutor só marca blocos; treinos dele não contam
  if(val) S[kind][id]=val; else delete S[kind][id];
  S.meta[kind+":"+id]=Date.now(); save(kind); save("meta"); schedulePush();
}
function logAct(txt,force){
  if(ROLE==="tutor" && !force) return;
  S.activity.unshift({t:Date.now(),txt:(ROLE==="tutor"?"Tutor: ":"")+txt}); S.activity=S.activity.slice(0,60); save("activity"); schedulePush();
}
const WD=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const pad=n=>String(n).padStart(2,"0");
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return iso(new Date())}
function parse(s){return new Date(s+"T12:00")}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function dLong(s){const d=parse(s);return `${WD[d.getDay()]}, ${d.getDate()} de ${MES[d.getMonth()]}`}
function dShort(s){const d=parse(s);return `${WD[d.getDay()].slice(0,3)} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`}
function examDone(d){const t=today();return d<t||(d===t&&new Date().getHours()>=EXAM_HOUR_END)}
function nextExam(){return EXAM_DAYS.find(e=>!examDone(e.d))}
function whenTxt(d){const n=daysBetween(today(),d);return n<0?"feita":n===0?"hoje":n===1?"amanhã":`em ${n} dias`}
const pill=s=>`<span class="pill" style="--c:${SUBJ[s].c}">${SUBJ[s].n}</span>`;
const lessonKey=(s,id)=>s+"/"+id;
const findLesson=(s,id)=>LESSONS[s].find(l=>l.id===id);
function lessonLabel(link){
  if(!link) return "";
  if(link==="T") return "Tabuada relâmpago";
  const [k,r]=link.split(":"); const [s,t]=r.split("/");
  if(k==="L") return "Abrir lição";
  return t==="erros"?"Caderno de erros":t==="all"?"Treino completo":"Praticar";
}
function blockId(date,i){return date+"-"+i}
function dayOf(date){return DAYS.find(d=>d[0]===date)}
function examOn(date){const e=EXAM_DAYS.find(x=>x.d===date);return e?e.s:[]}
function qPool(s,t){
  const keys = t==="all"||t==="erros"||t==="dificil" ? TOPICS[s].map(x=>s+"/"+x[0]) : [s+"/"+t];
  let list = keys.flatMap(k=>(Q[k]||[]).map((q,i)=>({id:k+"#"+i,q})));
  if(t==="erros") list=list.filter(x=>S.erros[x.id]);
  if(t==="dificil") list=list.filter(x=>x.q[4]===3);
  return list;
}
function errCount(s){return qPool(s,"erros").length}
const LVL={1:"Fácil",2:"Média",3:"Difícil"};
function lvlCount(list){const c={1:0,2:0,3:0}; list.forEach(x=>c[x.q?x.q[4]:x[4]]++); return `${c[1]} fáceis · ${c[2]} médias · ${c[3]} difíceis`}
function subjLessonsDone(s){const L=LESSONS[s];return [L.filter(l=>S.lessons[lessonKey(s,l.id)]).length,L.length]}
function badge(pct){if(pct==null) return `<span class="score-badge">novo</span>`;return `<span class="score-badge ${pct>=80?"good":pct>=60?"mid":"low"}">${pct}%</span>`}

let toastT;
function toast(msg,action,label){
  const t=$("#toast"); t.innerHTML=`<span>${msg}</span>${action?`<button id="toast-act">${label}</button>`:""}`; t.hidden=false;
  if(action) $("#toast-act").onclick=()=>{t.hidden=true;action()};
  clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,action?9000:3500);
}

let V={name:"inicio",p:{}};
const TOP={inicio:"inicio",agenda:"agenda",materias:"materias",materia:"materias",licao:"materias",praticar:"praticar",quiz:"praticar",tabuada:"praticar",jogos:"praticar",jogo:"praticar",progresso:"progresso"};
function go(name,p={}){
  V={name,p}; render(); window.scrollTo({top:0});
  try{history.replaceState(null,"","#"+(TOP[name]||name))}catch(e){}
}
function openLink(link){
  if(!link) return;
  if(link==="T") return go("tabuada");
  const [k,r]=link.split(":"); const [s,t]=r.split("/");
  if(k==="L") go("licao",{s,id:t,i:0}); else startQuiz(s,t);
}
document.querySelectorAll("[data-nav]").forEach(b=>{
  const n=b.dataset.nav; b.innerHTML=ICON[n]+`<span>${NAV[n]}</span>`; b.onclick=()=>go(n);
});

function render(){
  document.querySelectorAll("[data-nav]").forEach(b=>b.toggleAttribute("aria-current",b.dataset.nav===TOP[V.name]) || b.dataset.nav===TOP[V.name] && b.setAttribute("aria-current","page"));
  document.querySelectorAll("[data-nav]").forEach(b=>{ if(b.dataset.nav===TOP[V.name]) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current") });
  const html = ({inicio:vInicio,agenda:vAgenda,materias:vMaterias,materia:vMateria,licao:vLicao,praticar:vPraticar,quiz:vQuiz,tabuada:vTabuada,jogos:vJogos,jogo:vJogo,progresso:vProgresso})[V.name](V.p);
  const banner=ROLE==="tutor"?`<div class="flag" style="background:var(--pen-soft);color:var(--pen)">Modo tutor · acompanhando ${STUDENT.nome}. Treinos feitos aqui não contam para ela.</div>`:"";
  $("#main").innerHTML=`<div class="view">${banner}${html}</div>`;
  if(V.name==="tabuada") tabMount();
  if(V.name==="jogo") gameMount();
}

function vInicio(){
  const t=today(), nx=nextExam();
  let hero;
  if(nx){
    const s0=nx.s[0], n=daysBetween(t,nx.d);
    const names=nx.s.map(s=>SUBJ[s].n).join(" e ");
    const L=LESSONS[s0]; const [dn,tot]=subjLessonsDone(s0);
    hero=`<section class="hero" style="--c:${SUBJ[s0].c}">
      <div class="top"><div style="display:grid;gap:6px"><span class="eyebrow">Próxima prova</span><h2>${names}</h2><p class="muted">${dLong(nx.d)} · 7h</p></div>
      <div class="count"><b>${n<=0?"Hoje":n}</b><span>${n<=0?"às 7h":n===1?"dia":"dias"}</span></div></div>
      ${tot?`<div style="display:grid;gap:8px"><div class="row between"><span class="eyebrow">O que cai</span><span class="muted" style="font-size:13px">${dn} de ${tot} lições estudadas</span></div>
      <div class="lesson-chips">${L.map(l=>`<span class="lchip${S.lessons[lessonKey(s0,l.id)]?" done":""}">${S.lessons[lessonKey(s0,l.id)]?"✓ ":""}${l.t}</span>`).join("")}</div>
      <div class="progress" style="--c:${SUBJ[s0].c}"><i style="width:${100*dn/tot}%"></i></div></div>`:""}
      ${nx.s.includes("ing")&&nx.s.length>1?`<p class="muted" style="font-size:14px">O conteúdo de Inglês ainda vai ser informado pela escola.</p>`:""}
      <button class="btn primary" style="background:${SUBJ[s0].c};border-color:${SUBJ[s0].c};color:var(--surface)" data-subj="${s0}">Estudar ${SUBJ[s0].n} ${ICON.arrow}</button>
    </section>`;
  } else hero=`<section class="hero" style="--c:var(--ok)"><span class="eyebrow">Provas</span><h2>Todas as provas foram feitas!</h2><p>Parabéns pelo esforço, ${STUDENT.nome}.</p></section>`;

  const track=`<section class="card" style="display:grid;gap:12px"><div class="sec-title"><h3>Linha das provas</h3><span class="muted" style="font-size:13px">às 7h</span></div>
    <ol class="track">${EXAM_DAYS.map(e=>{
      const d=parse(e.d), done=examDone(e.d), isNext=nx&&nx.d===e.d;
      return `<li class="${done?"done":isNext?"next":""}" style="--c:${SUBJ[e.s[0]].c}">
        <span class="dot">${done?ICON.check:`<span>${d.getDate()}<small>${MES[d.getMonth()].slice(0,3)}</small></span>`}</span>
        <span class="nm">${e.s.map(s=>SUBJ[s].sh).join(" + ")}</span><span class="when">${done?"feita":whenTxt(e.d)}</span></li>`}).join("")}</ol></section>`;

  return `<div class="hello"><span class="eyebrow">${dLong(t)}</span><h1>${ROLE==="tutor"?"Acompanhando":"Olá,"} <span class="hl">${STUDENT.nome}</span></h1><p class="motto">Cada passo de hoje constrói o seu amanhã.</p></div>

function statsRow(withBtn=true){

    <div class="topics" style="--c:${SUBJ[s].c}">

      ${TOPICS[s].map(([k,n])=>`<button class="topic" data-open="Q:${s}/${k}"><div style="display:grid"><b>${n}</b><span>${(Q[s+"/"+k]||[]).length} questões · ${lvlCount(Q[s+"/"+k]||[])}</span></div>${badge(S.best[s+"/"+k])}</button>`).join("")}
      <button class="topic" data-open="Q:${s}/dificil"><div style="display:grid"><b>Desafio: só difíceis</b><span>${qPool(s,"dificil").length} questões difíceis de todos os assuntos</span></div>${badge(S.best[s+"/dificil"])}</button>
      <button class="topic" data-open="Q:${s}/erros" style="--c:var(--red)"><div style="display:grid"><b>Caderno de erros</b><span>${errCount(s)} questões para refazer</span></div><span class="score-badge ${errCount(s)?"low":"good"}">${errCount(s)}</span></button>
    </div>`;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let qz=null;
function startQuiz(s,t){
  const list=shuffle(qPool(s,t)).sort((a,b)=>a.q[4]-b.q[4]).map(x=>({...x,opts:shuffle(x.q[1].map((o,k)=>({o,ok:k===x.q[2]})))}));
  qz={s,t,list,i:0,score:0,answered:null,lv:{1:[0,0],2:[0,0],3:[0,0]}};
  go("quiz");
}
function quizTitle(){const {s,t}=qz; if(t==="all") return `${SUBJ[s].n} · treino completo`; if(t==="erros") return `${SUBJ[s].n} · caderno de erros`; if(t==="dificil") return `${SUBJ[s].n} · desafio difícil`; const tp=TOPICS[s].find(x=>x[0]===t); return tp?tp[1]:SUBJ[s].n}
function vQuiz(){
  if(!qz) return vPraticar();
  const c=SUBJ[qz.s].c, N=qz.list.length;
  const top=`<div class="quiz-top"><button class="icon-btn" data-quit aria-label="Sair do treino">${ICON.x}</button>
    <div style="display:grid;gap:6px"><span class="eyebrow" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${quizTitle()}</span><div class="progress" style="--c:${c}"><i style="width:${N?100*(qz.i+(qz.answered?1:0))/N:0}%"></i></div></div>
    <span class="qnum">${Math.min(qz.i+1,N)}/${N}</span></div>`;
  if(!N) return top+`<section class="card result" style="display:grid"><h2>${qz.t==="erros"?"Nenhum erro para refazer":"Nada por aqui"}</h2><p class="muted">${qz.t==="erros"?"O caderno de erros desta matéria está vazio. Ótimo sinal!":"Escolha outro assunto."}</p><button class="btn primary" data-quit>Voltar</button></section>`;
  if(qz.i>=N){
    const pct=Math.round(100*qz.score/N);
    const msg=pct>=80?"Excelente! Pronta para este assunto.":pct>=60?"Bom! Refaça o caderno de erros amanhã.":"Volte à lição, revise com calma e tente de novo.";
    return top+`<section class="card result" style="display:grid;--c:${c}"><div class="ring" style="--p:${pct}"><div>${pct}%</div></div>
      <h2>${qz.score} de ${N} certas</h2><p class="muted">${msg}</p>
      <div class="lvl-sum">${[1,2,3].filter(n=>qz.lv[n][1]).map(n=>`<span class="qlvl qlvl-${n}">${LVL[n]}: ${qz.lv[n][0]} de ${qz.lv[n][1]}</span>`).join("")}</div>
      <div class="row" style="justify-content:center"><button class="btn primary" data-again>Treinar de novo</button>${errCount(qz.s)?`<button class="btn" data-open="Q:${qz.s}/erros">Refazer erros (${errCount(qz.s)})</button>`:""}<button class="btn" data-quit>Sair</button></div></section>`;
  }
  const it=qz.list[qz.i], a=qz.answered;
  return top+`<span class="qlvl qlvl-${it.q[4]}">${LVL[it.q[4]]}</span><p class="q">${it.q[0]}</p>
    <div class="opts">${it.opts.map((o,k)=>{
      let cls="opt"; if(a){ if(o.ok) cls+=" right"; else if(a.k===k) cls+=" wrong"; }
      return `<button class="${cls}" data-opt="${k}" ${a?"disabled":""}><span class="let">${"ABCDE"[k]}</span><span>${o.o}</span></button>`}).join("")}</div>
    ${a?`<div class="fb ${a.ok?"ok":"no"}"><b>${a.ok?"Acertou!":"Quase! Vai para o caderno de erros."}</b><span>${it.q[3]}</span></div>
      <button class="btn primary block" data-next>${qz.i+1<N?"Próxima questão":"Ver resultado"} ${ICON.arrow}</button>`:""}`;
}
function answer(k){
  const it=qz.list[qz.i], ok=it.opts[k].ok; qz.answered={k,ok};
  const lv=qz.lv[it.q[4]]; lv[1]++; if(ok) lv[0]++;
  if(ok){qz.score++; if(qz.t==="erros") setItem("erros",it.id,null)} else setItem("erros",it.id,1);
  if(qz.i+1>=qz.list.length){
    const key=qz.s+"/"+qz.t, pct=Math.round(100*qz.score/qz.list.length);
    if(qz.t!=="erros" && pct>(S.best[key]||0)) setItem("best",key,pct);
    logAct(`Treino ${quizTitle()}: ${qz.score} de ${qz.list.length} (${pct}%)`);
  }
  render(); document.querySelector("[data-next]")?.focus({preventScroll:true});
  document.querySelector(".fb")?.scrollIntoView({block:"nearest",behavior:"smooth"});
}

/* =========================================================
   Tabuada relâmpago
   ========================================================= */
let tb={state:"idle",score:0,miss:[],a:0,b:0,ans:"",end:0,iv:null,flash:""};
function tabNew(){let a,b;do{a=2+Math.floor(Math.random()*9);b=2+Math.floor(Math.random()*9)}while(a===tb.a&&b===tb.b);tb.a=a;tb.b=b;tb.ans=""}
function vTabuada(){
  const head=`<button class="back" data-nav2="jogos">${ICON.left} Laboratório</button><div class="hello"><span class="eyebrow">Aquecimento · 60 segundos</span><h1>Tabuada relâmpago</h1></div>`;
  if(tb.state==="idle") return head+`<section class="card step" style="justify-items:center;text-align:center"><p class="muted">Responda o máximo de contas em 60 segundos. Pode usar o teclado da tela.</p><p>Recorde: <b>${S.tabBest}</b></p><button class="btn primary" data-tab-start>${ICON.play} Começar</button></section>`;
  if(tb.state==="end"){
    const uniq=[...new Set(tb.miss)];
    return head+`<section class="card result" style="display:grid"><div class="ring" style="--p:${Math.min(100,tb.score*5)}"><div>${tb.score}</div></div><h2>${tb.score} acertos</h2>
      ${tb.score>=S.tabBest&&tb.score>0?`<p class="flag">Novo recorde!</p>`:`<p class="muted">Recorde: ${S.tabBest}</p>`}
      ${uniq.length?`<div class="box warn" style="text-align:left;width:100%"><span class="lbl">Treinar estas</span><p>${uniq.join(" · ")}</p></div>`:""}
      <div class="row" style="justify-content:center"><button class="btn primary" data-tab-start>Jogar de novo</button><button class="btn" data-nav2="praticar">Sair</button></div></section>`;
  }
  return head+`<section class="card step" style="gap:18px"><div class="row between"><span class="qnum">✓ <span id="tb-score">${tb.score}</span></span><span class="qnum" id="tb-time">60s</span></div>
    <div class="progress" style="--c:var(--mat)"><i id="tb-bar" style="width:100%"></i></div>
    <div class="tab-q" id="tb-q">${tb.a} × ${tb.b}</div><div class="tab-ans" id="tb-ans">&nbsp;</div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-key="${n}">${n}</button>`).join("")}<button data-key="del" aria-label="Apagar">⌫</button><button data-key="0">0</button><button class="okk" data-key="ok">OK</button></div></section>`;
}
function tabMount(){
  if(tb.state!=="run") return;
  clearInterval(tb.iv);
  tb.iv=setInterval(()=>{
    const left=Math.max(0,(tb.end-Date.now())/1000);
    const tEl=$("#tb-time"); if(!tEl){clearInterval(tb.iv);tb.state="idle";return}
    tEl.textContent=Math.ceil(left)+"s"; $("#tb-bar").style.width=(100*left/60)+"%";
    if(left<=0){clearInterval(tb.iv); tb.state="end"; if(tb.score>S.tabBest){S.tabBest=tb.score; save("tabBest"); schedulePush()} logAct(`Tabuada relâmpago: ${tb.score} acertos`); render()}
  },200);
}
function tabKey(k){
  if(tb.state!=="run"||tb.flash) return;
  const el=$("#tb-ans");
  if(k==="del") tb.ans=tb.ans.slice(0,-1);
  else if(k==="ok"){
    if(!tb.ans) return;
    const right=tb.a*tb.b, ok=+tb.ans===right;
    if(ok){tb.score++; el.className="tab-ans ok"} else {tb.miss.push(`${tb.a}×${tb.b}=${right}`); el.className="tab-ans no"; el.textContent=`${tb.ans} → ${right}`}
    tb.flash="1"; $("#tb-score").textContent=tb.score;
    setTimeout(()=>{tb.flash=""; tabNew(); const q=$("#tb-q"); if(q){q.textContent=`${tb.a} × ${tb.b}`; el.className="tab-ans"; el.innerHTML="&nbsp;"}}, ok?250:1200);
    return;
  } else if(tb.ans.length<3) tb.ans+=k;
  el.innerHTML=tb.ans||"&nbsp;";
}
document.addEventListener("keydown",e=>{
  if(V.name!=="tabuada"||tb.state!=="run") return;
  if(/^\d$/.test(e.key)) tabKey(e.key); else if(e.key==="Backspace") tabKey("del"); else if(e.key==="Enter") tabKey("ok");
});

/* =========================================================
   Cliques (delegação)
   ========================================================= */
document.addEventListener("click",e=>{

const P = Object.assign({mode:"foco",running:false,end:0,left:50*60}, pstore.get());

let actx=null, wake=null, pIv=null;
function beep(){try{if(!actx) return; const t=actx.currentTime;[0,.35,.7].forEach(o=>{const osc=actx.createOscillator(),g=actx.createGain();osc.frequency.value=P.mode==="foco"?660:880;osc.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.25,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.3);osc.start(t+o);osc.stop(t+o+.32)})}catch(e){}}
async function keepAwake(on){try{if(on&&"wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}else if(!on&&wake){await wake.release();wake=null}}catch(e){}}
function pStart(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume()}catch(e){}
  P.running=true; P.end=Date.now()+P.left*1000; pSave(); keepAwake(true); pDraw();
}
function pPause(){P.left=Math.max(0,Math.round((P.end-Date.now())/1000)); P.running=false; pSave(); keepAwake(false); pDraw()}
function pReset(){P.running=false; P.left=P.dur(); pSave(); keepAwake(false); pDraw()}
function pSwap(){P.mode=P.mode==="foco"?"pausa":"foco"; pReset()}
function pFinish(silent){
  if(!silent){beep(); try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
  if(P.mode==="foco"){
    P.mode="pausa"; P.left=P.dur(); pStart();
    const t=today(), day=dayOf(t); const i=day?day[2].findIndex((b,j)=>!S.checks[blockId(t,j)]):-1;
    toast("Acabou o bloco! Pausa de 10 minutos: água, lanche, levantar.", i>=0?()=>{setItem("checks",blockId(t,i),true);logAct(`Bloco concluído: ${day[2][i][1]}`,true);render()}:null, "Marcar bloco feito");
  } else {
    P.mode="foco"; P.running=false; P.left=P.dur(); pSave(); keepAwake(false);
    toast("A pausa acabou. Bora para o próximo bloco!");
  }
  pDraw();
}
function pDraw(){
  let left=P.running?Math.max(0,Math.ceil((P.end-Date.now())/1000)):P.left;
  if(P.running&&left<=0) return pFinish(false);
  const box=$("#pomo"); box.dataset.mode=P.mode;
  const time=pad(Math.floor(left/60))+":"+pad(left%60);
  $("#p-time").textContent=time;
  $("#p-ring").style.strokeDashoffset=(138.2*(1-left/P.dur())).toFixed(1);
  $("#p-ic").innerHTML=P.mode==="foco"?ICON.brain:ICON.cup;

    ?(P.running?"Foco · 50 minutos":left===P.dur()?"Foco · pronta para começar":"Foco · pausado")
    :(P.running?"Pausa · água, lanche, levantar":"Pausa · 10 minutos");
  $("#p-play").innerHTML=P.running?ICON.pause:ICON.play;
  $("#p-play").setAttribute("aria-label",P.running?"Pausar":"Começar");
  document.title=P.running?`${time} · ${P.mode==="foco"?"Foco":"Pausa"}`:"ACE";
}

function gameMount(){ if(!GM||GM.i>=GM.n) return; GM.round.mount($("#gstage"),{ready:b=>{const x=$("#g-check"); if(x) x.disabled=!b}}) }
function gameCheck(){
  const r=GM.round, res=r.check(); let fb;
  if(res.ok){
    GM.score+=GM.tries===0?1:.5; GM.streak++; let up="";
    if(GM.streak>=2&&GM.level<3){GM.level++;GM.streak=0;up=`<br><b style="font-size:15px">Subiu para o nível ${GM.level}!</b>`}
    fb=`<div class="fb ok"><b>${pick(["Acertou!","Isso aí!","Perfeito!","Mandou bem!"])}</b><span>${r.extra?r.extra():""}${up}</span></div>`; GM.phase="done";
    if(r.reveal) r.reveal();
  } else {
    GM.tries++; GM.streak=0;
    if(GM.tries===1){fb=`<div class="fb no"><b>Quase! ${res.info}</b><span><b style="font-size:14px;font-family:var(--body)">Dica:</b> ${r.hint}</span></div>`}
    else {GM.phase="done"; if(GM.level>1) GM.level--; if(r.reveal) r.reveal(); fb=`<div class="fb no"><b>Vamos ver juntos</b><span>${r.answer}</span></div>`}
  }
  $("#gfb").innerHTML=fb;
  $("#gbtn").innerHTML=GM.phase==="done"?`<button class="btn primary block" data-gnext>${GM.i+1<GM.n?"Próximo desafio":"Ver estrelas"} ${ICON.arrow}</button>`
    :`<button class="btn primary block" id="g-check" data-gcheck>Verificar de novo</button>`;
  $("#gfb").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function gameNext(){
  GM.i++;
  if(GM.i<GM.n){GM.round=GAMEDEF[GM.id].gen(GM.level); GM.tries=0; GM.phase="play"}
  else {
    const pct=GM.score/GM.n, st=pct>=.9?3:pct>=.65?2:pct>0?1:0, g=GAMES.find(x=>x.id===GM.id);
    if(st>(S.jogos[GM.id]||0)) setItem("jogos",GM.id,st);
    logAct(`Jogo ${g.t}: ${st} ${st===1?"estrela":"estrelas"}`);
  }
  render(); window.scrollTo({top:0});
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-game],[data-gcheck],[data-gnext],[data-gquit]"); if(!el) return;
  if(el.dataset.game) return startGame(el.dataset.game);
  if(el.dataset.gcheck!==undefined){ if(!el.disabled) gameCheck(); return }
  if(el.dataset.gnext!==undefined) return gameNext();
  if(el.dataset.gquit!==undefined){GM=null; go("jogos")}
});

function mergeState(r){
  r=r||{}; const rm=r.meta||{};
  ["checks","lessons","erros","best","jogos"].forEach(kind=>{
    const R=r[kind]||{}, ids=new Set([...Object.keys(S[kind]),...Object.keys(R)]);
    ids.forEach(id=>{
      const k=kind+":"+id, lt=S.meta[k]||0, rt=rm[k]||0, lv=id in S[kind], rv=id in R;
      if(rt>lt||(rt===lt&&rv&&!lv)){ if(rv) S[kind][id]=R[id]; else delete S[kind][id]; if(rt) S.meta[k]=rt }
    });
  });
  S.tabBest=Math.max(S.tabBest||0,r.tabBest||0);
  const seen=new Set(), all=[...S.activity,...(r.activity||[])].filter(a=>{const k=a.t+"|"+a.txt;if(seen.has(k))return false;seen.add(k);return true});
  S.activity=all.sort((a,b)=>b.t-a.t).slice(0,60);
  KEYS.forEach(save);
}

}
function schedulePush(){ if(!SB||!USER) return; clearTimeout(pushT); pushT=setTimeout(syncNow,1500) }
async function syncNow(){
  if(!SB||!USER||!STUDENT.id||syncing) return; syncing=true; setSync("busy");
  try{
    const {data,error}=await SB.from("progresso").select("dados").eq("aluno_id",STUDENT.id).maybeSingle();
    if(error) throw error;
    const before=JSON.stringify(snapshot());
    if(data&&data.dados) mergeState(data.dados);
    const after=JSON.stringify(snapshot());
    if(!data || after!==JSON.stringify(Object.assign({checks:{},lessons:{},erros:{},best:{},tabBest:0,meta:{},activity:[],jogos:{}},data.dados))){
      const {error:e2}=await SB.from("progresso").upsert({aluno_id:STUDENT.id,dados:snapshot(),atualizado_em:new Date().toISOString()});
      if(e2) throw e2;
    }
    setSync("ok");
    if(after!==before && ["inicio","agenda","materias","materia","praticar","progresso"].includes(V.name)) render();
  }catch(e){ setSync("err") } finally{ syncing=false }
}

function showLogin(err,ok){
  screen(`${brandHead()}${authForm("login",
    fld("lg-user","Usuário ou e-mail",`autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required`)+
    fld("lg-pass","Senha",`type="password" autocomplete="current-password" required`),"Entrar",err,ok)}
    ${authLinks(lnk("data-auth=\"forgot\"","Esqueceu a senha?"),`<span class="muted">Ainda não tem conta? ${lnk("data-auth=\"signup\"","Criar conta")}</span>`)}`);
  $("#login").addEventListener("submit",async e=>{
    e.preventDefault();
    const u=$("#lg-user").value.trim(), p=$("#lg-pass").value;
    if(!u||!p) return authFail("Preencha usuário e senha.","Entrar");
    authBusy("Entrando…");
    const email=u.includes("@")?u.toLowerCase():`${u.toLowerCase()}@${EMAIL_DOMAIN}`;
    const {data,error}=await SB.auth.signInWithPassword({email,password:p});
    if(error) return authFail(authMsg(error),"Entrar");
    afterLogin(data.user);
  });
}
function showSignup(){
  screen(`${brandHead()}<h2 style="text-align:center">Criar conta</h2>${authForm("signup",
    fld("su-nome","Seu nome",`autocomplete="given-name" required`)+
    fld("su-email","E-mail",`type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required`)+
    fld("su-pass","Senha (mínimo 6 caracteres)",`type="password" autocomplete="new-password" minlength="6" required`)+
    fld("su-pass2","Repita a senha",`type="password" autocomplete="new-password" required`),"Criar conta")}
    ${authLinks(`<span class="muted">Já tem conta? ${lnk("data-auth=\"login\"","Entrar")}</span>`)}`);
  $("#signup").addEventListener("submit",async e=>{
    e.preventDefault();
    const nome=$("#su-nome").value.trim(), email=$("#su-email").value.trim().toLowerCase(), p=$("#su-pass").value, p2=$("#su-pass2").value;
    if(!nome||!email||!p) return authFail("Preencha todos os campos.","Criar conta");
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return authFail("Digite um e-mail válido. Ele é usado para recuperar a senha.","Criar conta");
    if(p.length<6) return authFail("A senha precisa ter pelo menos 6 caracteres.","Criar conta");
    if(p!==p2) return authFail("As duas senhas estão diferentes.","Criar conta");
    authBusy("Criando conta…");
    const {data,error}=await SB.auth.signUp({email,password:p,options:{data:{nome}}});
    if(error) return authFail(authMsg(error),"Criar conta");
    // Com "Confirm email" desligado no Supabase, a conta já volta logada.
    if(data.session) return afterLogin(data.user);
    // Supabase não diz se o e-mail já existia (por segurança): tenta entrar direto.
    const r=await SB.auth.signInWithPassword({email,password:p});
    if(!r.error) return afterLogin(r.data.user);
    authFail(/not confirmed/i.test(r.error.message)
      ? "A conta foi criada, mas o Supabase está pedindo confirmação por e-mail. Peça para o tutor desligar \"Confirm email\"."
      : authMsg(r.error),"Criar conta");
  });
}
function showForgot(){
  screen(`${brandHead()}<h2 style="text-align:center">Esqueceu a senha?</h2>
    <p class="muted" style="text-align:center">Digite o e-mail da sua conta. Vamos mandar um link para você criar uma senha nova.</p>${authForm("forgot",
    fld("fg-email","E-mail",`type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required`),"Enviar link")}
    ${authLinks(lnk("data-auth=\"login\"","Voltar para o login"))}`);
  $("#forgot").addEventListener("submit",async e=>{
    e.preventDefault();
    const email=$("#fg-email").value.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return authFail("Digite um e-mail válido.","Enviar link");
    authBusy("Enviando…");
    const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(error) return authFail(authMsg(error),"Enviar link");
    showLogin(null,`Se <b>${email.replace(/</g,"&lt;")}</b> tiver uma conta, o link para criar uma senha nova chega em alguns minutos. Olhe também a caixa de spam.`);
  });
}
function showNewPassword(){ // aberto pelo link do e-mail de recuperação
  screen(`${brandHead()}<h2 style="text-align:center">Criar senha nova</h2>${authForm("newpass",
    fld("np-pass","Senha nova (mínimo 6 caracteres)",`type="password" autocomplete="new-password" minlength="6" required`)+
    fld("np-pass2","Repita a senha nova",`type="password" autocomplete="new-password" required`),"Salvar senha")}`);
  $("#newpass").addEventListener("submit",async e=>{
    e.preventDefault();
    const p=$("#np-pass").value, p2=$("#np-pass2").value;
    if(p.length<6) return authFail("A senha precisa ter pelo menos 6 caracteres.","Salvar senha");
    if(p!==p2) return authFail("As duas senhas estão diferentes.","Salvar senha");
    authBusy("Salvando…");
    const {data,error}=await SB.auth.updateUser({password:p});
    if(error) return authFail(/different from the old|same.*password/i.test(error.message)?"A senha nova precisa ser diferente da antiga.":authMsg(error),"Salvar senha");
    toast("Senha nova salva!"); afterLogin(data.user);
  });
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-auth]"); if(!b) return;
  ({login:()=>showLogin(),signup:showSignup,forgot:showForgot})[b.dataset.auth]();
});
function showProblem(title,msg){
  screen(`${brandHead()}<section class="card" style="display:grid;gap:10px"><h2>${title}</h2><p class="muted">${msg}</p>
    ${SB?`<button class="btn" data-logout>Sair e entrar com outra conta</button>`:""}</section>`);
}
async function pickStudent(id){
  STUDENT=STUDENTS.find(k=>k.id===id)||STUDENTS[0];
  NS=`estudos:tutor:${USER.id}:${STUDENT.id}:`; loadState();
  try{localStorage.setItem("alice:tutor-aluno",STUDENT.id)}catch(e){}
}
async function afterLogin(user){
  USER=user; screen(`${brandHead()}<p class="muted" style="text-align:center">Carregando…</p>`);
  const {data:prof,error}=await SB.from("profiles").select("id,nome,papel").eq("id",user.id).maybeSingle();
  if(error) return showProblem("Não foi possível carregar","Verifique a internet e tente de novo.");
  if(!prof) return showProblem("Conta ainda não configurada","Esta conta existe, mas não foi marcada como aluna ou tutor. Peça para o tutor rodar o arquivo cadastro.sql no Supabase.");
  ROLE=prof.papel;
  if(ROLE==="aluno"){ STUDENT={id:prof.id,nome:prof.nome}; NS=`estudos:${prof.id}:`; migrateLegacy(); loadState() }
  else {
    TUTOR=prof;
    const {data:kids}=await SB.from("profiles").select("id,nome").eq("tutor_id",prof.id).order("nome");
    STUDENTS=kids||[];
    if(!STUDENTS.length) return showProblem("Nenhum aluno ligado","Rode o passo 4 do arquivo supabase.sql para ligar a conta da Alice à sua.");
    let saved=null; try{saved=localStorage.getItem("alice:tutor-aluno")}catch(e){}
    await pickStudent(saved);
  }
  document.body.classList.remove("locked");
  go("inicio"); // depois do login, sempre começa no Início
  await syncNow();
  clearInterval(pollIv); pollIv=setInterval(()=>{if(document.visibilityState==="visible") syncNow()},30000);
}
async function logout(){
  clearInterval(pollIv); clearTimeout(pushT);
  try{await SB.auth.signOut()}catch(e){}
  USER=null; ROLE="local"; TUTOR=null; STUDENTS=[]; STUDENT={id:null,nome:"Alice"};
  showLogin();
}
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-syncnow],[data-logout],[data-student]"); if(!el) return;
  if(el.dataset.syncnow!==undefined) return syncNow();
  if(el.dataset.logout!==undefined) return logout();
  if(el.dataset.student){await pickStudent(el.dataset.student); render(); syncNow()}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible") syncNow()});

/* ---------- início ---------- */
(async function boot(){
  const h0=(location.hash||"").slice(1);
  if(!CONFIGURED) return go(["agenda","materias","praticar","progresso"].includes(h0)?h0:"inicio");
  if(!window.supabase) return showProblem("Sem conexão","Não foi possível carregar o sistema de login. Verifique a internet e recarregue a página.");
  const hs=new URLSearchParams((location.hash||"").slice(1)), recovery=hs.get("type")==="recovery", linkErr=hs.get("error_description");
  SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  SB.auth.onAuthStateChange(ev=>{ if(ev==="PASSWORD_RECOVERY") setTimeout(showNewPassword) });
  const {data}=await SB.auth.getSession();
  if(recovery||linkErr) try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  if(recovery && data&&data.session) return showNewPassword();
  if(linkErr) return showLogin("Esse link não vale mais (ele expira depois de um tempo ou de ser usado). Peça um novo em \"Esqueceu a senha?\".");
  if(data&&data.session) afterLogin(data.session.user); else showLogin();
})();
</script>
