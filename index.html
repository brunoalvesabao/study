 cien:[
  {id:"esqueleto",cap:"Cap. 8",t:"Sistema esquelético",q:"cien/locomotor",steps:[
   ["Sistema locomotor",`<p>O <b>sistema locomotor</b> é o que permite o corpo se mover. Ele é formado por:</p>
    <ul><li><b>ossos</b> (sistema esquelético);</li><li><b>articulações</b> (onde os ossos se encontram);</li><li><b>músculos</b> (sistema muscular), que puxam os ossos.</li></ul>
    <p>Nesta lição você estuda o esqueleto. Na próxima, os músculos.</p>`],
   ["Ossos e funções",`<p>Um adulto tem cerca de <b>206 ossos</b>. O maior é o <b>fêmur</b>, na coxa. O menor é o <b>estribo</b>, dentro da orelha.</p>
    <p><b>Funções do esqueleto:</b></p>
    <ul><li><b>Sustentação:</b> mantém o corpo de pé.</li><li><b>Proteção:</b> o crânio protege o cérebro; as costelas protegem o coração e os pulmões.</li><li><b>Movimento:</b> junto com os músculos.</li><li><b>Produção de células do sangue</b>, na medula óssea vermelha, dentro de alguns ossos.</li><li><b>Reserva de cálcio.</b></li></ul>
    <details class="try"><summary>Tente você: o que as costelas protegem?</summary><p>O <b>coração e os pulmões</b>. Juntas, formam a caixa torácica.</p></details>`],
   ["Partes do esqueleto",`<ul><li><b>Crânio:</b> ossos da cabeça, protegem o cérebro.</li><li><b>Coluna vertebral:</b> formada por <b>vértebras</b> empilhadas; sustenta o corpo e protege a medula espinhal.</li><li><b>Caixa torácica:</b> costelas e esterno.</li><li><b>Membros superiores:</b> úmero (braço), rádio e ulna (antebraço), ossos da mão.</li><li><b>Membros inferiores:</b> fêmur (coxa), tíbia e fíbula (perna), ossos do pé.</li></ul>`],
   ["Articulações",`<p>Articulação é o <b>encontro entre dois ossos</b>. Elas são classificadas pelo quanto se mexem:</p>
    <div class="tbl"><table><tr><th>Tipo</th><th>Movimento</th><th>Exemplo</th></tr>
     <tr><td>Móveis</td><td>muito</td><td>joelho, cotovelo, ombro</td></tr>
     <tr><td>Semimóveis</td><td>pouco</td><td>entre as vértebras da coluna</td></tr>
     <tr><td>Imóveis</td><td>nenhum</td><td>ossos do crânio</td></tr></table></div>
    <details class="try"><summary>Tente você: o ombro é articulação de que tipo?</summary><p><b>Móvel</b>: mexe o braço em várias direções.</p></details>`],
   ["Ligamentos, cartilagens e cuidados",`<p><b>Ligamento:</b> liga <b>osso com osso</b> nas articulações, como uma fita resistente.</p>
    <p><b>Cartilagem:</b> tecido liso que <b>protege a ponta dos ossos</b> nas articulações, para um não gastar o outro. A orelha e a ponta do nariz também são de cartilagem.</p>
    <div class="box tip"><span class="lbl">Cuidando dos ossos</span><ul><li>Alimentos com cálcio: leite, queijo, iogurte, vegetais verde-escuros.</li><li>Tomar sol na medida certa (vitamina D).</li><li>Boa postura e mochila nas duas alças.</li><li>Praticar atividade física.</li></ul></div>`]]},
  {id:"musculos",cap:"Cap. 8",t:"Sistema muscular",q:"cien/locomotor",steps:[
   ["O que são os músculos",`<p>O corpo tem cerca de <b>600 músculos</b>. Eles são formados por fibras que conseguem <b>contrair</b> (encurtar) e <b>relaxar</b>.</p>
    <p>Ao contrair, o músculo <b>puxa</b>. É assim que ele move os ossos, bombeia o sangue e empurra o alimento no estômago e no intestino.</p>`],
   ["Três tipos de músculo",`<div class="tbl"><table><tr><th>Tipo</th><th>Controle</th><th>Onde</th></tr>
     <tr><td>Estriado esquelético</td><td><b>voluntário</b> (a gente manda)</td><td>preso aos ossos: braços, pernas, rosto</td></tr>
     <tr><td>Liso</td><td><b>involuntário</b></td><td>estômago, intestino, bexiga</td></tr>
     <tr><td>Cardíaco</td><td><b>involuntário</b></td><td>só no coração</td></tr></table></div>
    <div class="ex">Você decide correr → músculo <b>esquelético</b><br>O coração bate sozinho → músculo <b>cardíaco</b><br>O estômago mistura o alimento sozinho → músculo <b>liso</b></div>
    <details class="try"><summary>Tente você: qual músculo trabalha sem você mandar e não fica no coração?</summary><p>O <b>liso</b>, como o do estômago e do intestino.</p></details>`],
   ["Tendões",`<p>O <b>tendão</b> liga o <b>músculo ao osso</b>. Quando o músculo contrai, ele puxa o tendão, que puxa o osso.</p>
    <div class="ex">O tendão de Aquiles liga o músculo da panturrilha ao osso do calcanhar.</div>
    <div class="box warn"><span class="lbl">Confusão comum</span><p><b>Tendão:</b> músculo com osso. <b>Ligamento:</b> osso com osso.</p></div>`],
   ["Músculos trabalham em pares",`<p>Músculo só consegue <b>puxar</b>, nunca empurrar. Por isso eles trabalham em <b>pares</b>: um puxa para um lado, o outro puxa de volta.</p>
    <div class="ex">Dobrar o braço: o <b>bíceps contrai</b> e o <b>tríceps relaxa</b><br>Esticar o braço: o <b>tríceps contrai</b> e o <b>bíceps relaxa</b></div>
    <div class="box tip"><span class="lbl">Teste no seu braço</span><p>Coloque a mão em cima do braço e dobre o cotovelo: você sente o bíceps endurecer. Estique: agora é o tríceps, atrás.</p></div>`]]},
  {id:"materia",cap:"Cap. 9",t:"Matéria e misturas",q:"cien/misturas",steps:[
   ["O que é matéria",`<p><b>Matéria</b> é tudo que tem <b>massa</b> e <b>ocupa lugar no espaço</b>. Pode estar no estado sólido, líquido ou gasoso.</p>
    <div class="ex">Sólido: pedra, madeira, gelo<br>Líquido: água, óleo, suco<br>Gasoso: o <b>ar</b>, o vapor d'água</div>
    <p>O ar também é matéria: um balão cheio de ar ocupa espaço e tem massa, mesmo que a gente não veja o ar.</p>`],
   ["Substância pura e mistura",`<p><b>Substância pura:</b> formada por <b>um só tipo</b> de material.</p>
    <div class="ex">água destilada · ouro · gás oxigênio · sal de cozinha puro</div>
    <p><b>Mistura:</b> duas ou mais substâncias juntas. Quase tudo à nossa volta é mistura.</p>
    <div class="ex">água com sal · ar · leite · suco · água do mar · refrigerante</div>
    <p>As substâncias puras ainda se dividem em dois tipos:</p>
    <div class="ex"><b>Simples:</b> formada por um só tipo de átomo (elemento químico). Ex.: gás oxigênio (O₂), ouro (Au), ferro (Fe)<br><b>Composta:</b> formada por dois ou mais tipos de átomos. Ex.: água (H₂O), gás carbônico (CO₂), sal de cozinha (NaCl)</div>
    <details class="try"><summary>Tente você: a água do mar é substância pura ou mistura?</summary><p><b>Mistura</b>: tem água, sal e outras substâncias.</p></details>`],
   ["Homogênea e heterogênea",`<p>Cada parte diferente que dá para ver numa mistura se chama <b>fase</b>.</p>
    <p><b>Homogênea:</b> <b>uma fase só</b>. Parece uma coisa só, não dá para ver os componentes.</p>
    <div class="ex">água com sal dissolvido · água com açúcar · álcool com água · ar</div>
    <p><b>Heterogênea:</b> <b>duas ou mais fases</b>. Dá para ver as partes.</p>
    <div class="ex">água e óleo (2 fases) · água e areia · granito · água, óleo e areia (3 fases)</div>
    <div class="box tip"><span class="lbl">Atividade</span><p>Na cozinha, misture água com sal e água com óleo. Qual é homogênea? Qual é heterogênea?</p></div>
    <details class="try"><summary>Tente você: quantas fases tem água + óleo + areia?</summary><p><b>3 fases</b>: cada material forma uma camada.</p></details>`]]},
  {id:"separacao",cap:"Cap. 9",t:"Separação de misturas",q:"cien/misturas",steps:[
   ["Separar misturas heterogêneas",`<p>Como dá para ver as partes, os métodos são mais simples:</p>
    <div class="tbl"><table><tr><th>Método</th><th>Como funciona</th><th>Exemplo</th></tr>
     <tr><td>Catação</td><td>tirar com a mão</td><td>pedrinhas do feijão</td></tr>
     <tr><td>Peneiração</td><td>a peneira segura o grosso</td><td>farinha e grãos</td></tr>
     <tr><td>Filtração</td><td>o filtro segura o sólido e deixa o líquido passar</td><td>água e areia; coador de café</td></tr>
     <tr><td>Decantação</td><td>esperar o mais pesado assentar</td><td>água barrenta</td></tr>
     <tr><td>Imantação</td><td>o ímã puxa o ferro</td><td>limalha de ferro e areia</td></tr></table></div>`],
   ["Separar misturas homogêneas",`<p>Como tudo parece uma coisa só, é preciso usar o <b>calor</b>:</p>
    <ul><li><b>Evaporação:</b> o líquido evapora e o sólido fica. É assim nas <b>salinas</b>: o Sol evapora a água do mar e sobra o sal. (A água se perde.)</li>
    <li><b>Destilação simples:</b> separa um sólido dissolvido num líquido e <b>recupera o líquido</b>. A mistura ferve, o vapor passa por um tubo frio (condensador) e volta a ser líquido em outro recipiente. O sal fica no primeiro.</li>
    <li><b>Destilação fracionada:</b> separa <b>líquidos misturados</b>, porque cada um ferve numa temperatura diferente. Ex.: água e álcool; o <b>petróleo</b> nas refinarias.</li></ul>
    <details class="try"><summary>Tente você: quero separar água e sal e ficar com a água. Qual método?</summary><p><b>Destilação simples.</b> Na evaporação, a água se perderia.</p></details>`],
   ["Escolhendo o método",`<ol><li>A mistura é <b>heterogênea</b> (dá para ver as partes)? Use catação, peneira, filtro, decantação ou ímã.</li><li>É <b>homogênea</b>? Use evaporação ou destilação.</li><li>Tem as duas coisas? Faça <b>em etapas</b>: primeiro a parte heterogênea, depois a homogênea.</li></ol>
    <div class="ex"><b>Água + areia + sal dissolvido</b><br>1º filtração → tira a areia<br>2º evaporação (ou destilação) → separa o sal da água</div>
    <details class="try"><summary>Tente você: ímã serve para separar água e areia?</summary><p><b>Não</b>: a areia não é atraída pelo ímã. Use filtração ou decantação.</p></details>`]]}
 ],
 ing:[
  {id:"lang13",cap:"LANGUAGE · Ch. 13",t:"My family rocks!",q:"ing/l13",steps:[
   ["Family members",`<p>O capítulo 13 é sobre <b>família</b>: entender uma árvore genealógica (<b>family tree</b>), descrever os familiares e escrever sobre a própria família.</p>
    <div class="tbl"><table><tr><th>English</th><th>Português</th></tr>
     <tr><td>grandfather · grandmother</td><td>avô · avó</td></tr><tr><td>grandparents</td><td>avós</td></tr>
     <tr><td>father · mother</td><td>pai · mãe</td></tr><tr><td>parents</td><td>pais (pai e mãe)</td></tr>
     <tr><td>uncle · aunt</td><td>tio · tia</td></tr><tr><td>cousin · cousins</td><td>primo(a) · primos</td></tr>
     <tr><td>brother · sister</td><td>irmão · irmã</td></tr><tr><td>son · daughter</td><td>filho · filha</td></tr>
     <tr><td>husband · wife</td><td>marido · esposa</td></tr><tr><td>children</td><td>filhos, crianças</td></tr>
     <tr><td>twin sisters</td><td>irmãs gêmeas</td></tr><tr><td>ancestors</td><td>antepassados</td></tr></table></div>
    <div class="box warn"><span class="lbl">Cuidado</span><p><b>Parents</b> quer dizer <b>pai e mãe</b>, não "parentes". Parentes em inglês é <b>relatives</b>.</p></div>`],
   ["Kate's family tree",`<p>No livro, a Kate apresenta a família dela. A árvore é assim:</p>
    <div class="ex"><b>Bob + Jane</b> → avós (grandparents), da <b>Hungria</b><br>
     ↳ filhos: <b>Niki</b> (casada com <b>Paul</b>) e <b>Harry</b> (casado com <b>Melissa</b>)<br>
     ↳ filhos de Niki e Paul: <b>Kate, Dan e Lilly</b><br>
     ↳ filhos de Harry e Melissa: <b>Ted e Mary</b></div>
    <p>Para a <b>Kate</b>: Niki é a <b>mother</b> (nasceu na França e se mudou para a Inglaterra), Paul é o <b>father</b> (brasileiro, joga futebol com ela), Harry é o <b>uncle</b> (de Londres), Melissa é a <b>aunt</b> (de Paris, fala francês com ela), Dan é o <b>brother</b>, Lilly a <b>sister</b>, Ted e Mary são os <b>cousins</b>.</p>
    <p>A família é <b>multicultural</b>: tem pessoas da Hungria, França, Brasil e Inglaterra. Eles são uma família <b>close</b> (muito próxima).</p>
    <div class="tbl"><table><tr><th>Glossary</th><th>Significado</th></tr><tr><td>to take care of</td><td>cuidar de</td></tr><tr><td>to be close</td><td>ser muito próximo, carinhoso</td></tr></table></div>
    <details class="try"><summary>Tente você: quem é Harry para a Kate?</summary><p>É o <b>uncle</b> (tio): irmão da mãe dela, Niki.</p></details>`],
   ["Present simple: afirmativo",`<p>O <b>present simple</b> fala de <b>hábitos</b> (coisas que fazemos sempre) e <b>verdades gerais</b>.</p>
    <div class="ex">I <b>play</b> football for the school team.<br>My friends <b>study</b> in another school.<br>Harry and Melissa <b>have</b> 2 children.</div>
    <p>Com <b>he, she, it</b> (uma pessoa ou coisa só), o verbo muda:</p>
    <div class="tbl"><table><tr><th>Regra</th><th>Exemplo</th></tr>
     <tr><td>a maioria: + <b>s</b></td><td>play → play<b>s</b> · speak → speak<b>s</b> · like → like<b>s</b></td></tr>
     <tr><td>consoante + y: tira o y e põe <b>ies</b></td><td>study → stud<b>ies</b></td></tr>
     <tr><td>termina em o, sh, ch, ss, x: + <b>es</b></td><td>go → go<b>es</b> · watch → watch<b>es</b></td></tr>
     <tr><td><b>have</b> é irregular</td><td>have → <b>has</b></td></tr></table></div>
    <div class="ex">My father <b>plays</b> volleyball with his friends.<br>Lilly <b>studies</b> every day in the morning.<br>My cousin <b>has</b> beautiful hair.</div>
    <details class="try"><summary>Tente você: "Ariana Grande ___ a brother called Frankie" (have).</summary><p><b>has</b>: com uma pessoa só (she), have vira has.</p></details>`],
   ["Mais exemplos e erros comuns",`<div class="ex">Justin Bieber and his wife <b>live</b> in Los Angeles. (duas pessoas → sem s)<br>Beyoncé's mother <b>owns</b> a beauty salon. (uma pessoa → s)<br>Ed Sheeran <b>plays</b> the guitar and <b>has</b> a cat called Bellini.<br>My mother <b>takes care</b> of my grandmother every day.<br>My father <b>reads</b> to me every night.</div>
    <div class="box warn"><span class="lbl">Erro comum</span><p>Esquecer o <b>s</b>: "She <s>play</s>" está errado. O certo é "She <b>plays</b>". E com duas pessoas não tem s: "My cousins <b>play</b>".</p></div>
    <p><b>Para descrever a família</b>, diga quem é, de onde vem e o que faz:</p>
    <div class="ex">My aunt <b>is</b> from Paris. She <b>speaks</b> French with me. We <b>are</b> a very close family.</div>
    <details class="try"><summary>Tente você: "My cousins always ___ hide-and-seek" (play).</summary><p><b>play</b>: cousins é plural (they), então não tem s.</p></details>`]]},
  {id:"lang14",cap:"LANGUAGE · Ch. 14",t:"I love texting my friends",q:"ing/l14",steps:[
   ["Free-time activities",`<p>O capítulo 14 é sobre o que fazemos no <b>tempo livre</b> (<b>free time</b>): encontrar amigos, relaxar e experimentar coisas novas. O livro separa as atividades assim:</p>
    <div class="tbl"><table><tr><th>Usually indoors (dentro de casa)</th><th>Usually outdoors (ao ar livre)</th></tr>
     <tr><td>act (atuar)</td><td>hang out with friends (sair com amigos)</td></tr>
     <tr><td>cook (cozinhar)</td><td>play ball games (jogos com bola)</td></tr>
     <tr><td>dance · draw (dançar · desenhar)</td><td>ride a bike (andar de bicicleta)</td></tr>
     <tr><td>listen to music (ouvir música)</td><td>go surfing (surfar)</td></tr>
     <tr><td>play video games</td><td>go swimming (nadar)</td></tr>
     <tr><td>read · watch series (ler · ver séries)</td><td>walk (caminhar)</td></tr></table></div>
    <p>Algumas se fazem <b>sozinho</b> (<b>alone</b>: draw, read, go swimming) e outras <b>com outras pessoas</b> (<b>with others</b>: chat, hang out, play ball games).</p>`],
   ["Qual verbo combina com o quê",`<p>Em inglês, cada atividade tem o seu verbo certo:</p>
    <div class="tbl"><table><tr><th>Verbo</th><th>Combina com</th></tr>
     <tr><td>play</td><td>football, video games, ball games</td></tr><tr><td>ride</td><td>a bike</td></tr>
     <tr><td>hang out</td><td>with friends</td></tr><tr><td>listen</td><td>to music</td></tr>
     <tr><td>watch</td><td>series, films, TV</td></tr><tr><td>check</td><td>social media</td></tr>
     <tr><td>post</td><td>pictures on social media</td></tr><tr><td>read</td><td>mystery books</td></tr>
     <tr><td>cook</td><td>delicious food</td></tr><tr><td>draw</td><td>beautiful pictures</td></tr>
     <tr><td>walk</td><td>in the park</td></tr><tr><td>go</td><td>swimming, surfing</td></tr></table></div>
    <div class="box warn"><span class="lbl">Atenção</span><p>É <b>listen to</b> music (com "to") e <b>go</b> swimming (go + verbo com -ing).</p></div>
    <details class="try"><summary>Tente você: desembaralhe as letras "GHAN TUO".</summary><p><b>HANG OUT</b>.</p></details>`],
   ["Falando do tempo livre dos outros",`<p>Para falar do que <b>outra pessoa</b> faz, usamos o present simple com <b>s</b> (he/she) e a expressão <b>in his/her free time</b>:</p>
    <div class="ex">My mother <b>reads</b> books in her free time.<br>Susie <b>posts</b> pictures on her social media every day.<br>Benjamin <b>watches</b> sci-fi films in his free time.<br>Stella <b>plays</b> football in her free time.<br>Alice <b>draws</b> lots of pictures in her free time.</div>
    <p>Com duas pessoas ou mais, <b>sem s</b>:</p>
    <div class="ex">Lisa and Chris <b>play</b> video games on Saturdays.<br>Valentina and her brother <b>watch</b> TV series every evening.</div>
    <p>E para dizer do que <b>você gosta</b>: <b>love / like / enjoy + verbo com -ing</b> → "I <b>love texting</b> my friends."</p>
    <details class="try"><summary>Tente você: monte a frase "Nate and Joel / music / free time".</summary><p>Nate and Joel <b>listen to music</b> in their free time.</p></details>`],
   ["Carlo, Patricia e o Believe it or not",`<p>No listening, dois adolescentes, <b>Carlo</b> e <b>Patricia</b>, contam o que fazem no celular e no computador: usar o computador ou o celular, ouvir música, postar fotos, jogar, conversar com amigos (<b>chat</b>), ver séries e checar as redes sociais (<b>check social media</b>).</p>
    <div class="tbl"><table><tr><th>Glossary</th><th>Significado</th></tr><tr><td>silly</td><td>not serious (bobo)</td></tr><tr><td>sci-fi</td><td>science fiction (ficção científica)</td></tr></table></div>
    <div class="box tip"><span class="lbl">Believe it or not</span><p>Tem gente que faz coisas estranhas no tempo livre, como <b>mooing</b>: imitar o som da vaca, até vestido de vaca. Isso ficou popular nos Estados Unidos, e existe até um festival, o <b>Moo-la-palooza</b>, em <b>Wisconsin</b>.</p></div>`]]},
  {id:"lang15",cap:"LANGUAGE · Ch. 15",t:"Discovering new hobbies",q:"ing/l15",steps:[
   ["O grupo \"Fantastic Four\"",`<p>O capítulo 15 é sobre <b>hobbies diferentes</b>. A escola tem atividades extras novas, e quatro colegas conversam num grupo de mensagens: <b>Luke, Phil, Mandy e Carol</b>.</p>
    <div class="tbl"><table><tr><th>Hobby</th><th>Quem quer fazer</th></tr>
     <tr><td>origami</td><td>Mandy, Carol e Phil</td></tr><tr><td>knitting (tricô)</td><td>Carol (só ela)</td></tr>
     <tr><td>collecting stamps (colecionar selos)</td><td>Luke e Mandy</td></tr><tr><td>magic tricks (truques de mágica)</td><td>Phil e Luke</td></tr></table></div>
    <div class="ex">Phil <b>doesn't want</b> to collect stamps and <b>doesn't like</b> stamps.<br>Mandy <b>doesn't want</b> to do magic tricks.<br><b>Luke</b> has some stamps (não é o Phil).<br>Eles <b>não</b> precisam fazer tudo juntos: podem escolher mais de uma atividade.</div>
    <p><b>Abreviações do chat:</b></p>
    <div class="tbl"><table><tr><th>Abreviação</th><th>Quer dizer</th></tr>
     <tr><td>U · R</td><td>you · are</td></tr><tr><td>IDK</td><td>I don't know</td></tr><tr><td>J4F</td><td>just for fun</td></tr>
     <tr><td>GR8</td><td>great</td></tr><tr><td>me 2</td><td>me too</td></tr><tr><td>2moro</td><td>tomorrow</td></tr>
     <tr><td>L8R</td><td>later</td></tr><tr><td>XO</td><td>kisses and hugs</td></tr><tr><td>CYT</td><td>see you tomorrow</td></tr></table></div>`],
   ["Present simple: negativo",`<p>Para dizer que alguém <b>não</b> faz algo, usamos <b>don't</b> ou <b>doesn't</b> + o verbo <b>sem s</b>:</p>
    <div class="tbl"><table><tr><th>Sujeito</th><th>Negativo</th><th>Exemplo</th></tr>
     <tr><td>I / You / We / They</td><td><b>don't</b> (do not)</td><td>I <b>don't want</b> to do magic tricks.</td></tr>
     <tr><td>He / She / It</td><td><b>doesn't</b> (does not)</td><td>He <b>doesn't want</b> to collect stamps.</td></tr></table></div>
    <div class="box warn"><span class="lbl">Erro comum</span><p>Com <b>doesn't</b>, o verbo <b>perde o s</b>: "She doesn't <b>like</b>", nunca "She doesn't <s>likes</s>". O s já está no doe<b>s</b>n't.</p></div>
    <div class="ex">Stuart <b>likes</b> knitting. → Pete <b>doesn't like</b> knitting.<br>Stuart <b>plays</b> football. → Pete <b>doesn't play</b> football.<br>Stuart <b>has</b> a big stamp collection. → Pete <b>doesn't have</b> a big stamp collection.</div>
    <details class="try"><summary>Tente você: passe para o negativo "Stuart watches a lot of films" (Pete).</summary><p>Pete <b>doesn't watch</b> a lot of films.</p></details>`],
   ["Present simple: perguntas e respostas curtas",`<p>Para perguntar, começamos com <b>Do</b> ou <b>Does</b> e o verbo fica <b>sem s</b>:</p>
    <div class="tbl"><table><tr><th>Pergunta</th><th>Resposta curta</th></tr>
     <tr><td><b>Do</b> you have any ideas?</td><td>Yes, I <b>do</b>. / No, I <b>don't</b>.</td></tr>
     <tr><td><b>Do</b> they play together?</td><td>Yes, they <b>do</b>. / No, they <b>don't</b>.</td></tr>
     <tr><td><b>Does</b> he like stamps?</td><td>Yes, he <b>does</b>. / No, he <b>doesn't</b>.</td></tr>
     <tr><td><b>Does</b> it hurt?</td><td>Yes, it <b>does</b>. / No, it <b>doesn't</b>.</td></tr></table></div>
    <div class="ex"><b>Do</b> → I, you, we, they · <b>Does</b> → he, she, it</div>
    <div class="ex">Does Jack play football? → No, he doesn't. He plays volleyball.<br>Does Alice know how to ride a bike? → Yes, she does.<br>Do you like strawberry ice cream? → No, I don't. I prefer chocolate.</div>
    <details class="try"><summary>Tente você: organize "have / any / you / Do / collections".</summary><p><b>Do you have any collections?</b></p></details>`],
   ["Troca de mensagens",`<p>O texto do capítulo é uma <b>troca de mensagens</b> (<b>message exchange</b>), como num grupo de celular. Características:</p>
    <ul><li>Mensagens <b>curtas</b> e <b>informais</b>, com <b>abreviações</b> (IDK, GR8) e emojis.</li><li>Cada pessoa fala na sua vez, com o <b>nome</b> em cima da mensagem.</li></ul>
    <div class="tbl"><table><tr><th>Comparado com</th><th>Em comum</th><th>Diferença</th></tr>
     <tr><td>dialogue</td><td>pessoas falam em turnos</td><td>a mensagem é escrita</td></tr>
     <tr><td>e-mail</td><td>é escrito e enviado pela internet</td><td>e-mail é mais longo e formal</td></tr>
     <tr><td>letter</td><td>é escrito para alguém</td><td>carta tem saudação e assinatura, e demora a chegar</td></tr>
     <tr><td>interview</td><td>tem perguntas e respostas</td><td>entrevista tem um entrevistador e é mais organizada</td></tr></table></div>`]]},
  {id:"cap14",cap:"CLIL · Ch. 14 · Science",t:"To infinity and beyond!",q:"ing/cap14",steps:[
   ["Do que fala o capítulo",`<p>O capítulo 14 é sobre <b>como os cientistas observam o espaço e se comunicam com ele</b>. A pergunta de abertura é: <i>"Are astronauts on the International Space Station isolated from their families?"</i> (Os astronautas da Estação Espacial Internacional ficam isolados das famílias?)</p>
    <p>A resposta é <b>não</b>: da <b>ISS</b> (International Space Station) eles fazem vídeos, conversam e até fazem transmissões ao vivo. Eles se comunicam usando a <b>Deep Space Network (DSN)</b>, um conjunto de <b>grandes antenas de rádio</b>.</p>
    <div class="tbl"><table><tr><th>English</th><th>Português</th></tr>
     <tr><td>astronomer</td><td>astrônomo</td></tr><tr><td>telescope</td><td>telescópio</td></tr>
     <tr><td>satellite</td><td>satélite</td></tr><tr><td>spacecraft</td><td>nave espacial</td></tr>
     <tr><td>antenna / antennas</td><td>antena / antenas</td></tr><tr><td>radio frequency</td><td>frequência de rádio</td></tr>
     <tr><td>space station</td><td>estação espacial</td></tr><tr><td>stargazing</td><td>observar as estrelas</td></tr>
     <tr><td>comet · asteroid</td><td>cometa · asteroide</td></tr><tr><td>galaxy · constellation</td><td>galáxia · constelação</td></tr></table></div>`],
   ["Why do astronomers study the universe?",`<p>Os <b>astronomers</b> usam muitas ferramentas para analisar, coletar dados, observar e se comunicar com o espaço. O texto dá três motivos para estudar o universo:</p>
    <ol><li>Their studies can <b>generate important data</b> for new technology, the cure for diseases and how our body works. (Geram dados para tecnologia, cura de doenças e para entender o corpo.)</li>
    <li>They can better <b>protect the Earth</b> from global warming, pollution and other threats. (Proteger a Terra.)</li>
    <li>Space research can help countries <b>share data</b>, resources and ideas. (Colaboração entre países.)</li></ol>
    <div class="box warn"><span class="lbl">Não é motivo</span><p>"Because there is nothing to study on Earth" e "Because the universe is beautiful" <b>não</b> aparecem no texto como motivos.</p></div>
    <details class="try"><summary>Tente você: "They can help protect the Earth" é um motivo do texto?</summary><p><b>Sim.</b> Proteger a Terra do aquecimento global e da poluição é um dos motivos.</p></details>`],
   ["Observation tools: Hubble e Spitzer",`<p>A ferramenta de observação mais comum é o <b>telescope</b>. Os telescópios espaciais são muito maiores que os que usamos na Terra. Dois famosos:</p>
    <div class="tbl"><table><tr><th>Hubble Space Telescope</th><th>Spitzer Space Telescope</th></tr>
     <tr><td>recebe comandos pela <b>NASA's Space Network</b>, formada por muitos <b>satellites</b></td><td><b>stayed in space for 6000 days</b> (16 anos)</td></tr>
     <tr><td>transmite numa <b>radio frequency range (S-band)</b></td><td><b>ended its mission</b> em 30 de janeiro de 2020</td></tr>
     <tr><td>coleta <b>more than 3 DVDs of data per day</b></td><td>estudou <b>comets</b> e <b>asteroids</b></td></tr>
     <tr><td><b>average of 18 GB of data per week</b></td><td><b>found a new ring around Saturn</b> (novo anel em Saturno)</td></tr></table></div>
    <details class="try"><summary>Tente você: qual telescópio encontrou um novo anel em Saturno?</summary><p>O <b>Spitzer</b>.</p></details>`],
   ["Communication tools",`<p>As <b>spacecrafts</b> (naves) mandam informações para a Terra através das grandes <b>antennas</b> da <b>Deep Space Network (DSN)</b>. Elas enviam a sua localização e detalhes da nave. Os cientistas também usam a DSN para <b>mandar comandos e instruções</b>.</p>
    <p><b>If the spacecraft is too far away, the antennas have to be bigger.</b> (Quanto mais longe a nave, maiores precisam ser as antenas.) Os dados recebidos pela NASA são processados e compartilhados com laboratórios.</p>
    <div class="ex"><b>Spacecraft</b> → nave espacial · <b>Antennas</b> → antenas (DSN) · <b>Satellites</b> → satélites · <b>Radio frequency</b> → frequência de rádio</div>
    <details class="try"><summary>Tente você: what kinds of tools do astronomers use to observe and communicate with space?</summary><p><b>Space telescopes</b> (Hubble, Spitzer), <b>satellites</b> and the big <b>antennas of the DSN</b>.</p></details>`],
   ["Stargazing: observar o céu de casa",`<p>Mesmo sem ser astronauta, dá para ver estrelas, constelações, a Lua, alguns planetas e partes da galáxia. Isso se chama <b>stargazing</b>.</p>
    <ul><li><b>Binoculars</b> (binóculos) são recomendados para quem está começando.</li><li><b>Telescopes</b> são mais difíceis de usar. O <b>refractor telescope</b> usa uma lente de vidro para focar a luz e formar a imagem.</li></ul>
    <p><b>Tips for stargazing</b> (dicas):</p>
    <ul><li>Normalmente é à noite, mas de dia dá para ver o Sol <b>com filtro e proteção para os olhos</b>. Logo depois do <b>sunset</b> (pôr do sol) já dá para ver coisas interessantes.</li>
    <li>Leve: <b>binoculars or telescopes, a notebook</b> (para desenhar), <b>a flashlight</b> (lanterna), <b>a chair, some snacks</b>.</li>
    <li>Evite a <b>light pollution</b> (poluição luminosa): procure um lugar escuro e um céu sem nuvens. <b>Winter is the best time</b>.</li>
    <li>Na cidade grande, use <b>apps</b> ou visite um <b>observatory</b> ou <b>planetarium</b>.</li></ul>`],
   ["Useful language: either... or",`<p>Para apresentar <b>opções</b>, usamos <b>either ... or</b> (ou ... ou). Para dizer que são <b>todas</b> as coisas, usamos <b>and</b> (e).</p>
    <div class="ex">You can take <b>a star map, a flashlight and a chair</b>. → leva tudo<br>You can take <b>either binoculars or a telescope</b>. → leva um <b>ou</b> outro</div>
    <div class="ex">You can stargaze <b>either</b> during the day <b>or</b> at night.<br>You can <b>either</b> go to the Moon <b>or</b> to Mars.<br>In a spaceship, you can <b>either</b> eat dehydrated <b>or</b> canned food.</div>
    <div class="box tip"><span class="lbl">Para lembrar</span><p><b>either</b> vem antes da primeira opção e <b>or</b> antes da segunda.</p></div>
    <details class="try"><summary>Tente você: una as opções com either... or: "watch a video / read a book".</summary><p>You can <b>either</b> watch a video <b>or</b> read a book.</p></details>`]]},
  {id:"cap15",cap:"CLIL · Ch. 15 · Arts",t:"A picture is worth a thousand words",q:"ing/cap15",steps:[
   ["Do que fala o capítulo",`<p>O título quer dizer "<b>uma imagem vale mais que mil palavras</b>". A pergunta do capítulo é: <i>"Can art communicate?"</i> (A arte comunica?) A resposta é <b>sim</b>: a arte é uma forma de comunicação, um jeito de expressar sentimentos e o que as pessoas pensam sobre a vida.</p>
    <p><b>What is art?</b> Art is how humans express and represent <b>creativity</b> and <b>imagination</b>. A arte <b>visual</b> inclui:</p>
    <div class="ex"><b>painting</b> (pintura) · <b>cartoon</b> (desenho/charge) · <b>photography</b> (fotografia) · <b>sculpture</b> (escultura) · também <b>installation</b> (instalação) e <b>illustration</b> (ilustração)</div>
    <p>A arte também <b>influences local, regional and national cultures</b> e é apreciada pela beleza ou pelo poder emocional.</p>`],
   ["Elements of communication",`<p><b>Communication is how people transmit and share ideas in a meaningful way.</b> Todo processo de comunicação tem estes elementos:</p>
    <div class="tbl"><table><tr><th>Element</th><th>O que é</th></tr>
     <tr><td><b>Transmitter</b></td><td>quem quer comunicar algo (emissor)</td></tr>
     <tr><td><b>Message</b></td><td>o conteúdo que vai ser compartilhado</td></tr>
     <tr><td><b>Code</b></td><td>o sistema de sinais usado (a língua, as cores, os gestos); quem recebe precisa conhecer</td></tr>
     <tr><td><b>Means</b></td><td>o meio que leva a mensagem (telefone, e-mail, rede social, carta)</td></tr>
     <tr><td><b>Receptor</b></td><td>quem recebe a mensagem</td></tr>
     <tr><td><b>Context</b></td><td>a situação em que a comunicação se baseia</td></tr>
     <tr><td><b>Function</b></td><td>o objetivo da comunicação</td></tr></table></div>
    <details class="try"><summary>Tente você: "It is the system of signs that people use to communicate." Qual elemento?</summary><p><b>Code</b>.</p></details>`],
   ["Art as communication",`<p>Palavras <b>não são o único código</b>: a comunicação também acontece por <b>imagens</b>, <b>colours</b> (cores), <b>forms</b> (formas) e outros <b>elements</b> artísticos.</p>
    <p>A arte convida as pessoas a <b>refletir</b>, pode <b>criticar</b> algo ou mostrar beleza. Assim, os artistas comunicam o que <b>veem, sentem e sonham</b>, e quem vê a obra pode ficar <b>reflective, confused or happy</b>.</p>
    <div class="ex">"Art doesn't communicate." → <b>False</b><br>"Artists are observers of the world." → <b>True</b><br>"Communicating is to convey and share ideas in a meaningful way." → <b>True</b></div>`],
   ["Eduardo Kobra",`<p><b>Kobra is a Brazilian artist from São Paulo.</b> É um dos <b>muralists</b> (muralistas) mais famosos do mundo, reconhecido em cinco continentes.</p>
    <ul><li>He <b>spray-painted</b> two of the largest murals in the world: <b>Etnias</b> (2,500 m², Praça Mauá, Rio de Janeiro) and <b>Chocolate</b> (5,742 m², Rodovia Castello Branco, São Paulo). O maior é o <b>Chocolate</b>.</li>
    <li>Começou a grafitar <b>observando</b> artistas que admira, como Banksy e Diego Rivera.</li>
    <li>His work <b>protests against</b> animal exploitation, predatory fishing, <b>global warming</b>, pollution and <b>deforestation</b>.</li>
    <li>He depicts historical personalities who fought against violence: <b>Gandhi, Anne Frank, Malala, Einstein</b>.</li>
    <li>In 2009, he started <b>three-dimensional</b> street art, first on <b>Paulista Avenue</b>.</li>
    <li>His images are <b>hyper-realistic</b>, based on photographs, with <b>strong and contrasting colours</b>.</li></ul>
    <p>Obras famosas: <i>The kiss</i> (New York), <i>Fight for street art</i> (Brooklyn), <i>Maya Plisetskaya</i> (Moscow), <i>Etnias</i> (Rio).</p>
    <details class="try"><summary>Tente você: "Kobra's works of art are all in São Paulo." True or false?</summary><p><b>False.</b> Ele tem obras em vários países: Estados Unidos, Rússia, Itália, Japão…</p></details>`],
   ["Useful language: depicts, shows, has",`<p>Para falar de uma obra de arte, o livro usa estes verbos:</p>
    <div class="ex">Kobra's art <b>depicts</b> historical personalities. (retrata)<br>Kobra's art <b>shows</b> situations in different cultures. (mostra)<br>Kobra's art <b>has</b> strong and contrasting colours. (tem)</div>
    <p><b>Palavras do estilo do Kobra</b> (atividade de completar do livro):</p>
    <div class="ex"><b>THREE-DIMENSIONAL</b> (tridimensional, 3D)<br><b>CONTRASTING COLOURS</b> (cores contrastantes)<br><b>HYPER-REALISTIC</b> (hiper-realista)</div>
    <details class="try"><summary>Tente você: complete "C _ NTR _ ST _ NG C _ L _ _ RS".</summary><p><b>CONTRASTING COLOURS</b>.</p></details>`]]},
  {id:"cap16",cap:"CLIL · Ch. 16 · Geography",t:"Spread the word!",q:"ing/cap16",steps:[
   ["Como a comunicação mudou",`<p>A pergunta do capítulo: <i>"Communication: How has it changed?"</i> As pessoas <b>sempre</b> criaram jeitos de se comunicar:</p>
    <ul><li><b>30,000 BC:</b> antes da escrita, os humanos se comunicavam <b>drawing on cave walls</b> (desenhando nas paredes das cavernas): animais e mãos.</li>
    <li><b>3500 BC:</b> a primeira língua escrita, a <b>Sumerian language</b>, com provas encontradas no <b>Iraq</b>.</li>
    <li>Antes dos correios, <b>pigeons</b> (pombos) levavam mensagens. Foram usados na <b>First World War</b>.</li>
    <li><b>Nowadays</b> (hoje): mobile phones, instant messages, e-mails, TV, radio.</li></ul>
    <div class="box tip"><span class="lbl">BC</span><p><b>BC</b> = <i>Before Christ</i>, o nosso "a.C." (antes de Cristo).</p></div>`],
   ["Why is communication important?",`<p>Segundo o Cambridge Dictionary, <b>communication means to share information with others by speaking, writing, moving your body or using other signals</b>.</p>
    <p>Comunicamos até sem querer: as <b>facial expressions</b> (expressões do rosto) mostram <b>feelings</b>. Uma pessoa <b>talkative</b> (que fala muito) que fica <b>quieter</b> (mais quieta) pode estar tendo um dia ruim.</p>
    <p>Três motivos para a comunicação ser importante:</p>
    <ol><li>It forms <b>relationships</b>: começamos a conversar e <b>interact</b> com um <b>stranger</b> (desconhecido) e viramos amigos.</li>
    <li>People can <b>express</b> themselves and <b>inform</b> others about needs, preferences, opinions and ideas.</li>
    <li>It helps us <b>access and share knowledge</b>: <b>newspapers</b>, <b>books</b> and <b>magazines spread knowledge</b>.</li></ol>
    <div class="tbl"><table><tr><th>My words</th><th>Significado</th></tr><tr><td>talkative</td><td>a person who talks a lot</td></tr><tr><td>quieter</td><td>talking less than usual</td></tr><tr><td>stranger</td><td>someone you don't know</td></tr><tr><td>knowledge</td><td>what we know</td></tr></table></div>`],
   ["Barriers to communication",`<p>Às vezes é difícil se comunicar. Essas dificuldades são as <b>barriers</b> (barreiras):</p>
    <ul><li><b>Noise</b> (barulho): shows, rua movimentada, <b>thunderstorm</b> (tempestade com trovões). Uma saída é <b>read their lips</b> (ler os lábios). Pelo telefone é ainda mais difícil.</li>
    <li><b>Temperature:</b> se está <b>too hot or too cold</b>, fica difícil se concentrar na mensagem.</li>
    <li><b>Technical and technological problems:</b> bad internet connection, low Wi-Fi signal, computer viruses, <b>low battery</b>.</li>
    <li><b>Language:</b> pessoas que não falam a mesma língua. E mesmo falando a mesma língua podem acontecer <b>misunderstandings</b> por causa de <b>accents</b> (sotaques), <b>slang</b> (gírias) e <b>word choice</b> (escolha de palavras).</li>
    <li><b>Distance</b> também é uma barreira.</li></ul>
    <details class="try"><summary>Tente você: "It's not possible to have barriers because of technical problems." True or false?</summary><p><b>False.</b> Internet ruim, bateria fraca e vírus são barreiras técnicas.</p></details>`],
   ["Means of communication and preferences",`<p><b>Means of communication</b> (meios de comunicação) podem ser <b>written</b> (escritos) ou <b>spoken</b> (falados):</p>
    <div class="ex"><b>Written:</b> e-mail, letter, instant text messages, social media posts, newspapers, books, magazines<br><b>Spoken:</b> talking on the phone, video call, face to face, radio, TV</div>
    <p>Para dizer como as pessoas <b>preferem</b> se comunicar, o livro usa verbo de gosto + <b>verbo com -ing</b>:</p>
    <div class="ex"><b>Teenagers love</b> texting their friends.<br><b>Older people prefer</b> talking to family members on the phone.<br><b>Some people don't like</b> writing e-mails.<br><b>Young people enjoy</b> interacting on social media.</div>
    <div class="box warn"><span class="lbl">Atenção</span><p>Depois de <b>enjoy, love, prefer, don't like</b>, o verbo vai com <b>-ing</b>: <i>enjoy talking</i>, não <i>enjoy talk</i>.</p></div>`]]},
  {id:"revisao",cap:"CLIL · Revisão",t:"Vocabulário e expressões",q:"ing/lang",steps:[

    <div class="box tip"><span class="lbl">Como estudar</span><p>Cubra a coluna e diga o significado em português. Depois faça o contrário.</p></div>`],

    <p><b>2. depicts / shows / has</b> (falar de arte):</p><div class="ex">Kobra's art <b>depicts</b> historical personalities.</div>
    <p><b>3. enjoy / love / prefer / don't like + -ing</b> (preferências):</p><div class="ex">Teenagers <b>love texting</b> their friends.</div>
    <details class="try"><summary>Tente você: corrija "My mom prefer talk on the phone".</summary><p>My mom <b>prefers talking</b> on the phone. (Com he/she, o verbo ganha <b>-s</b>: prefers.)</p></details>`]]}

 "port/cap8":[
  ["Qual o principal objetivo de um cartaz de campanha de conscientização?",["Convencer as pessoas a mudar um comportamento","Vender um produto","Contar uma história inventada","Informar o placar de um jogo","Ensinar uma receita"],0,"Campanha quer mudar atitudes, como economizar água.",1],
  ["O que diferencia o anúncio publicitário do cartaz de campanha?",["O anúncio quer vender um produto ou serviço","O anúncio não usa imagens","O cartaz sempre vende algo","Não há diferença","O anúncio é sempre escrito à mão"],0,"Anúncio vende; campanha conscientiza.",2],
  ["Por que o texto de um outdoor costuma ser curto?",["As pessoas leem rápido, de passagem","Falta espaço na rua","É só para crianças","É proibido escrever muito","Outdoor é feito para ler em casa"],0,"Quem passa de carro tem poucos segundos para ler.",1],
  ["Em \"Economize água!\", o verbo está no:",["modo imperativo","modo subjuntivo","gerúndio","particípio","infinitivo"],0,"Imperativo dá ordem, conselho ou pedido.",1],
  ["Qual frase está no imperativo negativo?",["Não jogue lixo na rua.","Eu não jogo lixo na rua.","Se ele não jogasse lixo...","Jogando lixo na rua.","Eu não jogaria lixo na rua."],0,"É uma ordem com \"não\".",2],
  ["\"Girassol\" (gira + sol) é formada por:",["justaposição","aglutinação","não é palavra composta","derivação por prefixo","abreviação"],0,"As duas palavras ficam inteiras.",2],
  ["\"Planalto\" (plano + alto) é formada por:",["aglutinação","justaposição","derivação","abreviação","não é palavra composta"],0,"O \"o\" de plano sumiu.",2],
  ["Qual palavra é formada por justaposição?",["guarda-chuva","embora","aguardente","planalto","fidalgo"],0,"Guarda + chuva, sem perder nada.",2],
  ["\"O mecânico fez o ___ do carro\" e \"Fomos ao ___ da orquestra\":",["conserto / concerto","concerto / conserto","conserto / conserto","concerto / concerto","consserto / concerto"],0,"Conserto é reparo; concerto é apresentação musical.",2],
  ["Palavras homófonas são:",["iguais no som, diferentes na escrita e no sentido","parecidas no som e na escrita","palavras com o mesmo sentido","palavras com sentidos opostos","palavras de outra língua"],0,"Ex.: cela e sela.",2],
  ["\"Ela fez um ___ ao professor\" (saudação):",["cumprimento","comprimento","cumprimente","comprido","compromisso"],0,"Comprimento é medida de tamanho.",2],
  ["Qual par é de parônimos?",["emigrar / imigrar","cela / sela","cem / sem","acender / ascender","sessão / seção"],0,"Os outros pares têm o mesmo som: são homófonos.",3],
  ["Qual destes textos quer VENDER alguma coisa?",["Anúncio publicitário","Cartaz de campanha de vacinação","Carta de reclamação","Reportagem","Poema"],0,"O anúncio mostra vantagens de um produto para vender.",1],
  ["Um cartaz com a frase \"Vacine seu filho!\" é um exemplo de:",["campanha de conscientização","anúncio de venda","notícia","carta pessoal","receita"],0,"Quer mudar um comportamento, não vender.",1],
  ["Linguagem não verbal é aquela que usa:",["imagens, cores e símbolos","só palavras escritas","só palavras faladas","apenas números","rimas"],0,"Verbal = palavras. Não verbal = imagens, cores, gestos.",1],
  ["Em \"Beba mais água!\", qual palavra está no imperativo?",["Beba","mais","água","Beber","Nenhuma"],0,"\"Beba\" é um conselho, uma ordem.",1],
  ["Um slogan é:",["uma frase curta e fácil de lembrar","um texto longo com vários parágrafos","a assinatura do autor","o preço do produto","uma entrevista"],0,"Ex.: \"Beba com moderação.\"",2],
  ["Qual é o imperativo afirmativo de \"desligar\" (você)?",["Desligue","Desligar","Desligando","Desligou","Desligaria"],0,"\"Desligue a luz ao sair.\"",2],
  ["\"Embora\" (em + boa + hora) é formada por:",["aglutinação","justaposição","derivação","abreviação","não é palavra formada"],0,"Juntou e perdeu sons: em boa hora → embora.",2],
  ["\"Passatempo\" é formada por:",["justaposição","aglutinação","derivação","abreviação","onomatopeia"],0,"Passa + tempo, as duas palavras inteiras.",2],
  ["\"Acender\" a luz e \"ascender\" (subir) são palavras:",["homófonas","parônimas","sinônimas","antônimas","compostas"],0,"Mesmo som, escrita e sentido diferentes.",2],
  ["\"O preso ficou na ___\" e \"Coloque a ___ no cavalo\":",["cela / sela","sela / cela","cela / cela","sela / sela","cella / sela"],0,"Cela é prisão; sela é o assento do cavalo.",2],
  ["\"Paguei ___ reais\" e \"Saí ___ guarda-chuva\":",["cem / sem","sem / cem","cem / cem","sem / sem","sen / cem"],0,"Cem é o número 100; sem indica falta.",1],
  ["O anúncio de um tênis diz: \"Corra mais longe. Seja livre.\" Qual é a intenção?",["convencer o leitor a comprar o tênis","informar uma notícia","reclamar de um produto","ensinar a correr","contar uma história real"],0,"Anúncio usa imperativo para convencer a comprar.",2],
  ["Num outdoor, qual recurso é MAIS importante?",["imagem forte e texto curto","texto longo e detalhado","letras pequenas","muitas informações técnicas","nenhuma imagem"],0,"A pessoa vê de passagem, em poucos segundos.",2],
  ["Transforme em imperativo negativo: \"Desperdice comida.\"",["Não desperdice comida.","Nunca desperdiçou comida.","Não desperdiçar comida.","Não desperdiçando comida.","Desperdice não comida."],0,"Imperativo negativo: \"não\" + verbo (não desperdice).",3],
  ["O imperativo pode expressar tudo isto, EXCETO:",["uma dúvida sobre o passado","uma ordem","um conselho","um pedido","um convite"],0,"Dúvida e hipótese são do subjuntivo.",3],
  ["Qual palavra é formada por aglutinação?",["aguardente","girassol","guarda-roupa","passatempo","beija-flor"],0,"Água + ardente: sumiu o \"a\" de água.",3],
  ["Muitos brasileiros ___ para o Japão (saíram do Brasil). Muitos japoneses ___ para o Brasil (entraram).",["emigraram / imigraram","imigraram / emigraram","emigraram / emigraram","imigraram / imigraram","migraram / migraram"],0,"Emigrar = sair do país. Imigrar = entrar no país.",3],
  ["\"Ela agiu com muita ___ e ninguém percebeu.\" (ser discreto)",["discrição","descrição","discreção","descripção","discriçao"],0,"Discrição vem de discreto. Descrição vem de descrever.",3]

 "port/cap9":[
  ["O que diferencia a reportagem da notícia?",["A reportagem aprofunda o assunto, com entrevistas e dados","A reportagem é inventada","A reportagem é mais curta","A reportagem não tem título","A reportagem nunca tem fotos"],0,"Reportagem investiga mais a fundo.",2],
  ["O que não pode faltar numa carta de reclamação?",["A descrição do problema e o pedido de solução","Uma piada","Palavrões para mostrar raiva","Um poema","Uma receita de bolo"],0,"Problema claro + o que você quer que resolvam.",1],
  ["A linguagem de uma carta de reclamação deve ser:",["formal, respeitosa e firme","cheia de gírias","agressiva","rimada","cheia de abreviações de internet"],0,"Educação ajuda a resolver o problema.",1],
  ["\"Li Monteiro Lobato nas férias.\" Qual figura de linguagem?",["metonímia","personificação","comparação","onomatopeia","rima"],0,"O autor está no lugar dos livros dele.",2],
  ["\"Bebi dois copos de suco.\" Há metonímia porque:",["o copo está no lugar do suco","o copo ganhou vida","há um exagero","o suco virou copo","há uma comparação com \"como\""],0,"Recipiente no lugar do conteúdo.",2],
  ["\"O vento sussurrava nas janelas.\" Qual figura?",["personificação","metonímia","comparação","onomatopeia","rima"],0,"Sussurrar é ação humana dada ao vento.",1],
  ["\"Espero que você estude.\" O verbo \"estude\" está no:",["presente do subjuntivo","presente do indicativo","futuro do subjuntivo","gerúndio","pretérito perfeito"],0,"Pista: \"que\" + desejo.",2],
  ["\"Se eu estudasse mais, tiraria nota boa.\" \"Estudasse\" está no:",["pretérito imperfeito do subjuntivo","futuro do subjuntivo","presente do indicativo","infinitivo","presente do subjuntivo"],0,"Pista: \"se\" + hipótese.",3],
  ["\"Quando eu terminar a tarefa, vou brincar.\" \"Terminar\" está no:",["futuro do subjuntivo","infinitivo","imperativo","presente do indicativo","gerúndio"],0,"Parece infinitivo, mas o \"quando\" mostra que é futuro do subjuntivo.",3],
  ["Qual é o gerúndio de \"correr\"?",["correndo","corrido","correr","corra","corri"],0,"Gerúndio termina em -ndo.",1],
  ["As formas nominais do verbo são:",["infinitivo, gerúndio e particípio","presente, passado e futuro","indicativo, subjuntivo e imperativo","singular e plural","primeira, segunda e terceira pessoa"],0,"estudar, estudando, estudado.",2],
  ["\"Terminado o jogo, todos saíram.\" \"Terminado\" é:",["particípio","gerúndio","infinitivo","imperativo","presente do subjuntivo"],0,"Particípio termina em -ado ou -ido.",2],
  ["Qual texto é jornalístico?",["reportagem","conto de fadas","poema","receita","história em quadrinhos"],0,"Reportagem e notícia são textos jornalísticos.",1],
  ["\"As árvores dançavam com o vento.\" Qual figura?",["personificação","metonímia","comparação","rima","nenhuma"],0,"Dançar é ação humana dada às árvores.",1],
  ["O modo subjuntivo expressa:",["dúvida, desejo ou hipótese","uma certeza","uma ordem","só ações do passado","o nome das coisas"],0,"Certeza é do indicativo; ordem é do imperativo.",1],
  ["Qual é o particípio de \"vender\"?",["vendido","vendendo","vender","venda","vendeu"],0,"Particípio termina em -ado ou -ido.",1],
  ["\"Estou lendo um livro.\" O verbo \"lendo\" está no:",["gerúndio","particípio","infinitivo","imperativo","subjuntivo"],0,"Termina em -ndo.",1],
  ["Uma reportagem sobre o lixo nas praias provavelmente vai ter:",["entrevistas, dados e fotos","só a opinião do autor, sem dados","rimas e versos","personagens inventados","instruções de montagem"],0,"Reportagem investiga e ouve várias pessoas.",2],
  ["Numa carta de reclamação, onde vai o pedido de solução?",["depois da explicação do problema","antes da data","no envelope","não precisa colocar","só na assinatura"],0,"Primeiro explica o problema, depois pede a solução.",2],
  ["Qual frase é mais adequada para uma carta de reclamação?",["Solicito a troca do produto com defeito.","Vocês são péssimos!","Quero meu dinheiro agora, seus ladrões!","Tanto faz, não precisa resolver.","kkk o produto quebrou"],0,"Formal, respeitosa e firme.",2],
  ["\"Ouvi Tom Jobim a tarde toda.\" Qual figura?",["metonímia","personificação","comparação","onomatopeia","nenhuma"],0,"O autor no lugar das músicas dele.",2],
  ["\"O relógio preguiçoso não queria andar.\" Qual palavra dá característica humana ao relógio?",["preguiçoso","relógio","andar","não","o"],0,"Preguiça é característica humana: personificação.",2],
  ["Qual frase tem personificação?",["O sol espiava pela janela.","Bebi um copo de leite.","Li Machado de Assis.","O céu está azul.","Comprei um caderno."],0,"Espiar é ação humana dada ao sol.",2],
  ["Complete: \"Quando você ___ (chegar), me avise.\"",["chegar","chega","chegou","chegando","chegaria"],0,"\"Quando\" pede o futuro do subjuntivo: quando você chegar.",2],
  ["Em \"Estudar é importante\", o verbo está no:",["infinitivo","gerúndio","particípio","imperativo","futuro do subjuntivo"],0,"Terminação -ar, sem \"quando\" ou \"se\": infinitivo.",2],
  ["Os direitos do consumidor no Brasil estão no:",["Código de Defesa do Consumidor","Código de Justiniano","Estatuto da Criança","Dicionário","Manual do produto"],0,"É a lei que protege quem compra.",3],
  ["\"A cidade inteira foi ao jogo.\" Há metonímia porque:",["\"cidade\" está no lugar das pessoas da cidade","a cidade ganhou vida de verdade","há uma comparação","há rima","o jogo é uma pessoa"],0,"O lugar está no lugar de quem mora nele.",3],
  ["Qual frase tem metonímia?",["Comi dois pratos de arroz.","A lua sorriu para mim.","O rio chorava baixinho.","O vento cantava.","A casa é grande."],0,"Prato no lugar da comida. As outras são personificação ou não têm figura.",3],
  ["Complete: \"Se eu ___ (ter) dinheiro, compraria um livro.\"",["tivesse","tenho","tiver","tenha","tinha"],0,"\"Se\" + hipótese: pretérito imperfeito do subjuntivo.",3],
  ["Complete: \"Espero que vocês ___ (vencer) o jogo.\"",["vençam","vencem","venceram","vencendo","vencer"],0,"\"Que\" + desejo: presente do subjuntivo.",3],

 "geo/acao":[

const $ = s=>document.querySelector(s);
let NS = "alice:"; // prefixo do armazenamento local; muda por usuário depois do login
let ROLE = "local"; // "local" (sem login), "aluno" ou "tutor"
let STUDENT = {id:null,nome:"Alice"}, TUTOR = null;
const store = {
  get(k,d){try{const v=localStorage.getItem(NS+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(NS+k,JSON.stringify(v))}catch(e){}}
};
const S = {
  checks:store.get("checks",{}), lessons:store.get("lessons",{}), best:store.get("best",{}),
  erros:store.get("erros",{}), tabBest:store.get("tabBest",0),
  meta:store.get("meta",{}), activity:store.get("activity",[]), jogos:store.get("jogos",{})
};
const save = k=>store.set(k,S[k]);
/* toda alteração passa por aqui: guarda quando mudou, para a sincronização saber o que é mais novo */
function setItem(kind,id,val){
  if(ROLE==="tutor" && kind!=="checks") return; // tutor só marca blocos; treinos dele não contam
  if(val) S[kind][id]=val; else delete S[kind][id];
  S.meta[kind+":"+id]=Date.now(); save(kind); save("meta"); schedulePush();
}
function logAct(txt,force){
  if(ROLE==="tutor" && !force) return;
  S.activity.unshift({t:Date.now(),txt:(ROLE==="tutor"?"Tutor: ":"")+txt}); S.activity=S.activity.slice(0,60); save("activity"); schedulePush();
}
const WD=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const pad=n=>String(n).padStart(2,"0");
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return iso(new Date())}
function parse(s){return new Date(s+"T12:00")}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function dLong(s){const d=parse(s);return `${WD[d.getDay()]}, ${d.getDate()} de ${MES[d.getMonth()]}`}
function dShort(s){const d=parse(s);return `${WD[d.getDay()].slice(0,3)} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`}
function examDone(d){const t=today();return d<t||(d===t&&new Date().getHours()>=EXAM_HOUR_END)}
function nextExam(){return EXAM_DAYS.find(e=>!examDone(e.d))}
function whenTxt(d){const n=daysBetween(today(),d);return n<0?"feita":n===0?"hoje":n===1?"amanhã":`em ${n} dias`}
const pill=s=>`<span class="pill" style="--c:${SUBJ[s].c}">${SUBJ[s].n}</span>`;
const lessonKey=(s,id)=>s+"/"+id;
const findLesson=(s,id)=>LESSONS[s].find(l=>l.id===id);
function linkInfo(link){ // tipo de atividade de um passo do bloco
  if(!link) return "No livro ou no caderno";
  return {T:"Tabuada relâmpago",L:"Lição",Q:"Treino de questões",G:"Jogo do Laboratório"}[link[0]]||"";
}
function blockId(date,i){return date+"-"+i}
const stepKey=(date,i,k)=>`${date}-${i}-${k}`;
function stepDone(key){return !!store.get("passos",{})[key]}
function setStep(key,v){const o=store.get("passos",{}); if(v) o[key]=1; else delete o[key]; store.set("passos",o)}
let BLK=null; // passo aberto a partir da tela do bloco: {date,i,k,link}
function blkComplete(link){ if(BLK&&BLK.link===link) setStep(stepKey(BLK.date,BLK.i,BLK.k),1) }
function blkNextHtml(link){ // botão para seguir o roteiro do bloco no fim de uma atividade
  if(!BLK||BLK.link!==link) return "";
  const st=dayOf(BLK.date)[2][BLK.i][3];
  const k=st.findIndex((x,j)=>j>BLK.k&&!stepDone(stepKey(BLK.date,BLK.i,j)));
  if(k<0) return `<button class="btn primary block" data-bloco="${BLK.date}|${BLK.i}">Voltar ao roteiro do bloco ${ICON.arrow}</button>`;
  return `<button class="btn primary block" data-step-go="${BLK.date}|${BLK.i}|${k}">Próximo passo: ${st[k][0]} ${ICON.arrow}</button>`;
}
function nextBlockOf(date,i){ // próximo bloco não feito no mesmo dia, depois do bloco i
  const day=dayOf(date); if(!day) return -1;
  return day[2].findIndex((b,j)=>j>i&&!S.checks[blockId(date,j)]);
}
function dayOf(date){return DAYS.find(d=>d[0]===date)}
function examOn(date){const e=EXAM_DAYS.find(x=>x.d===date);return e?e.s:[]}
function qPool(s,t){
  const keys = t==="all"||t==="erros"||t==="dificil" ? TOPICS[s].map(x=>s+"/"+x[0]) : [s+"/"+t];
  let list = keys.flatMap(k=>(Q[k]||[]).map((q,i)=>({id:k+"#"+i,q})));
  if(t==="erros") list=list.filter(x=>S.erros[x.id]);
  if(t==="dificil") list=list.filter(x=>x.q[4]===3);
  return list;
}
function errCount(s){return qPool(s,"erros").length}
const LVL={1:"Fácil",2:"Média",3:"Difícil"};
function lvlCount(list){const c={1:0,2:0,3:0}; list.forEach(x=>c[x.q?x.q[4]:x[4]]++); return `${c[1]} fáceis · ${c[2]} médias · ${c[3]} difíceis`}
function subjLessonsDone(s){const L=LESSONS[s];return [L.filter(l=>S.lessons[lessonKey(s,l.id)]).length,L.length]}
function badge(pct){if(pct==null) return `<span class="score-badge">novo</span>`;return `<span class="score-badge ${pct>=80?"good":pct>=60?"mid":"low"}">${pct}%</span>`}

let toastT;
function toast(msg,action,label){
  const t=$("#toast"); t.innerHTML=`<span>${msg}</span>${action?`<button id="toast-act">${label}</button>`:""}`; t.hidden=false;
  if(action) $("#toast-act").onclick=()=>{t.hidden=true;action()};
  clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,action?9000:3500);
}

function go(name,p={}){
  V={name,p}; render(); window.scrollTo({top:0});
  try{history.replaceState(null,"","#"+(TOP[name]||name))}catch(e){}
}
function openLink(link){
  if(!link) return;
  if(link[0]==="T"){ tabSet(link.slice(2)); return go("tabuada") }
  const [k,r]=link.split(":");
  if(k==="G") return startGame(r);
  const [s,rest]=r.split("/"), [t,range]=rest.split("@");
  if(k==="L"){
    if(range){ const [from,to]=range.split("-").map(Number); return go("licao",{s,id:t,i:from,from,to}) }
    return go("licao",{s,id:t,i:0});
  }
  startQuiz(s,t);
}
document.querySelectorAll("[data-nav]").forEach(b=>{
  const n=b.dataset.nav; b.innerHTML=ICON[n]+`<span>${NAV[n]}</span>`; b.onclick=()=>go(n);
});

function stackTables(){
  document.querySelectorAll("#main .tbl table").forEach(t=>{
    const head=t.rows[0]; if(!head||head.cells.length<3||[...head.cells].some(c=>c.tagName!=="TH")) return;
    const names=[...head.cells].map(c=>c.textContent.trim());
    t.classList.add("stack");
    [...t.rows].slice(1).forEach(r=>[...r.cells].forEach((c,i)=>{if(names[i]) c.dataset.label=names[i]}));
  });
}
function render(){
  APP_READY=true;
  document.querySelectorAll("[data-nav]").forEach(b=>{ if(b.dataset.nav===TOP[V.name]) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current") });
  const html = ({inicio:vInicio,agenda:vAgenda,materias:vMaterias,materia:vMateria,licao:vLicao,bloco:vBloco,praticar:vPraticar,quiz:vQuiz,tabuada:vTabuada,jogos:vJogos,jogo:vJogo,progresso:vProgresso})[V.name](V.p);
  const banner=ROLE==="tutor"?`<div class="flag" style="background:var(--pen-soft);color:var(--pen)">Modo tutor · acompanhando ${STUDENT.nome}. Treinos feitos aqui não contam para ela.</div>`:"";
  $("#main").innerHTML=`<div class="view">${banner}${html}</div>`;
  stackTables();
  if(P.running&&P.end<=Date.now()) setTimeout(()=>pFinish(true)); // o tempo acabou com o app fechado: avisa agora, já com a conta carregada
  if(V.name==="tabuada") tabMount();
  if(V.name==="jogo") gameMount();
}

function sessionCard(){
  const t=today(), day=dayOf(t);
  if(!day){
    const nd=DAYS.find(d=>d[0]>t);
    return `<section class="card session"><h3>Sessão de estudo</h3><p class="muted">${nd?`Hoje não tem sessão marcada. A próxima é ${dLong(nd[0]).toLowerCase()}, às ${nd[1]}h.`:"O cronograma terminou."}</p></section>`;
  }
  const [date,start,blocks]=day; const end=start+blocks.length;
  const doneN=blocks.filter((b,i)=>S.checks[blockId(date,i)]).length;
  const nowI=blocks.findIndex((b,i)=>!S.checks[blockId(date,i)]);
  const ex=examOn(date);
  return `<section class="card session">
    <div class="sec-title"><div><span class="eyebrow">Sessão de hoje</span><h3 style="margin-top:2px">${pad(start)}h às ${pad(end)}h</h3></div><span class="frac${doneN===blocks.length?" full":""}">${doneN} de ${blocks.length} blocos</span></div>
    ${ex.length?`<span class="flag">Hoje teve prova de ${ex.map(s=>SUBJ[s].n).join(" e ")}</span>`:""}
    <ul class="blist">${blocks.map((b,i)=>blockRow(date,start,b,i,i===nowI)).join("")}</ul>

      :`<p class="flag" style="background:var(--ok-soft);color:var(--ok)">Sessão concluída! Agora é descansar.</p>`}
    <p class="endnote">Nos últimos 10 minutos, ela explica para você uma coisa que aprendeu hoje.</p>
  </section>`;
}
function blockRow(date,start,b,i,now){

    <button class="go-btn" data-bloco="${date}|${i}" aria-label="Abrir o roteiro do bloco ${b[1]}">${ICON.arrow}</button>
  </li>`;
}
function vBloco({date,i}){

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let qz=null;
function startQuiz(s,t){
  const list=shuffle(qPool(s,t)).sort((a,b)=>a.q[4]-b.q[4]).map(x=>({...x,opts:shuffle(x.q[1].map((o,k)=>({o,ok:k===x.q[2]})))}));

  }

    ${a?`<div class="fb ${a.ok?"ok":"no"}"><b>${a.ok?"Acertou!":"Quase! Vai para o caderno de erros."}</b><span>${it.q[3]}</span></div>

function answer(k){
  const it=qz.list[qz.i], ok=it.opts[k].ok; qz.answered={k,ok};
  const lv=qz.lv[it.q[4]]; lv[1]++; if(ok) lv[0]++;

/* =========================================================
   Tabuada relâmpago
   ========================================================= */
let tb={state:"idle",score:0,miss:[],a:0,b:0,ans:"",end:0,iv:null,flash:"",tables:null};
function tabSet(str){ clearInterval(tb.iv); tb={state:"idle",score:0,miss:[],a:0,b:0,ans:"",end:0,iv:null,flash:"",tables:str?str.split(",").map(Number):null} }
const tabName=()=>tb.tables?"Tabuada do "+tb.tables.join(" e do "):"Tabuada relâmpago";
const tabLink=()=>"T"+(tb.tables?":"+tb.tables.join(","):"");
function tabNew(){ // com tabuada escolhida, um dos fatores é sempre dela
  let a,b;
  do{ a=tb.tables?pick(tb.tables):2+Math.floor(Math.random()*9); b=2+Math.floor(Math.random()*9); if(!tb.tables&&Math.random()<.5)[a,b]=[b,a] }
  while(a===tb.a&&b===tb.b);
  tb.a=a; tb.b=b; tb.ans="";
}
function vTabuada(){
  const head=`<button class="back" data-nav2="jogos">${ICON.left} Laboratório</button><div class="hello"><span class="eyebrow">Aquecimento · 60 segundos</span><h1>${tabName()}</h1></div>`;
  if(tb.state==="idle") return head+`<section class="card step" style="justify-items:center;text-align:center"><p class="muted">Responda o máximo de contas em 60 segundos. Pode usar o teclado da tela. Dá para jogar mais de uma rodada.</p>${tb.tables?"":`<p>Recorde: <b>${S.tabBest}</b></p>`}<button class="btn primary" data-tab-start>${ICON.play} Começar</button></section>`;
  if(tb.state==="end"){
    const uniq=[...new Set(tb.miss)];
    return head+`<section class="card result" style="display:grid"><div class="ring" style="--p:${Math.min(100,tb.score*5)}"><div>${tb.score}</div></div><h2>${tb.score} acertos</h2>
      ${tb.tables?"":tb.score>=S.tabBest&&tb.score>0?`<p class="flag">Novo recorde!</p>`:`<p class="muted">Recorde: ${S.tabBest}</p>`}
      ${blkNextHtml(tabLink())}
      ${uniq.length?`<div class="box warn" style="text-align:left;width:100%"><span class="lbl">Treinar estas</span><p>${uniq.join(" · ")}</p></div>`:""}
      <div class="row" style="justify-content:center"><button class="btn primary" data-tab-start>Jogar de novo</button><button class="btn" data-nav2="praticar">Sair</button></div></section>`;
  }
  return head+`<section class="card step" style="gap:18px"><div class="row between"><span class="qnum">✓ <span id="tb-score">${tb.score}</span></span><span class="qnum" id="tb-time">60s</span></div>
    <div class="progress" style="--c:var(--mat)"><i id="tb-bar" style="width:100%"></i></div>
    <div class="tab-q" id="tb-q">${tb.a} × ${tb.b}</div><div class="tab-ans" id="tb-ans">&nbsp;</div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-key="${n}">${n}</button>`).join("")}<button data-key="del" aria-label="Apagar">⌫</button><button data-key="0">0</button><button class="okk" data-key="ok">OK</button></div></section>`;
}
function tabMount(){
  if(tb.state!=="run") return;
  clearInterval(tb.iv);
  tb.iv=setInterval(()=>{
    const left=Math.max(0,(tb.end-Date.now())/1000);
    const tEl=$("#tb-time"); if(!tEl){clearInterval(tb.iv);tb.state="idle";return}
    tEl.textContent=Math.ceil(left)+"s"; $("#tb-bar").style.width=(100*left/60)+"%";
    if(left<=0){clearInterval(tb.iv); tb.state="end"; if(!tb.tables&&tb.score>S.tabBest){S.tabBest=tb.score; save("tabBest"); schedulePush()} logAct(`${tabName()}: ${tb.score} acertos`); blkComplete(tabLink()); render()}
  },200);
}
function tabKey(k){
  if(tb.state!=="run"||tb.flash) return;
  const el=$("#tb-ans");
  if(k==="del") tb.ans=tb.ans.slice(0,-1);
  else if(k==="ok"){
    if(!tb.ans) return;
    const right=tb.a*tb.b, ok=+tb.ans===right;
    if(ok){tb.score++; el.className="tab-ans ok"} else {tb.miss.push(`${tb.a}×${tb.b}=${right}`); el.className="tab-ans no"; el.textContent=`${tb.ans} → ${right}`}
    tb.flash="1"; $("#tb-score").textContent=tb.score;
    setTimeout(()=>{tb.flash=""; tabNew(); const q=$("#tb-q"); if(q){q.textContent=`${tb.a} × ${tb.b}`; el.className="tab-ans"; el.innerHTML="&nbsp;"}}, ok?250:1200);
    return;
  } else if(tb.ans.length<3) tb.ans+=k;
  el.innerHTML=tb.ans||"&nbsp;";
}
document.addEventListener("keydown",e=>{
  if(V.name!=="tabuada"||tb.state!=="run") return;
  if(/^\d$/.test(e.key)) tabKey(e.key); else if(e.key==="Backspace") tabKey("del"); else if(e.key==="Enter") tabKey("ok");
});

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-open],[data-subj],[data-lesson],[data-lesson-at],[data-step],[data-opt],[data-next],[data-quit],[data-again],[data-psubj],[data-nav2],[data-start],[data-tab-start],[data-key]");
  if(!el) return;
  const d=el.dataset;
  if(d.open!==undefined) return openLink(d.open);
  if(d.subj) return go("materia",{s:d.subj});
  if(d.lesson){const [s,id]=d.lesson.split("/"); return go("licao",{s,id,i:0})}
  if(d.lessonAt){const [s,id,i]=d.lessonAt.split("/"); return go("licao",{s,id,i:+i,from:+i,to:findLesson(s,id).steps.length-1})}
  if(d.step){
    const p=V.p, l=findLesson(p.s,p.id), n=l.steps.length, lo=p.from??0, hi=p.to??n-1, ni=p.i+(+d.step);
    if(ni>hi){
      if(hi>=n-1&&!S.lessons[lessonKey(p.s,p.id)]){setItem("lessons",lessonKey(p.s,p.id),true); logAct(`Concluiu a lição ${l.t} (${SUBJ[p.s].n})`)}
      blkComplete(lessonLink(p));
      return go("licao",{...p,fin:true})}
    if(ni>=lo) go("licao",{...p,i:ni}); return;
  }
  if(d.opt!==undefined) return answer(+d.opt);
  if(d.next!==undefined){qz.i++; qz.answered=null; render(); window.scrollTo({top:0}); return}
  if(d.quit!==undefined){pracSubj=qz?.s||pracSubj; qz=null; return go("praticar")}
  if(d.again!==undefined) return startQuiz(qz.s,qz.t);
  if(d.psubj){pracSubj=d.psubj; return render()}
  if(d.nav2) return go(d.nav2);
  if(d.start){
    const [date,i]=d.start.split("|"), st=dayOf(date)[2][+i][3];
    const k=st.findIndex((x,j)=>!stepDone(stepKey(date,+i,j)));
    return k<0||!st[k][1] ? go("bloco",{date,i:+i}) : openStep(date,+i,k);
  }
  if(d.tabStart!==undefined){tb={state:"run",score:0,miss:[],a:0,b:0,ans:"",end:Date.now()+60000,iv:null,flash:"",tables:tb.tables}; tabNew(); return render()}
  if(d.key) return tabKey(d.key);
});
function openStep(date,i,k){ // abre um passo do roteiro e liga o cronômetro do bloco
  const link=dayOf(date)[2][i][3][k][1];
  BLK={date,i,k,link}; pomoForBlock(date,i); openLink(link);
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-bloco],[data-step-go],[data-step-ck],[data-blk-done]"); if(!el) return;
  const d=el.dataset;
  if(d.bloco){const [date,i]=d.bloco.split("|"); return go("bloco",{date,i:+i})}
  if(d.stepGo){const [date,i,k]=d.stepGo.split("|"); return openStep(date,+i,+k)}
  if(d.stepCk){const [date,i,k]=d.stepCk.split("|"), key=stepKey(date,i,k); setStep(key,!stepDone(key)); pomoForBlock(date,+i); return render()}
  if(d.blkDone){const [date,i]=d.blkDone.split("|"); setItem("checks",blockId(date,i),true); logAct(`Bloco concluído: ${dayOf(date)[2][+i][1]}`,true); render(); toast("Bloco concluído! Muito bem.")}
});
document.addEventListener("change",e=>{
  const id=e.target.dataset?.ck; if(!id) return;
  setItem("checks",id,e.target.checked);
  if(e.target.checked){const [date,i]=[id.slice(0,10),+id.slice(11)]; logAct(`Bloco concluído: ${dayOf(date)[2][i][1]}`,true)}
  render();

});

/* =========================================================
   Pomodoro (fixo na tela, continua mesmo se fechar a página)
   ========================================================= */
const pstore={get(){try{return JSON.parse(localStorage.getItem("alice:pomo"))||{}}catch(e){return {}}},set(v){try{localStorage.setItem("alice:pomo",JSON.stringify(v))}catch(e){}}};
const P = Object.assign({mode:"foco",running:false,end:0,left:50*60,blk:null,next:null}, pstore.get());
const FOCO=50*60, PAUSA=10*60;
P.dur=()=>P.mode==="foco"?FOCO:PAUSA;
const pSave=()=>pstore.set({mode:P.mode,running:P.running,end:P.end,left:P.left,blk:P.blk,next:P.next});
let actx=null, wake=null, pIv=null;
function beep(){try{if(!actx) return; const t=actx.currentTime;[0,.35,.7].forEach(o=>{const osc=actx.createOscillator(),g=actx.createGain();osc.frequency.value=P.mode==="foco"?660:880;osc.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.25,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.3);osc.start(t+o);osc.stop(t+o+.32)})}catch(e){}}
async function keepAwake(on){try{if(on&&"wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}else if(!on&&wake){await wake.release();wake=null}}catch(e){}}
function pStart(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume()}catch(e){}
  P.running=true; P.end=Date.now()+P.left*1000; pSave(); keepAwake(true); pDraw();
}
function pPause(){P.left=Math.max(0,Math.round((P.end-Date.now())/1000)); P.running=false; pSave(); keepAwake(false); pDraw()}
function pReset(){P.running=false; P.left=P.dur(); pSave(); keepAwake(false); pDraw()}
function pSwap(){P.mode=P.mode==="foco"?"pausa":"foco"; pReset()}
/* Liga o foco de 50 min para o bloco que ela começou (se já não estiver contando para ele). */
function pomoForBlock(date,i){
  const id=`${date}|${i}`;
  if(P.running&&P.mode==="foco"&&P.blk===id) return;
  P.mode="foco"; P.blk=id; P.next=null; P.left=FOCO; pStart();
  toast("Cronômetro ligado: 50 minutos de foco. Bons estudos!");
}
function blockTitle(id){ if(!id) return null; const [date,i]=id.split("|"), day=dayOf(date); return day&&day[2][+i]?{date,i:+i,b:day[2][+i],hr:day[1]+(+i)}:null }
const hhmm=t=>{const d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())};
/* Fim do foco ou da pausa. Se a página estava fechada, desconta o tempo que já passou. */
function pFinish(silent){
  if(!silent){beep(); try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
  const endedAt=P.running?P.end:Date.now();
  if(P.mode==="foco"){
    // o bloco em andamento (ou o primeiro não feito de hoje) é marcado como concluído
    let cur=blockTitle(P.blk);
    if(!cur){const t=today(), day=dayOf(t), i=day?day[2].findIndex((b,j)=>!S.checks[blockId(t,j)]):-1; cur=i>=0?blockTitle(`${t}|${i}`):null}
    if(cur&&!S.checks[blockId(cur.date,cur.i)]){setItem("checks",blockId(cur.date,cur.i),true); logAct(`Bloco concluído: ${cur.b[1]}`,true)}
    const ni=cur?nextBlockOf(cur.date,cur.i):-1;
    P.next=cur&&ni>=0?`${cur.date}|${ni}`:null; P.blk=null;
    P.mode="pausa"; P.left=PAUSA; P.running=true; P.end=endedAt+PAUSA*1000; pSave(); keepAwake(true);
    if(P.end<=Date.now()) return pFinish(true); // a pausa também já acabou enquanto a página estava fechada
    showBreakModal(cur);
  } else {
    P.mode="foco"; P.running=false; P.left=FOCO; pSave(); keepAwake(false);
    showBackModal();
  }
  if(V.name==="inicio"||V.name==="agenda"||V.name==="bloco") render();
  pDraw();
}
function nextHtml(nx){
  const st=nx.b[3].find((x,k)=>!stepDone(stepKey(nx.date,nx.i,k)))||nx.b[3][0];
  return `<div class="next-card" style="--c:${SUBJ[nx.b[0]].c}">${pill(nx.b[0])}<b>${nx.b[1]}</b><span class="muted">Começa com: ${st[0]}</span></div>`;
}
function showBreakModal(cur){
  const nx=blockTitle(P.next);
  modal(`<span class="modal-ic ok">${ICON.cup}</span><h2>Hora da pausa!</h2>
    <p>${cur?`Você completou 50 minutos de foco em <b>${cur.b[1]}</b>. O bloco foi marcado como concluído.`:"Você completou 50 minutos de foco."}</p>
    <p class="muted">São 10 minutos para descansar: beba água, faça um lanche, levante e se alongue. Sem celular.</p>
    ${nx?`<p><b>Quando a pausa acabar, às ${hhmm(P.end)}</b>, a próxima atividade é:</p>${nextHtml(nx)}`
        :`<p><b>Esse foi o último bloco de hoje.</b> Depois da pausa, é descansar. Parabéns pelo esforço!</p>`}
    <button class="btn primary block" data-modal-close>Combinado!</button>`);
}
function showBackModal(){
  const nx=blockTitle(P.next);
  if(!nx) return modal(`<span class="modal-ic ok">${ICON.check}</span><h2>A pausa acabou!</h2><p>A sessão de hoje está concluída. Muito bem!</p><button class="btn primary block" data-modal-close>Fechar</button>`);
  modal(`<span class="modal-ic">${ICON.brain}</span><h2>A pausa acabou!</h2><p>Hora de voltar. A próxima atividade é:</p>${nextHtml(nx)}
    <button class="btn primary block" data-modal-go="${P.next}">${ICON.play} Começar agora</button>
    <button class="btn block" data-modal-close>Daqui a pouco</button>`);
}
function modal(html){$("#toast").hidden=true; const m=$("#modal"); m.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true">${html}</div>`; m.hidden=false; setTimeout(()=>m.querySelector("button")?.focus(),50)}
function closeModal(){$("#modal").hidden=true}
document.addEventListener("click",e=>{
  if(e.target.id==="modal"||e.target.closest("[data-modal-close]")) return closeModal();
  const go_=e.target.closest("[data-modal-go]"); if(!go_) return;
  closeModal(); const [date,i]=go_.dataset.modalGo.split("|"), st=dayOf(date)[2][+i][3];
  const k=st.findIndex((x,j)=>!stepDone(stepKey(date,+i,j)));
  if(k>=0&&st[k][1]) openStep(date,+i,k); else {pomoForBlock(date,+i); go("bloco",{date,i:+i})}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").hidden) closeModal()});
function pDraw(){
  let left=P.running?Math.max(0,Math.ceil((P.end-Date.now())/1000)):P.left;
  if(P.running&&left<=0){ if(!APP_READY||document.body.classList.contains("locked")) left=0; else return pFinish(false) } // antes de o app abrir (ou no login), espera
  const box=$("#pomo"); box.dataset.mode=P.mode;
  const time=pad(Math.floor(left/60))+":"+pad(left%60);
  $("#p-time").textContent=time;
  $("#p-ring").style.strokeDashoffset=(138.2*(1-left/P.dur())).toFixed(1);
  $("#p-ic").innerHTML=P.mode==="foco"?ICON.brain:ICON.cup;
  $("#p-label").textContent=P.mode==="foco"
    ?(P.running?(blockTitle(P.blk)?`Foco · ${blockTitle(P.blk).b[1]}`:"Foco · 50 minutos"):left===P.dur()?"Foco · pronta para começar":"Foco · pausado")
    :(P.running?(blockTitle(P.next)?`Pausa · depois: ${blockTitle(P.next).b[1]}`:"Pausa · água, lanche, levantar"):"Pausa · 10 minutos");
  $("#p-play").innerHTML=P.running?ICON.pause:ICON.play;
  $("#p-play").setAttribute("aria-label",P.running?"Pausar":"Começar");
  document.title=P.running?`${time} · ${P.mode==="foco"?"Foco":"Pausa"}`:"ACE";
}
$("#p-play").onclick=()=>P.running?pPause():pStart();
$("#p-reset").onclick=pReset;
$("#p-swap").onclick=pSwap;
$("#p-reset").innerHTML=ICON.reset; $("#p-swap").innerHTML=ICON.swap;
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&P.running){keepAwake(true);pDraw()}});
pIv=setInterval(()=>{if(P.running) pDraw()},500);
pDraw();
