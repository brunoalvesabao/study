     <li><b>Tabuada do 4:</b> dobro do dobro. 4 × 7 → 14, <b>28</b>.</li></ul></div>
    <details class="try"><summary>Tente você: quanto é 8 × 6 e 9 × 8?</summary><p>8 × 6: 6, 12, 24, <b>48</b>. 9 × 8: começa com 7 e 7 + 2 = 9 → <b>72</b>.</p></details>`],
   ["Valor posicional",`<p>No nosso sistema, o <b>lugar</b> onde o algarismo está muda o valor dele. Em 333, cada 3 vale uma coisa diferente: 300, 30 e 3.</p>
    <p>Depois da vírgula, as casas continuam, cada uma <b>10 vezes menor</b> que a anterior:</p>
    <div class="pv"><span><b>3</b><small>uni&shy;dades</small></span><span class="pv-c">,</span><span><b>4</b><small>déci&shy;mos</small></span><span><b>5</b><small>centé&shy;simos</small></span></div>
    <p>O dinheiro ajuda muito a entender. <b>R$ 3,45</b> é:</p>
    <div class="ex">3 moedas de <b>1 real</b> (3 unidades)<br>4 moedas de <b>10 centavos</b> (4 décimos de real)<br>5 moedas de <b>1 centavo</b> (5 centésimos de real)</div>
    <p>Por isso 1 centavo é <b>um centésimo</b> do real: são precisos 100 centavos para formar 1 real.</p>
    <details class="try"><summary>Tente você: em 7,82, quanto vale o 8? E o 2?</summary><p>O 8 está na casa dos décimos: vale <b>8 décimos</b> (0,8). O 2 está nos centésimos: vale <b>2 centésimos</b> (0,02).</p></details>`],
   ["Frações decimais",`<p>Fração decimal é a que tem 10, 100 ou 1000 embaixo. Ela vira número decimal de um jeito bem simples: <b>a quantidade de zeros de baixo é a quantidade de casas depois da vírgula</b>.</p>
    <div class="tbl"><table><tr><th>Fração</th><th>Decimal</th><th>Como se lê</th></tr>
     <tr><td>1/10</td><td>0,1</td><td>um décimo</td></tr><tr><td>3/10</td><td>0,3</td><td>três décimos</td></tr>
     <tr><td>25/100</td><td>0,25</td><td>vinte e cinco centésimos</td></tr><tr><td>7/100</td><td>0,07</td><td>sete centésimos</td></tr>
     <tr><td>7/1000</td><td>0,007</td><td>sete milésimos</td></tr></table></div>
    <div class="box warn"><span class="lbl">Cuidado</span><p>7/100 é <b>0,07</b>, não 0,7. São dois zeros embaixo, então precisa de duas casas: o 7 fica na segunda casa e a primeira ganha um zero.</p></div>
    <p>Algumas frações comuns também valem decorar: <b>1/2 = 0,5</b> · <b>1/4 = 0,25</b> · <b>3/4 = 0,75</b>.</p>
    <details class="try"><summary>Tente você: escreva 9/100 e 125/1000 como decimais.</summary><p>9/100 → duas casas → <b>0,09</b>. 125/1000 → três casas → <b>0,125</b>.</p></details>`],
   ["Vezes e dividido por 10, 100, 1000",`<p>Multiplicar ou dividir por 10, 100 ou 1000 não precisa de conta armada. Basta <b>andar com a vírgula</b>: uma casa para cada zero.</p>
    <div class="ex">× 10 → vírgula anda <b>1 casa para a direita</b> · × 100 → <b>2 casas</b> · × 1000 → <b>3 casas</b></div>
    <div class="ex">÷ 10 → vírgula anda <b>1 casa para a esquerda</b> · ÷ 100 → <b>2 casas</b> · ÷ 1000 → <b>3 casas</b></div>
    <p>Quando faltar algarismo, <b>complete com zero</b>:</p>
    <div class="ex">4,5 × 10 = <b>45</b><br>3,5 × 100 = 3,50 × 100 = <b>350</b><br>4,5 ÷ 10 = <b>0,45</b><br>4 ÷ 100 → 004 → vírgula 2 casas para a esquerda → <b>0,04</b></div>
    <div class="box tip"><span class="lbl">Para lembrar</span><p>Multiplicar deixa o número <b>maior</b> (vírgula vai para a direita). Dividir deixa <b>menor</b> (vírgula vai para a esquerda). Se o resultado ficou do tamanho errado, a vírgula andou para o lado errado.</p></div>
    <details class="try"><summary>Tente você: 2,37 × 100 e 56 ÷ 1000.</summary><p>2,37 × 100 = <b>237</b>. 56 ÷ 1000 = <b>0,056</b> (três casas para a esquerda, completando com zero).</p></details>`],
   ["Conta armada",`<p><b>Multiplicação:</b> comece pela direita e lembre do "vai um".</p>
    <div class="ex">146 × 3<br>6 × 3 = 18 → escreve <b>8</b>, vai 1<br>4 × 3 = 12, + 1 = 13 → escreve <b>3</b>, vai 1<br>1 × 3 = 3, + 1 = 4 → escreve <b>4</b><br>Resultado: <b>438</b></div>
    <p><b>Divisão:</b> comece pela esquerda. Pergunte "quantas vezes cabe?", multiplique, subtraia e baixe o próximo algarismo.</p>
    <div class="ex">252 ÷ 4<br>25 ÷ 4 = <b>6</b> (4 × 6 = 24), sobra 1<br>baixa o 2 → 12 ÷ 4 = <b>3</b>, sobra 0<br>Resultado: <b>63</b> · Confere: 4 × 63 = 252</div>
    <div class="box tip"><span class="lbl">Sempre confira</span><p>Na divisão, multiplique o resultado pelo divisor. Tem que dar o número do começo.</p></div>
    <details class="try"><summary>Tente você: 215 × 4 e 144 ÷ 6.</summary><p>215 × 4 = <b>860</b>. 144 ÷ 6: 14 ÷ 6 = 2, sobra 2; baixa o 4 → 24 ÷ 6 = 4 → <b>24</b>.</p></details>`]]},
  {id:"decimais",cap:"Cap. 7",t:"Números decimais",q:"mat/decimais",steps:[
   ["Casas decimais e leitura",`<p class="muted">Depende de: valor posicional e frações decimais.</p>
    <p>Número decimal é o que tem vírgula. À esquerda da vírgula fica a <b>parte inteira</b>. À direita, a <b>parte decimal</b>, que é um pedaço menor que 1.</p>
    <div class="pv"><span><b>3</b><small>uni&shy;dades</small></span><span class="pv-c">,</span><span><b>4</b><small>déci&shy;mos</small></span><span><b>7</b><small>centé&shy;simos</small></span><span><b>5</b><small>milé&shy;simos</small></span></div>
    <p><b>Como ler:</b> leia a parte inteira, diga "inteiros" e depois leia a parte decimal inteira de uma vez, com o nome da <b>última casa</b>.</p>
    <div class="ex">0,5 → cinco <b>décimos</b><br>2,07 → dois inteiros e sete <b>centésimos</b><br>3,475 → três inteiros e quatrocentos e setenta e cinco <b>milésimos</b></div>
    <div class="box tip"><span class="lbl">Zero no fim não muda nada</span><p>0,5 = 0,50 = 0,500. Cinco décimos é o mesmo que cinquenta centésimos. Isso vai ser muito útil para comparar e somar.</p></div>
    <details class="try"><summary>Tente você: como se lê 12,06?</summary><p>Doze inteiros e seis <b>centésimos</b> (a última casa é a dos centésimos).</p></details>`],
   ["Comparar decimais",`<p>Para saber qual número é maior:</p>
    <ol><li>Compare primeiro a <b>parte inteira</b>. Quem tiver a maior já ganhou.</li><li>Se a parte inteira for igual, <b>complete com zeros</b> até os dois terem a mesma quantidade de casas.</li><li>Agora compare como se fossem números sem vírgula.</li></ol>
    <div class="ex">2,3 e 1,99 → parte inteira 2 é maior que 1 → <b>2,3 é maior</b></div>
    <div class="ex">0,5 e 0,45 → 0,<b>50</b> e 0,<b>45</b> → 50 é mais que 45 → <b>0,5 é maior</b></div>
    <div class="ex">1,09 e 1,9 → 1,<b>09</b> e 1,<b>90</b> → <b>1,9 é maior</b></div>
    <div class="box warn"><span class="lbl">Erro comum</span><p>Achar que 0,45 é maior "porque 45 é maior que 5". Sem completar com zero, você está comparando centésimos com décimos, que são tamanhos diferentes.</p></div>
    <details class="try"><summary>Tente você: coloque em ordem crescente 0,3 · 0,25 · 0,305.</summary><p>Com três casas: 0,300 · 0,250 · 0,305. Em ordem: <b>0,25 · 0,3 · 0,305</b>.</p></details>`],
   ["Somar e subtrair",`<p>A regra de ouro: <b>vírgula embaixo de vírgula</b>. Assim, décimo fica embaixo de décimo e centésimo embaixo de centésimo. Onde faltar casa, coloque zero.</p>
    <div class="ex">&nbsp;&nbsp;2,50<br>+ 1,35<br>= <b>3,85</b></div>
    <p>Número inteiro também tem vírgula, só que escondida no fim: <b>5 = 5,0</b> e <b>10 = 10,00</b>.</p>
    <div class="ex">5 − 1,8 → 5,0 − 1,8 = <b>3,2</b><br>10 − 3,75 → 10,00 − 3,75 = <b>6,25</b></div>
    <p><b>Com dinheiro:</b> Alice comprou um caderno de R$ 12,50 e um lápis de R$ 1,75. Pagou com R$ 20,00.</p>
    <div class="ex">Total: 12,50 + 1,75 = <b>14,25</b><br>Troco: 20,00 − 14,25 = <b>5,75</b></div>
    <details class="try"><summary>Tente você: 6,3 + 2,48 e 8 − 2,6.</summary><p>6,30 + 2,48 = <b>8,78</b>. 8,0 − 2,6 = <b>5,4</b>.</p></details>`],
   ["Multiplicar",`<ol><li>Multiplique como se <b>não houvesse vírgula</b>.</li><li>Conte quantas casas depois da vírgula os <b>dois números têm juntos</b>.</li><li>No resultado, conte essa quantidade de casas da direita para a esquerda e coloque a vírgula.</li></ol>
    <div class="ex">1,2 × 3 → 12 × 3 = 36 → 1 casa no total → <b>3,6</b></div>
    <div class="ex">0,4 × 0,2 → 4 × 2 = 8 → 1 + 1 = 2 casas → 0,0<b>8</b> → <b>0,08</b></div>
    <div class="ex">2,5 × 1,2 → 25 × 12 = 300 → 2 casas → 3,00 → <b>3</b></div>
    <div class="box warn"><span class="lbl">Erro comum</span><p>Na multiplicação <b>não</b> se alinha a vírgula como na soma. Faz a conta toda sem vírgula e só no fim conta as casas.</p></div>
    <details class="try"><summary>Tente você: 0,6 × 0,5 e 3,4 × 2.</summary><p>6 × 5 = 30 → 2 casas → 0,30 = <b>0,3</b>. 34 × 2 = 68 → 1 casa → <b>6,8</b>.</p></details>`],
   ["Dividir",`<p><b>Decimal dividido por inteiro:</b> faça a conta armada normalmente. Quando passar pela vírgula, coloque a vírgula no resultado.</p>
    <div class="ex">7,5 ÷ 3 → 7 ÷ 3 = <b>2</b>, sobra 1 → passou a vírgula, coloca vírgula → baixa o 5: 15 ÷ 3 = <b>5</b> → <b>2,5</b><br>Confere: 3 × 2,5 = 7,5 ✓</div>
    <p><b>Divisão por decimal:</b> iguale as casas dos dois números (completando com zero) e depois tire as vírgulas.</p>
    <div class="ex">1,2 ÷ 0,4 → mesma quantidade de casas → 12 ÷ 4 = <b>3</b><br>4,8 ÷ 0,6 → 48 ÷ 6 = <b>8</b><br>3 ÷ 0,5 → 3,0 ÷ 0,5 → 30 ÷ 5 = <b>6</b></div>
    <p><b>Quando a conta não é exata:</b> coloque vírgula e continue com zero. 7 ÷ 2 → 3, sobra 1 → 7,0 → <b>3,5</b>.</p>
    <details class="try"><summary>Tente você: 9,6 ÷ 4 e 2,4 ÷ 0,6.</summary><p>9,6 ÷ 4 = <b>2,4</b> (4 × 2,4 = 9,6). 2,4 ÷ 0,6 → 24 ÷ 6 = <b>4</b>.</p></details>`],
   ["Potenciação",`<p>Potência é uma multiplicação repetida. O <b>expoente</b> (o número pequeno em cima) diz quantas vezes a <b>base</b> aparece na multiplicação.</p>
    <div class="ex">5² = 5 × 5 = <b>25</b> (lê-se "cinco ao quadrado")<br>2³ = 2 × 2 × 2 = <b>8</b> (lê-se "dois ao cubo")</div>
    <p>Com decimais é igual. Depois é só usar a regra das casas da multiplicação:</p>
    <div class="ex">0,3² = 0,3 × 0,3 → 3 × 3 = 9 → 2 casas → <b>0,09</b><br>1,2² = 1,2 × 1,2 → 12 × 12 = 144 → 2 casas → <b>1,44</b><br>0,2³ = 0,2 × 0,2 × 0,2 → 8 → 3 casas → <b>0,008</b></div>
    <div class="box warn"><span class="lbl">Erro comum</span><p>Fazer 0,3² = 0,6 (multiplicou por 2) ou 0,9 (esqueceu de contar as casas). O expoente <b>não</b> multiplica a base.</p></div>
    <details class="try"><summary>Tente você: 0,5² e 1,1².</summary><p>0,5 × 0,5 = <b>0,25</b>. 1,1 × 1,1 → 11 × 11 = 121 → <b>1,21</b>.</p></details>`],
   ["Resolvendo problemas",`<p>Na prova, os decimais aparecem em problemas, quase sempre com dinheiro, medidas ou litros. Use sempre o mesmo roteiro:</p>
    <ol><li><b>Leia duas vezes</b> e descubra o que a pergunta quer.</li><li><b>Separe os dados</b> (os números e o que cada um significa).</li><li><b>Escolha a conta:</b> juntar é somar, tirar ou troco é subtrair, repetir é multiplicar, repartir é dividir.</li><li><b>Faça a conta</b> e <b>confira</b> se o resultado faz sentido.</li></ol>
    <div class="ex"><b>Problema:</b> Três amigos dividiram igualmente uma conta de R$ 37,50. Quanto cada um pagou?<br>Repartir → dividir: 37,50 ÷ 3 = <b>12,50</b><br>Confere: 3 × 12,50 = 37,50 ✓</div>
    <div class="ex"><b>Problema:</b> Uma fita de 4,8 m foi cortada em pedaços de 0,6 m. Quantos pedaços?<br>Quantas vezes cabe → dividir: 4,8 ÷ 0,6 → 48 ÷ 6 = <b>8 pedaços</b></div>
    <details class="try"><summary>Tente você: um suco custa R$ 3,50. Quanto custam 4 sucos? E qual o troco de R$ 20?</summary><p>3,50 × 4 = <b>R$ 14,00</b>. Troco: 20,00 − 14,00 = <b>R$ 6,00</b>.</p></details>`]]},
  {id:"porcentagem",cap:"Cap. 8",t:"Porcentagem",q:"mat/porcentagem",steps:[
   ["O que é porcentagem",`<p class="muted">Depende de: frações, divisão, decimais.</p>
    <p>O símbolo <b>%</b> quer dizer "<b>de cada 100</b>". Pense num quadro com 100 quadradinhos: 30% são 30 quadradinhos pintados de 100.</p>
    <p>Toda porcentagem pode ser escrita de três jeitos, que valem a mesma coisa:</p>
    <div class="tbl"><table><tr><th>%</th><th>Fração</th><th>Decimal</th></tr>
     <tr><td>50%</td><td>50/100 = 1/2</td><td>0,5</td></tr><tr><td>25%</td><td>25/100 = 1/4</td><td>0,25</td></tr>
     <tr><td>75%</td><td>75/100 = 3/4</td><td>0,75</td></tr><tr><td>10%</td><td>10/100 = 1/10</td><td>0,1</td></tr>
     <tr><td>20%</td><td>20/100 = 1/5</td><td>0,2</td></tr><tr><td>100%</td><td>100/100</td><td>1 (o inteiro)</td></tr></table></div>
    <div class="box tip"><span class="lbl">Para lembrar</span><p>100% é o todo. 50% é metade. Mais que 100% é mais do que o todo (como um aumento).</p></div>
    <details class="try"><summary>Tente você: escreva 40% como fração e como decimal.</summary><p>40% = 40/100 = <b>2/5</b> = <b>0,4</b>.</p></details>`],
   ["Os atalhos",`<p>Quase toda conta de porcentagem da prova sai com estes atalhos, sem conta armada:</p>
    <div class="tbl"><table><tr><th>%</th><th>Atalho</th><th>de R$ 80</th></tr>
     <tr><td>50%</td><td>metade (÷ 2)</td><td>40</td></tr><tr><td>25%</td><td>÷ 4 (metade da metade)</td><td>20</td></tr>
     <tr><td>10%</td><td>÷ 10</td><td>8</td></tr><tr><td>20%</td><td>2 × 10%</td><td>16</td></tr>
     <tr><td>5%</td><td>metade de 10%</td><td>4</td></tr><tr><td>1%</td><td>÷ 100</td><td>0,80</td></tr></table></div>
    <p><b>Juntando atalhos</b> você faz qualquer porcentagem "quebrada":</p>
    <div class="ex">15% de 200 → 10% (20) + 5% (10) = <b>30</b><br>35% de 200 → 30% (60) + 5% (10) = <b>70</b><br>75% de 40 → 50% (20) + 25% (10) = <b>30</b></div>
    <details class="try"><summary>Tente você: 30% de 90 e 5% de 60.</summary><p>10% de 90 = 9 → 30% = <b>27</b>. 10% de 60 = 6 → 5% = <b>3</b>.</p></details>`],
   ["Calcular qualquer porcentagem",`<p>Quando o atalho não serve, use a regra geral: <b>divida por 100 e multiplique pela porcentagem</b>. É o mesmo que achar 1% e repetir.</p>
    <div class="ex">12% de 250<br>1% de 250 = 250 ÷ 100 = 2,5<br>12% = 12 × 2,5 = <b>30</b></div>
    <p><b>Descobrir a porcentagem:</b> quando a pergunta é "quantos por cento", monte a fração e transforme em /100.</p>
    <div class="ex">Alice acertou 18 de 20 questões.<br>18/20 → multiplica em cima e embaixo por 5 → 90/100 = <b>90%</b></div>
    <div class="ex">3 de cada 5 alunos preferem futebol → 3/5 = 60/100 = <b>60%</b></div>
    <details class="try"><summary>Tente você: 8% de 150. E 12 de 40 é quantos por cento?</summary><p>1% de 150 = 1,5 → 8 × 1,5 = <b>12</b>. 12/40 = 3/10 = 30/100 = <b>30%</b>.</p></details>`],
   ["Desconto",`<p>Desconto é quando o preço <b>diminui</b>. Primeiro calcule quanto é o desconto, depois tire do preço.</p>
    <div class="ex">Tênis de R$ 150 com 20% de desconto<br>20% de 150: 10% = 15 → 20% = <b>30</b><br>Preço final: 150 − 30 = <b>R$ 120</b></div>
    <p><b>Atalho:</b> com 20% de desconto você paga 100% − 20% = <b>80%</b> do preço.</p>
    <div class="ex">80% de 150 → 10% = 15 → 8 × 15 = <b>R$ 120</b> (mesmo resultado)</div>
    <div class="box warn"><span class="lbl">Erro comum</span><p>Parar no meio e responder o valor do desconto (R$ 30) quando a pergunta era o preço final (R$ 120). Leia de novo o que a pergunta quer.</p></div>
    <details class="try"><summary>Tente você: uma blusa de R$ 80 com 25% de desconto.</summary><p>25% de 80 = 20. Preço final: 80 − 20 = <b>R$ 60</b>.</p></details>`],
   ["Acréscimo e multa",`<p>Acréscimo é quando o valor <b>aumenta</b>: aumento de salário, multa por atraso, juros. Calcule a porcentagem e <b>some</b>.</p>
    <div class="ex">Salário de R$ 1.000 com aumento de 5%<br>5% de 1.000: 10% = 100 → 5% = <b>50</b><br>Novo salário: 1.000 + 50 = <b>R$ 1.050</b></div>
    <div class="ex">Conta de luz de R$ 120 com 10% de multa<br>10% de 120 = 12 → total: 120 + 12 = <b>R$ 132</b></div>
    <p><b>Atalho:</b> com 10% de acréscimo você paga 110% do valor.</p>
    <details class="try"><summary>Tente você: um produto de R$ 200 aumentou 15%. Qual o novo preço?</summary><p>15% de 200 = 20 + 10 = 30. Novo preço: <b>R$ 230</b>.</p></details>`],
   ["Educação financeira",`<p>Na hora de comprar, o preço anunciado nem sempre é o que você paga. Antes de decidir, <b>faça as contas</b>.</p>
    <p><b>À vista ou parcelado?</b> Multiplique a parcela pelo número de parcelas e compare com o preço à vista.</p>
    <div class="ex">Bola: R$ 40 à vista ou 4 × R$ 11<br>Parcelado: 4 × 11 = <b>R$ 44</b><br>À vista é <b>R$ 4 mais barato</b></div>
    <div class="ex">Celular: R$ 600 à vista ou 10 × R$ 65<br>Parcelado: 10 × 65 = <b>R$ 650</b> → R$ 50 a mais</div>
    <p><b>Comparar lojas:</b> calcule o preço final em cada uma. Loja A: R$ 500 com 10% de desconto = R$ 450. Loja B: R$ 470. A loja A é mais barata, mesmo tendo o preço anunciado maior.</p>
    <div class="box tip"><span class="lbl">Consumo consciente</span><p>Antes de comprar, pergunte: eu preciso disso? Cabe no meu dinheiro? Existe opção mais barata?</p></div>
    <details class="try"><summary>Tente você: R$ 90 à vista ou 3 × R$ 32. Qual compensa?</summary><p>3 × 32 = 96. À vista é <b>R$ 6 mais barato</b>.</p></details>`]]},
  {id:"probabilidade",cap:"Cap. 8",t:"Probabilidade e contagem",q:"mat/probabilidade",steps:[
   ["O que é probabilidade",`<p class="muted">Depende de: frações e multiplicação.</p>
    <p>Probabilidade é a <b>chance</b> de algo acontecer. Ela aparece em experimentos em que não dá para saber o resultado antes: jogar um dado, uma moeda, sortear uma bolinha.</p>
    <p>O conjunto de <b>todos os resultados possíveis</b> se chama <b>espaço amostral</b>.</p>
    <div class="ex">Moeda: {cara, coroa} → 2 resultados<br>Dado: {1, 2, 3, 4, 5, 6} → 6 resultados<br>Saco com 3 azuis e 2 vermelhas → 5 bolinhas</div>
    <details class="try"><summary>Tente você: quantos resultados tem o espaço amostral de sortear uma letra da palavra BOLA?</summary><p><b>4</b> resultados: B, O, L, A.</p></details>`],
   ["Como calcular",`<div class="ex"><b>Probabilidade = casos que eu quero ÷ casos possíveis</b></div>
    <div class="ex">Sair 4 num dado → quero 1 caso de 6 → <b>1/6</b><br>Sair par num dado → pares: 2, 4, 6 → 3 de 6 → 3/6 = <b>1/2</b><br>Tirar vermelha (3 azuis e 2 vermelhas) → 2 de 5 → <b>2/5</b></div>
    <p>A resposta pode ser dada como fração, decimal ou porcentagem: <b>1/2 = 0,5 = 50%</b> · <b>1/4 = 0,25 = 25%</b> · <b>2/5 = 0,4 = 40%</b>.</p>
    <div class="box warn"><span class="lbl">Erro comum</span><p>Colocar embaixo só os casos que eu <b>não</b> quero. Com 3 azuis e 2 vermelhas, a chance de vermelha é 2/<b>5</b> (o total), não 2/3.</p></div>
    <details class="try"><summary>Tente você: num dado, qual a chance de sair um número maior que 4?</summary><p>Maiores que 4: 5 e 6 → 2 de 6 = 2/6 = <b>1/3</b>.</p></details>`],
   ["Impossível, provável e certo",`<p>A probabilidade vai sempre de <b>0</b> a <b>1</b> (ou de 0% a 100%).</p>
    <div class="tbl"><table><tr><th>Valor</th><th>Quer dizer</th><th>Exemplo</th></tr>
     <tr><td>0</td><td>impossível</td><td>sair 7 num dado comum</td></tr>
     <tr><td>1/2</td><td>mesma chance de acontecer ou não</td><td>cara numa moeda</td></tr>
     <tr><td>1</td><td>certeza</td><td>sair um número de 1 a 6 num dado</td></tr></table></div>
    <p><b>Mais provável</b> é o que tem mais casos. Num saco com 4 verdes, 3 amarelas e 1 branca, a verde é a mais provável (4/8) e a branca a menos provável (1/8).</p>
    <details class="try"><summary>Tente você: num saco só com bolinhas vermelhas, qual a chance de tirar azul?</summary><p><b>0</b>: é impossível, porque não existe bolinha azul.</p></details>`],
   ["Árvore de possibilidades",`<p>A árvore ajuda a <b>não esquecer nenhum resultado</b>. Cada escolha abre novos galhos. Uma moeda jogada 2 vezes:</p>${ARVORE_SVG}
    <p>No fim de cada galho está um resultado: cara-cara, cara-coroa, coroa-cara, coroa-coroa. São <b>4 resultados</b>.</p>
    <div class="ex">Chance de sair duas caras: 1 de 4 → <b>1/4</b><br>Chance de sair uma cara e uma coroa (em qualquer ordem): 2 de 4 → <b>1/2</b></div>
    <details class="try"><summary>Tente você: e se a moeda for jogada 3 vezes?</summary><p>Cada lançamento dobra os galhos: 2 × 2 × 2 = <b>8 resultados</b>.</p></details>`],
   ["Princípio fundamental da contagem",`<p>Quando uma escolha acontece em <b>etapas</b>, o total de possibilidades é a <b>multiplicação</b> das opções de cada etapa.</p>
    <div class="ex">3 camisetas × 2 bermudas = <b>6 roupas</b><br>3 pães × 2 recheios × 2 sucos = <b>12 lanches</b><br>4 sabores × 3 casquinhas = <b>12 sorvetes</b></div>
    <p><b>Quando a opção não pode repetir</b>, cada etapa tem uma opção a menos:</p>
    <div class="ex">De quantas formas 3 amigos podem ficar em fila?<br>1º lugar: 3 opções · 2º: sobram 2 · 3º: sobra 1 → 3 × 2 × 1 = <b>6</b></div>
    <div class="box warn"><span class="lbl">Erro comum</span><p>Somar (3 + 2 = 5) em vez de multiplicar. Cada camiseta combina com <b>cada</b> bermuda, por isso multiplica.</p></div>
    <details class="try"><summary>Tente você: com 2 calças, 3 camisetas e 2 tênis, quantos visuais?</summary><p>2 × 3 × 2 = <b>12 visuais</b>.</p></details>`]]},
  {id:"plano",cap:"Cap. 9",t:"Plano cartesiano e vistas",q:"mat/plano",steps:[
   ["Eixos e origem",`<p>O plano cartesiano é como um mapa feito com duas retas numeradas que se cruzam:</p>
    <ul><li>O eixo <b>x</b> é o <b>deitado</b> (horizontal).</li><li>O eixo <b>y</b> é o <b>em pé</b> (vertical).</li><li>Eles se cruzam na <b>origem</b>, o ponto <b>(0, 0)</b>.</li></ul>
    <div class="box tip"><span class="lbl">Para lembrar</span><p>Primeiro o x se deita, depois o y se levanta. Como no alfabeto: x vem antes de y.</p></div>
    <p>Ele é usado em mapas, jogos (como batalha naval), telas de computador e gráficos.</p>`],
   ["Par ordenado",`<p>Cada ponto tem um endereço com dois números entre parênteses: <b>(x, y)</b>. O primeiro diz quanto <b>andar para o lado</b>; o segundo, quanto <b>subir</b>.</p>${PLANO_SVG}
    <div class="ex">A(3, 2): sai da origem, anda <b>3 para a direita</b> e sobe <b>2</b><br>B(1, 4): anda <b>1 para a direita</b> e sobe <b>4</b></div>
    <div class="box warn"><span class="lbl">A ordem importa</span><p>(3, 2) e (2, 3) são pontos <b>diferentes</b>. Trocar a ordem é o erro mais comum da prova.</p></div>
    <details class="try"><summary>Tente você: partindo de (2, 3), andei 3 casas para a direita. Onde cheguei?</summary><p>Andar para o lado muda só o x: 2 + 3 = 5 → <b>(5, 3)</b>.</p></details>`],
   ["Pontos em cima dos eixos",`<p>Se um dos números é zero, o ponto fica <b>em cima de um eixo</b>:</p>
    <div class="ex">x = 0 → não andou para o lado → fica <b>no eixo y</b>. Ex.: (0, 4)<br>y = 0 → não subiu → fica <b>no eixo x</b>. Ex.: (6, 0)<br>(0, 0) → é a <b>origem</b></div>
    <p><b>Ler um ponto no desenho:</b> desça até o eixo x e leia o número (esse é o x). Depois vá até o eixo y e leia (esse é o y).</p>
    <p><b>Qual está mais à direita?</b> O que tem o maior x. <b>Qual está mais alto?</b> O que tem o maior y.</p>
    <details class="try"><summary>Tente você: (7, 1), (1, 8) e (5, 5). Qual está mais alto? E mais à direita?</summary><p>Mais alto: maior y → <b>(1, 8)</b>. Mais à direita: maior x → <b>(7, 1)</b>.</p></details>`],
   ["Ampliação e redução",`<p>Para <b>ampliar</b> uma figura, multiplique <b>as duas coordenadas</b> de todos os vértices pelo mesmo número. Para <b>reduzir</b>, divida.</p>
    <div class="ex">Triângulo com vértices (1, 1), (3, 1) e (1, 2)<br>Ampliado ×2 → <b>(2, 2), (6, 2) e (2, 4)</b></div>
    <div class="ex">Reduzir pela metade: (4, 8) → <b>(2, 4)</b> · (6, 10) → <b>(3, 5)</b></div>
    <p>A figura ampliada ou reduzida tem <b>a mesma forma</b>, só muda o tamanho. Os ângulos continuam iguais.</p>
    <div class="box warn"><span class="lbl">Erro comum</span><p>Multiplicar só o x ou só o y. Assim a figura fica esticada e deixa de ser uma ampliação.</p></div>
    <details class="try"><summary>Tente você: o ponto (2, 1) virou (6, 3). A figura foi ampliada quantas vezes?</summary><p>2 × 3 = 6 e 1 × 3 = 3 → ampliada <b>3 vezes</b>.</p></details>`],
   ["Vistas e planta baixa",`<p>Um objeto pode ser desenhado visto de <b>frente</b>, de <b>lado</b> ou de <b>cima</b>. Cada vista mostra uma forma diferente:</p>
    <div class="tbl"><table><tr><th>Objeto</th><th>De frente</th><th>De cima</th></tr>
     <tr><td>Lata de refrigerante</td><td>retângulo</td><td>círculo</td></tr>
     <tr><td>Caixa de sapato</td><td>retângulo</td><td>retângulo</td></tr>
     <tr><td>Cone de trânsito</td><td>triângulo</td><td>círculo</td></tr></table></div>
    <p>A <b>planta baixa</b> é a casa vista <b>de cima</b>, como se tirassem o telhado. Ela mostra os cômodos, as portas e as janelas, mas não mostra alturas.</p>
    <div class="box tip"><span class="lbl">Atividade</span><p>Pegue uma caixa de remédio e desenhe como ela aparece de frente, de lado e de cima.</p></div>
    <details class="try"><summary>Tente você: uma bola vista de qualquer lado parece o quê?</summary><p>Um <b>círculo</b>, de qualquer lado.</p></details>`]]}
 ],
 port:[
  {id:"generos",cap:"Cap. 8",t:"Cartaz, anúncio e outdoor",q:"port/cap8",steps:[
   ["Textos que querem convencer",`<p>O capítulo 8 é sobre textos que tentam <b>convencer o leitor</b> de alguma coisa. Eles se chamam textos <b>persuasivos</b> (persuadir = convencer).</p>
    <p>Três deles caem na prova: o <b>cartaz de campanha</b>, o <b>anúncio publicitário</b> e o <b>outdoor</b>. Todos juntam:</p>
    <ul><li><b>Linguagem verbal:</b> as palavras escritas.</li><li><b>Linguagem não verbal:</b> imagens, cores, símbolos, tipo de letra.</li></ul>
    <p>O que muda entre eles é o <b>objetivo</b> (o que o texto quer que você faça) e o <b>lugar</b> onde aparecem.</p>`],
   ["Cartaz de campanha",`<p>Quer que as pessoas <b>mudem um comportamento</b> para o bem de todos: economizar água, se vacinar, não jogar lixo na rua, respeitar a faixa de pedestres.</p>
    <p><b>Quem faz:</b> governos, escolas, ONGs, hospitais. <b>Não vende nada.</b></p>
    <div class="ex"><b>Exemplo:</b> imagem de uma torneira pingando e a frase<br>"<b>Feche a torneira. Cada gota conta.</b>"<br>Embaixo: logotipo da prefeitura.</div>
    <p><b>Características:</b> imagem forte, texto curto, <b>slogan</b> (frase fácil de lembrar) e verbos no <b>imperativo</b> (feche, vacine, economize).</p>`],
   ["Anúncio publicitário",`<p>Quer <b>vender</b> um produto ou serviço. Mostra as vantagens e tenta despertar o desejo de comprar.</p>
    <p><b>Quem faz:</b> empresas e lojas.</p>
    <div class="ex"><b>Exemplo:</b> foto de um tênis colorido e a frase<br>"<b>Corra mais longe. Seja livre.</b>"<br>Embaixo: a marca e o preço.</div>
    <p><b>Recursos que o anúncio usa para convencer:</b></p>
    <ul><li>Adjetivos positivos: <i>novo, incrível, macio, o melhor</i>.</li><li>Verbos no imperativo: <i>compre, experimente, aproveite</i>.</li><li>Slogan e marca bem visíveis.</li><li>Imagens bonitas, pessoas felizes usando o produto.</li></ul>
    <details class="try"><summary>Tente você: "Vacine seu filho!" é cartaz de campanha ou anúncio?</summary><p><b>Cartaz de campanha</b>: quer mudar um comportamento e não está vendendo nada.</p></details>`],
   ["Outdoor",`<p>O outdoor é um anúncio (ou campanha) <b>gigante, na rua</b>, em placas enormes.</p>
    <p>Quem vê está passando de carro, ônibus ou a pé, e tem <b>poucos segundos</b> para ler. Por isso o outdoor tem:</p>
    <ul><li><b>Texto muito curto</b>, às vezes só uma frase.</li><li><b>Imagem forte</b> e cores chamativas.</li><li>Letras grandes, que dá para ler de longe.</li></ul>
    <div class="box warn"><span class="lbl">Pegadinha</span><p>O texto do outdoor é curto por causa do <b>tempo de leitura</b> de quem passa, não por falta de espaço.</p></div>`],
   ["Comparando os três",`<div class="tbl"><table><tr><th></th><th>Objetivo</th><th>Onde</th></tr>
     <tr><td><b>Cartaz de campanha</b></td><td>mudar um comportamento</td><td>escolas, postos, ruas</td></tr>
     <tr><td><b>Anúncio</b></td><td>vender</td><td>revistas, internet, TV</td></tr>
     <tr><td><b>Outdoor</b></td><td>vender ou conscientizar</td><td>placas grandes na rua</td></tr></table></div>
    <div class="box tip"><span class="lbl">Pergunta-chave</span><p>Na prova, pergunte: <b>o texto quer vender alguma coisa?</b> Se sim, é anúncio. Se quer mudar uma atitude, é campanha.</p></div>
    <details class="try"><summary>Tente você: "Não dirija depois de beber. Sua vida vale mais." é o quê?</summary><p><b>Campanha de conscientização</b>: não vende nada, quer mudar um comportamento. Repare no imperativo negativo "não dirija".</p></details>`]]},
  {id:"imperativo",cap:"Cap. 8",t:"Modo imperativo",q:"port/cap8",steps:[
   ["Para que serve",`<p>O <b>modo imperativo</b> é o jeito do verbo usado para <b>dar ordem, conselho, pedido ou convite</b>. É o modo preferido de cartazes, anúncios, receitas e manuais.</p>
    <div class="ex">Ordem: <b>Feche</b> a porta.<br>Conselho: <b>Beba</b> mais água.<br>Pedido: <b>Ajude</b> a manter a escola limpa.<br>Convite: <b>Venha</b> conhecer nossa loja!</div>
    <p>Repare que no imperativo quase nunca aparece o sujeito: a gente fala direto com o leitor (você).</p>`],
   ["Como formar",`<p>No dia a dia, o imperativo que mais aparece é o que fala com <b>você</b>. Ele segue um padrão fácil:</p>
    <div class="tbl"><table><tr><th>Verbo</th><th>Imperativo (você)</th></tr>
     <tr><td>economiz<b>ar</b></td><td>economiz<b>e</b></td></tr><tr><td>desligar</td><td>deslig<b>ue</b></td></tr>
     <tr><td>beb<b>er</b></td><td>beb<b>a</b></td></tr><tr><td>abr<b>ir</b></td><td>abr<b>a</b></td></tr>
     <tr><td>vir</td><td>venha</td></tr></table></div>
    <div class="box tip"><span class="lbl">Truque</span><p>Verbos terminados em <b>-ar</b> ganham <b>-e</b> (compre, ande). Verbos em <b>-er</b> e <b>-ir</b> ganham <b>-a</b> (beba, abra).</p></div>
    <details class="try"><summary>Tente você: qual o imperativo de "reciclar" e de "escrever"?</summary><p><b>Recicle</b> e <b>escreva</b>.</p></details>`],
   ["Afirmativo e negativo",`<p>O imperativo pode ser <b>afirmativo</b> (manda fazer) ou <b>negativo</b> (manda não fazer). O negativo é só colocar <b>não</b> antes do verbo.</p>
    <div class="ex">Afirmativo: <b>Economize</b> água. <b>Jogue</b> o lixo no lixo.<br>Negativo: <b>Não desperdice</b> água. <b>Não jogue</b> lixo na rua.</div>
    <div class="box warn"><span class="lbl">Atenção</span><p>"Não desperdiçar comida" <b>não</b> é imperativo, é infinitivo. O imperativo negativo é "<b>Não desperdice</b> comida".</p></div>
    <div class="box tip"><span class="lbl">Atividade</span><p>Achar 3 verbos no imperativo em propagandas, embalagens ou receitas de casa.</p></div>
    <details class="try"><summary>Tente você: passe "Pise na grama" para o imperativo negativo.</summary><p><b>Não pise</b> na grama.</p></details>`]]},
  {id:"formacao",cap:"Cap. 8",t:"Formação de palavras",q:"port/cap8",steps:[
   ["O que é formação de palavras",`<p>A língua não para de criar palavras. Muitas palavras novas nascem <b>juntando palavras que já existem</b>. Estudar "formação de palavras" é descobrir <b>como</b> cada palavra foi montada.</p>
    <div class="ex"><b>Palavra simples:</b> tem uma palavra só por dentro. <i>sol, flor, chuva, tempo</i><br><b>Palavra composta:</b> é feita juntando duas ou mais palavras. <i>girassol, guarda-chuva, passatempo</i></div>
    <p>Esse jeito de juntar palavras se chama <b>composição</b>. E existem <b>dois tipos</b> de composição, que caem na prova:</p>
    <ol><li><b>Justaposição:</b> as palavras se juntam <b>sem perder nada</b>.</li><li><b>Aglutinação:</b> as palavras se juntam e <b>algum som some</b>.</li></ol>
    <p>Os próximos passos explicam cada um, com vários exemplos.</p>`],
   ["Justaposição",`<p>Na justaposição, as palavras ficam <b>lado a lado</b>, cada uma inteirinha. Nenhuma letra e nenhum som se perde. Pode ter hífen ou não.</p>
    <div class="ex">gira + sol = <b>girassol</b> (o s dobra só por causa da escrita, o som continua o mesmo)<br>passa + tempo = <b>passatempo</b><br>guarda + chuva = <b>guarda-chuva</b><br>beija + flor = <b>beija-flor</b><br>segunda + feira = <b>segunda-feira</b><br>para + quedas = <b>paraquedas</b></div>
    <details class="try"><summary>Tente você: "couve-flor" é formada por justaposição? Por quê?</summary><p><b>Sim.</b> couve + flor: as duas palavras aparecem inteiras.</p></details>`],
   ["Aglutinação",`<p>Na aglutinação, as palavras se juntam tanto que <b>se "grudam"</b> e alguma parte some: uma letra, um som, às vezes até muda o acento.</p>
    <div class="ex">plano + alto = <b>planalto</b> (sumiu o "o" de plano)<br>em + boa + hora = <b>embora</b> (sumiram vários sons)<br>água + ardente = <b>aguardente</b> (sumiu o "a" de água)<br>filho + de + algo = <b>fidalgo</b><br>perna + alta = <b>pernalta</b> (ave de pernas longas)</div>
    <div class="box tip"><span class="lbl">Dica</span><p>"Aglutinar" quer dizer <b>grudar, fundir</b>. Pense em duas bolinhas de massinha amassadas juntas: uma parte some na emenda.</p></div>`],
   ["Como diferenciar",`<p>Separe a palavra nas partes que a formaram e confira:</p>
    <div class="box tip"><span class="lbl">Truque</span><p>As duas palavras aparecem <b>inteiras</b>? → <b>justaposição</b>.<br>Falta <b>algum pedaço</b>? → <b>aglutinação</b>.</p></div>
    <div class="tbl"><table><tr><th>Palavra</th><th>Partes</th><th>Tipo</th></tr>
     <tr><td>girassol</td><td>gira + sol</td><td>justaposição</td></tr><tr><td>planalto</td><td>plan(o) + alto</td><td>aglutinação</td></tr>
     <tr><td>guarda-roupa</td><td>guarda + roupa</td><td>justaposição</td></tr><tr><td>aguardente</td><td>água(a) + ardente</td><td>aglutinação</td></tr></table></div>
    <details class="try"><summary>Tente você: classifique "passatempo" e "embora".</summary><p>passatempo → passa + tempo, inteiras → <b>justaposição</b>. embora → em boa hora, perdeu sons → <b>aglutinação</b>.</p></details>`]]},
  {id:"ortografia",cap:"Cap. 8",t:"Ortografia: homófonas e parônimos",q:"port/cap8",steps:[
   ["O que é ortografia",`<p><b>Ortografia</b> é o jeito <b>correto de escrever</b> as palavras (orto = correto, grafia = escrita).</p>
    <p>Algumas palavras confundem muito porque têm o <b>som igual</b> ou <b>quase igual</b> a outra, mas a escrita e o significado são diferentes. Trocar uma pela outra muda o sentido da frase.</p>
    <div class="ex">O mecânico fez o <b>conserto</b> do carro. (reparo)<br>Fomos ao <b>concerto</b> da orquestra. (apresentação musical)</div>
    <p>Neste capítulo você estuda dois grupos dessas palavras:</p>
    <ul><li><b>Homófonas:</b> som <b>igual</b>, escrita diferente.</li><li><b>Parônimos:</b> som e escrita <b>parecidos</b>, mas não iguais.</li></ul>
    <p>Para escolher a certa, o segredo é sempre o mesmo: <b>olhar o sentido da frase</b>.</p>`],
   ["Palavras homófonas",`<p>Homo = igual, fono = som. São palavras com <b>o mesmo som</b>, mas escrita e significado diferentes.</p>
    <div class="tbl"><table><tr><th>Palavra</th><th>Significado</th></tr>
     <tr><td>conserto</td><td>reparo, arrumar algo</td></tr><tr><td>concerto</td><td>apresentação musical</td></tr>
     <tr><td>cela</td><td>quarto da prisão</td></tr><tr><td>sela</td><td>assento do cavalo</td></tr>
     <tr><td>cem</td><td>o número 100</td></tr><tr><td>sem</td><td>indica falta</td></tr>
     <tr><td>acender</td><td>ligar a luz, pôr fogo</td></tr><tr><td>ascender</td><td>subir</td></tr>
     <tr><td>sessão</td><td>tempo de um evento (sessão de cinema)</td></tr><tr><td>seção</td><td>parte, setor (seção de brinquedos)</td></tr></table></div>
    <div class="ex">Paguei <b>cem</b> reais. · Saí <b>sem</b> guarda-chuva.<br>O preso ficou na <b>cela</b>. · Coloque a <b>sela</b> no cavalo.</div>
    <details class="try"><summary>Tente você: "A ___ de cinema começa às 15h" (sessão ou seção)?</summary><p><b>Sessão</b>: é o tempo em que o filme passa.</p></details>`],
   ["Parônimos",`<p>Parônimos são palavras <b>parecidas</b> na escrita e no som, mas <b>não iguais</b>, e com significados diferentes.</p>
    <div class="tbl"><table><tr><th>Palavra</th><th>Significado</th></tr>
     <tr><td>cumprimento</td><td>saudação ("bom dia!")</td></tr><tr><td>comprimento</td><td>medida de tamanho</td></tr>
     <tr><td>emigrar</td><td>sair do seu país</td></tr><tr><td>imigrar</td><td>entrar em outro país</td></tr>
     <tr><td>descrição</td><td>ato de descrever</td></tr><tr><td>discrição</td><td>ser discreto, reservado</td></tr>
     <tr><td>tráfego</td><td>movimento de veículos</td></tr><tr><td>tráfico</td><td>comércio ilegal</td></tr></table></div>
    <div class="ex">Ela fez um <b>cumprimento</b> ao professor. · A mesa tem 2 metros de <b>comprimento</b>.<br>Meu avô <b>emigrou</b> da Itália e <b>imigrou</b> para o Brasil.</div>
    <div class="box tip"><span class="lbl">Truque</span><p><b>E</b>migrar = <b>E</b>xit (sair). <b>I</b>migrar = <b>I</b>n (entrar).</p></div>`],
   ["Como não errar",`<ol><li>Leia a frase inteira e entenda <b>o que ela quer dizer</b>.</li><li>Lembre o significado de cada palavra do par.</li><li>Troque pela palavra que combina com o sentido.</li></ol>
    <div class="box warn"><span class="lbl">Homófona ou parônimo?</span><p>Leia em voz alta. Se o som for <b>exatamente igual</b> (cela/sela), é homófona. Se for só <b>parecido</b> (emigrar/imigrar), é parônimo.</p></div>
    <details class="try"><summary>Tente você: complete: "Ela agiu com ___ e ninguém percebeu" (descrição ou discrição).</summary><p><b>Discrição</b>, de discreto.</p></details>
    <details class="try"><summary>Tente você: "acender" e "ascender" são homófonas ou parônimos?</summary><p><b>Homófonas</b>: o som é igual.</p></details>`]]},
  {id:"reclamacao",cap:"Cap. 9",t:"Reportagem e textos de reclamação",q:"port/cap9",steps:[
   ["Notícia e reportagem",`<p>As duas são textos <b>jornalísticos</b>: contam fatos reais. A diferença está na <b>profundidade</b>.</p>
    <div class="tbl"><table><tr><th>Notícia</th><th>Reportagem</th></tr>
     <tr><td>conta um fato de forma rápida</td><td><b>aprofunda</b> um assunto</td></tr>
     <tr><td>texto curto</td><td>texto longo</td></tr>
     <tr><td>responde o quê, quem, quando, onde</td><td>traz também o porquê, com entrevistas, dados e opiniões diferentes</td></tr></table></div>
    <div class="ex"><b>Notícia:</b> "Praia amanhece com 2 toneladas de lixo após feriado."<br><b>Reportagem:</b> investiga de onde vem o lixo, entrevista moradores, biólogos e a prefeitura, mostra números de outros anos e fotos.</div>`],
   ["Partes da reportagem",`<ul><li><b>Título:</b> chama a atenção.</li><li><b>Linha fina:</b> frase logo abaixo do título, que resume o assunto.</li><li><b>Texto principal:</b> apresenta o problema e as informações.</li><li><b>Entrevistas:</b> falas de pessoas, entre aspas.</li><li><b>Dados:</b> números, pesquisas, gráficos.</li><li><b>Fotos e legendas.</b></li></ul>
    <details class="try"><summary>Tente você: por que a reportagem ouve pessoas diferentes?</summary><p>Para mostrar <b>vários lados</b> do assunto e deixar o leitor mais bem informado.</p></details>`],
   ["Carta de reclamação",`<p>É escrita pelo <b>consumidor</b> quando um produto ou serviço deu problema. O objetivo é <b>explicar o problema e pedir uma solução</b>.</p>
    <p><b>Partes, nesta ordem:</b></p>
    <ol><li>Local e data</li><li>Destinatário (a empresa)</li><li>Explicação do problema, com detalhes: o que comprou, quando, o que aconteceu</li><li>Pedido de solução: troca, conserto ou devolução do dinheiro</li><li>Despedida e assinatura</li></ol>
    <div class="ex">São Paulo, 20 de setembro de 2026.<br>À Loja Bom Preço,<br>No dia 10/09 comprei um fone de ouvido, e depois de três dias o lado esquerdo parou de funcionar.<br><b>Solicito a troca do produto</b> ou a devolução do valor pago.<br>Atenciosamente, Alice.</div>
    <p>Quem compra tem seus direitos garantidos pelo <b>Código de Defesa do Consumidor</b>.</p>`],
   ["Reclamação em postagens",`<p>Hoje muita gente reclama <b>pela internet</b>: nas redes sociais da empresa, nos comentários de uma loja on-line ou em sites próprios para reclamações de consumidores.</p>
    <p>A <b>postagem de reclamação</b> tem o mesmo objetivo da carta (explicar o problema e pedir uma solução), mas muda o formato:</p>
    <div class="tbl"><table><tr><th></th><th>Carta</th><th>Postagem</th></tr>
     <tr><td><b>Tamanho</b></td><td>mais longa</td><td>curta e direta</td></tr>
     <tr><td><b>Partes</b></td><td>local, data, destinatário, assinatura</td><td>título, texto e, às vezes, foto do problema</td></tr>
     <tr><td><b>Quem lê</b></td><td>só a empresa</td><td>a empresa <b>e outras pessoas</b> (é pública)</td></tr>
     <tr><td><b>Linguagem</b></td><td>formal</td><td>clara e respeitosa, um pouco menos formal</td></tr></table></div>
    <div class="ex"><b>Título:</b> Fone parou de funcionar em 3 dias<br>Comprei o fone no dia 10/09 no site da Loja Bom Preço. No dia 13, o lado esquerdo parou de funcionar. Já tentei contato pelo telefone, sem resposta. <b>Peço a troca do produto ou a devolução do dinheiro.</b></div>
    <div class="box warn"><span class="lbl">Cuidado</span><p>Por ser pública, a postagem precisa ser <b>verdadeira e educada</b>. Xingar ou exagerar tira a razão de quem reclama.</p></div>
    <details class="try"><summary>Tente você: o que a postagem e a carta de reclamação têm em comum?</summary><p>As duas <b>explicam o problema</b> e <b>pedem uma solução</b>.</p></details>`],
   ["A linguagem certa",`<p>A carta de reclamação usa linguagem <b>formal, respeitosa e firme</b>. Educação e clareza aumentam a chance de resolver.</p>
    <div class="ex">✓ "Solicito a troca do produto com defeito."<br>✓ "Aguardo retorno no prazo de 7 dias."<br>✗ "Vocês são péssimos!"<br>✗ "kkk o produto quebrou"</div>
    <details class="try"><summary>Tente você: o que não pode faltar numa carta de reclamação?</summary><p>A <b>descrição do problema</b> e o <b>pedido de solução</b>.</p></details>`]]},
  {id:"figuras",cap:"Cap. 9",t:"Metonímia e personificação",q:"port/cap9",steps:[
   ["Figuras de linguagem",`<p>Figuras de linguagem são jeitos <b>diferentes e expressivos</b> de usar as palavras, fora do sentido comum. Elas deixam o texto mais bonito, mais forte ou mais curto.</p>
    <p>Duas caem na prova: <b>metonímia</b> e <b>personificação</b>.</p>`],
   ["Metonímia",`<p>Na metonímia, uma palavra é trocada por outra que tem <b>relação próxima</b> com ela.</p>
    <div class="tbl"><table><tr><th>Troca</th><th>Exemplo</th></tr>
     <tr><td>autor pela obra</td><td>"Li <b>Monteiro Lobato</b>" (os livros dele)</td></tr>
     <tr><td>recipiente pelo conteúdo</td><td>"Bebi dois <b>copos</b>" (o suco)</td></tr>
     <tr><td>lugar pelas pessoas</td><td>"A <b>cidade</b> foi ao jogo" (os moradores)</td></tr>
     <tr><td>marca pelo produto</td><td>"Comprei um <b>Bombril</b>" (esponja de aço)</td></tr></table></div>
    <details class="try"><summary>Tente você: "Comi dois pratos de arroz". Onde está a metonímia?</summary><p>Em <b>pratos</b>: o recipiente está no lugar da comida.</p></details>`],
   ["Personificação",`<p>A personificação dá <b>ações, sentimentos ou características humanas</b> a animais, objetos ou à natureza.</p>
    <div class="ex">"O vento <b>sussurrava</b> nas janelas."<br>"A lua <b>sorriu</b> para mim."<br>"As árvores <b>dançavam</b>."<br>"O relógio <b>preguiçoso</b> não queria andar."</div>
    <div class="box tip"><span class="lbl">Como reconhecer</span><p>Pergunte: <b>isso só uma pessoa faria?</b> Vento não sussurra, lua não sorri: é personificação.</p></div>
    <details class="try"><summary>Tente você: "O rio chorava baixinho" é metonímia ou personificação?</summary><p><b>Personificação</b>: chorar é ação humana dada ao rio.</p></details>`]]},
  {id:"verbos",cap:"Cap. 9",t:"Subjuntivo e formas nominais",q:"port/cap9",steps:[
   ["Os três modos do verbo",`<p>O <b>modo</b> do verbo mostra a atitude de quem fala:</p>
    <div class="tbl"><table><tr><th>Modo</th><th>Expressa</th><th>Exemplo</th></tr>
     <tr><td>Indicativo</td><td>certeza, fato</td><td>Eu <b>estudo</b> todo dia.</td></tr>
     <tr><td>Subjuntivo</td><td>dúvida, desejo, hipótese</td><td>Talvez eu <b>estude</b>.</td></tr>
     <tr><td>Imperativo</td><td>ordem, pedido</td><td><b>Estude</b>!</td></tr></table></div>
    <p>O foco deste capítulo é o <b>subjuntivo</b>. Ele tem três tempos, e cada um tem uma palavra-pista.</p>`],
   ["Subjuntivo: as três pistas",`<div class="tbl"><table><tr><th>Tempo</th><th>Pista</th><th>estudar</th><th>vender</th></tr>
     <tr><td>Presente</td><td><b>que</b></td><td>que eu estud<b>e</b></td><td>que eu vend<b>a</b></td></tr>
     <tr><td>Pretérito imperfeito</td><td><b>se</b></td><td>se eu estud<b>asse</b></td><td>se eu vend<b>esse</b></td></tr>
     <tr><td>Futuro</td><td><b>quando</b></td><td>quando eu estud<b>ar</b></td><td>quando eu vend<b>er</b></td></tr></table></div>
    <div class="ex">"Espero <b>que</b> você <b>estude</b>." → presente (desejo)<br>"<b>Se</b> eu <b>estudasse</b> mais, tiraria nota boa." → pretérito imperfeito (hipótese)<br>"<b>Quando</b> eu <b>terminar</b>, vou brincar." → futuro</div>
    <details class="try"><summary>Tente você: complete "Se eu ___ (ter) dinheiro, compraria um livro".</summary><p><b>Tivesse</b> (pretérito imperfeito do subjuntivo, pista "se").</p></details>`],
   ["Pegadinha do futuro",`<div class="box warn"><span class="lbl">Atenção</span><p>"Quando eu <b>terminar</b>" parece infinitivo (terminar), mas é <b>futuro do subjuntivo</b> por causa do "quando". Em alguns verbos a forma fica diferente e dá para ver: "quando eu <b>fizer</b>", "quando eu <b>tiver</b>", "quando eu <b>puder</b>".</p></div>
    <details class="try"><summary>Tente você: "Quando você ___ (chegar), me avise."</summary><p><b>Chegar</b>, no futuro do subjuntivo.</p></details>`],
   ["Formas nominais",`<p>São três formas do verbo que funcionam quase como nomes. Elas não mostram quem faz a ação nem quando.</p>
    <div class="tbl"><table><tr><th>Forma</th><th>Termina em</th><th>Exemplos</th></tr>
     <tr><td>Infinitivo</td><td>-ar, -er, -ir</td><td>estudar, vender, partir</td></tr>
     <tr><td>Gerúndio</td><td>-ndo</td><td>estudando, vendendo, partindo</td></tr>
     <tr><td>Particípio</td><td>-ado, -ido</td><td>estudado, vendido, partido</td></tr></table></div>
    <div class="ex">"<b>Estudar</b> é importante." → infinitivo<br>"Estou <b>lendo</b> um livro." → gerúndio<br>"<b>Terminado</b> o jogo, todos saíram." → particípio</div>
    <details class="try"><summary>Tente você: qual o gerúndio e o particípio de "correr"?</summary><p>Gerúndio: <b>correndo</b>. Particípio: <b>corrido</b>.</p></details>`]]}
 ],
 hist:[
  {id:"estrutura",cap:"Cap. 8",t:"O Império Romano",q:"hist/roma",steps:[
   ["Da República ao Império",`<p>Antes de ser um império, Roma foi uma <b>República</b>: quem governava eram magistrados eleitos e o <b>Senado</b>, formado pelos homens mais ricos.</p>
    <p>Com as guerras e conquistas, os generais ganharam muito poder. <b>Júlio César</b> virou ditador e foi assassinado em 44 a.C. Depois de anos de disputa, seu sobrinho <b>Otávio</b> venceu os rivais.</p>
    <p>Em <b>27 a.C.</b>, o Senado deu a Otávio o título de <b>Augusto</b> ("o sagrado"). Ele se tornou o <b>primeiro imperador</b> e começou o <b>Império Romano</b>.</p>
    <div class="box warn"><span class="lbl">Pegadinha</span><p>Júlio César <b>não</b> foi imperador, foi ditador. O primeiro imperador foi <b>Otávio Augusto</b>.</p></div>`],
   ["O poder do imperador",`<p>No Império, o <b>imperador concentrava o poder</b>: comandava o exército, fazia as leis, cobrava impostos e era chefe da religião.</p>
    <p>O <b>Senado continuou existindo</b>, mas perdeu força e passou a obedecer ao imperador.</p>
    <div class="ex">República: poder dividido entre magistrados e Senado<br>Império: poder <b>concentrado</b> em uma pessoa, o imperador</div>
    <details class="try"><summary>Tente você: o que aconteceu com o Senado no Império?</summary><p>Continuou existindo, mas <b>perdeu força</b> para o imperador.</p></details>`],
   ["Sociedade romana",`<div class="tbl"><table><tr><th>Grupo</th><th>Quem eram</th></tr>
     <tr><td><b>Patrícios</b></td><td>ricos, donos de terras; ocupavam os cargos importantes</td></tr>
     <tr><td><b>Plebeus</b></td><td>a maioria livre: comerciantes, artesãos, camponeses</td></tr>
     <tr><td><b>Escravizados</b></td><td>muitos eram <b>prisioneiros de guerra</b>; trabalhavam nas casas, campos e minas</td></tr></table></div>
    <p>Quanto mais Roma conquistava, mais escravizados chegavam. A economia dependia muito desse trabalho forçado.</p>
    <details class="try"><summary>Tente você: de onde vinham muitos escravizados?</summary><p>Eram <b>prisioneiros das guerras</b> de conquista.</p></details>`],
   ["Pax Romana",`<p>"Pax" quer dizer paz. A <b>Pax Romana</b> foi um período de cerca de <b>200 anos</b> (séculos I e II) de relativa paz <b>dentro</b> do Império.</p>
    <p>Com menos guerras internas:</p>
    <ul><li>o <b>comércio</b> cresceu;</li><li>foram construídas <b>estradas</b> ligando o Império ("todos os caminhos levam a Roma");</li><li>as cidades cresceram, com aquedutos, termas e teatros.</li></ul>
    <div class="box warn"><span class="lbl">Atenção</span><p>Paz <b>dentro</b> do Império. Nas fronteiras ainda havia guerras.</p></div>`],
   ["Pão e circo",`<p>Roma tinha muitos plebeus pobres, e o governo temia revoltas. A solução foi a política do <b>pão e circo</b>:</p>
    <ul><li><b>Pão:</b> distribuição de trigo (comida) de graça ou barata.</li><li><b>Circo:</b> espetáculos gratuitos, como lutas de <b>gladiadores</b> no <b>Coliseu</b> e corridas de bigas.</li></ul>
    <p>Com a barriga cheia e distraída, a plebe <b>não se revoltava</b> contra o governo.</p>
    <details class="try"><summary>Tente você: qual era o objetivo do pão e circo?</summary><p><b>Evitar revoltas</b> da plebe, dando comida e diversão.</p></details>`]]},
  {id:"cultura",cap:"Cap. 8",t:"Cultura e crise de Roma",q:"hist/roma",steps:[
   ["Heranças romanas",`<p>Muita coisa do nosso dia a dia veio dos romanos:</p>
    <ul><li><b>Latim:</b> a língua romana deu origem ao <b>português</b>, espanhol, francês, italiano e romeno. (O inglês <b>não</b>: é de origem germânica.)</li>
    <li><b>Direito romano:</b> as leis organizadas por escrito são a base das leis de muitos países, inclusive do Brasil.</li>
    <li><b>Arquitetura e engenharia:</b> arcos, <b>aquedutos</b> (que levavam água às cidades), estradas, pontes, o Coliseu.</li>
    <li>O calendário, os números romanos (I, V, X…) e muitas palavras.</li></ul>
    <details class="try"><summary>Tente você: a bússola é herança romana?</summary><p><b>Não.</b> A bússola, o papel e a pólvora vieram da <b>China</b>.</p></details>`],
   ["Religião",`<p>Os romanos eram <b>politeístas</b>: adoravam vários deuses, como Júpiter, Marte e Vênus.</p>
    <p>O <b>cristianismo</b> surgiu na Palestina e se espalhou pelo Império. Por adorar um só Deus e não aceitar o culto ao imperador, os cristãos foram <b>perseguidos</b>.</p>
    <div class="tbl"><table><tr><th>Ano</th><th>O que aconteceu</th></tr>
     <tr><td>313</td><td>Os cristãos passam a ser <b>tolerados</b> (liberdade de culto)</td></tr>
     <tr><td>380</td><td>O cristianismo vira a <b>religião oficial</b> do Império</td></tr></table></div>`],
   ["A crise do Império",`<p>A partir do século III, o Império entrou em crise. Uma causa puxou a outra:</p>
    <ol><li><b>Fim das conquistas:</b> sem novas guerras vitoriosas, chegavam menos riquezas e menos escravizados.</li><li><b>Crise econômica:</b> faltava mão de obra e produção.</li><li><b>Mais impostos</b> para pagar o exército, deixando o povo insatisfeito.</li><li><b>Invasões</b> dos povos germânicos nas fronteiras.</li></ol>
    <details class="try"><summary>Tente você: por que o fim das conquistas enfraqueceu Roma?</summary><p>Porque a economia dependia das <b>riquezas e dos escravizados</b> que vinham das guerras.</p></details>`],
   ["Divisão e queda",`<p>Para facilitar o governo de um território enorme, em <b>395</b> o Império foi dividido em dois:</p>
    <div class="ex"><b>Ocidente:</b> capital Roma<br><b>Oriente:</b> capital Constantinopla (vai virar o Império Bizantino)</div>
    <p>O Império Romano do <b>Ocidente</b> não resistiu às invasões dos povos <b>germânicos</b> e caiu em <b>476</b>. Essa data marca o fim da Antiguidade e o início da <b>Idade Média</b>.</p>
    <div class="box warn"><span class="lbl">Não confunda</span><p>476: queda de Roma (germânicos). 1453: queda de Constantinopla (turcos). São quase mil anos de diferença.</p></div>`]]},
  {id:"bizancio",cap:"Cap. 9",t:"Império Bizantino",q:"hist/bizancio",steps:[
   ["O que foi",`<p>O Império Bizantino é o <b>Império Romano do Oriente</b>: a metade que <b>não caiu</b> em 476. Ele durou quase <b>mil anos</b> depois da queda de Roma.</p>
    <p>O nome vem de <b>Bizâncio</b>, a cidade antiga onde o imperador Constantino fundou <b>Constantinopla</b>, a capital. Hoje ela se chama <b>Istambul</b>, na <b>Turquia</b>.</p>`],
   ["Constantinopla",`<p>Constantinopla ficava num lugar <b>estratégico</b>: entre a <b>Europa e a Ásia</b>, junto ao mar. Por ali passavam as rotas de comércio de seda, especiarias e ouro.</p>
    <p>Por isso ela era rica, cheia de gente e bem protegida por muralhas.</p>
    <details class="try"><summary>Tente você: por que a localização de Constantinopla era boa?</summary><p>Ficava <b>entre a Europa e a Ásia</b>, ótima para o comércio.</p></details>`],
   ["Estrutura política",`<p>O Império Bizantino era governado por um <b>imperador com poder absoluto</b>: ele fazia as leis, comandava o exército, cobrava impostos e era considerado escolhido por Deus.</p>
    <ul><li><b>Poder centralizado:</b> tudo era decidido na capital, Constantinopla.</li><li><b>Muitos funcionários</b> (burocracia) cuidavam dos impostos, das leis e das províncias.</li><li><b>Exército forte</b> para defender as fronteiras.</li><li>O imperador mandava <b>também na Igreja</b>: nomeava o patriarca (o chefe da Igreja de Constantinopla). Isso se chama <b>cesaropapismo</b>.</li></ul>
    <div class="box tip"><span class="lbl">Para lembrar</span><p>Cesaropapismo = <b>César</b> (imperador) + <b>papa</b> (chefe religioso) na mesma pessoa.</p></div>
    <details class="try"><summary>Tente você: quem mandava na Igreja no Império Bizantino?</summary><p>O <b>imperador</b>. Isso é o cesaropapismo.</p></details>`],
   ["Justiniano",`<p>O imperador mais famoso foi <b>Justiniano</b>, no <b>século VI</b>. Ele:</p>
    <ul><li>organizou as leis romanas no <b>Código de Justiniano</b>;</li><li>construiu a igreja de <b>Hagia Sofia</b> (Santa Sofia), em Constantinopla;</li><li>tentou reconquistar terras do antigo Império do Ocidente, como a Itália e o norte da África.</li></ul>
    <p>Ele governou junto com a imperatriz <b>Teodora</b>, que teve grande influência nas decisões.</p>`],
   ["Religião e o Cisma",`<p>Os bizantinos eram cristãos, mas com o tempo surgiram muitas diferenças em relação à Igreja de Roma.</p>
    <p>Em <b>1054</b> aconteceu o <b>Cisma do Oriente</b> (cisma = separação). O cristianismo se dividiu em:</p>
    <div class="ex"><b>Igreja Católica Romana</b>, com sede em Roma, liderada pelo papa<br><b>Igreja Ortodoxa</b>, com sede em Constantinopla</div>`],
   ["Cultura bizantina",`<p>A cultura bizantina misturava influências <b>gregas, romanas e orientais</b>.</p>
    <ul><li>A língua mais falada era o <b>grego</b> (em Roma era o latim).</li><li>Arte de <b>mosaicos</b>: imagens feitas com pedrinhas coloridas, que decoravam as igrejas.</li><li><b>Ícones</b>: pinturas de santos, muito usadas na religião.</li></ul>
    <details class="try"><summary>Tente você: que língua se falava em Roma e em Bizâncio?</summary><p>Roma: <b>latim</b>. Bizâncio: <b>grego</b>.</p></details>`],
   ["Queda e linha do tempo",`<p>Em <b>1453</b>, os <b>turcos otomanos</b> tomaram Constantinopla. Foi o fim do Império Bizantino e, para muitos historiadores, o <b>fim da Idade Média</b>.</p>
    <div class="tbl"><table><tr><th>Ano</th><th>Fato</th></tr><tr><td>27 a.C.</td><td>início do Império Romano (Otávio Augusto)</td></tr><tr><td>313</td><td>tolerância aos cristãos</td></tr><tr><td>380</td><td>cristianismo religião oficial</td></tr><tr><td>395</td><td>divisão do Império</td></tr><tr><td>476</td><td>queda de Roma</td></tr><tr><td>1054</td><td>Cisma do Oriente</td></tr><tr><td>1453</td><td>queda de Constantinopla</td></tr></table></div>`]]}
 ],
 geo:[
  {id:"vegetacao",cap:"Cap. 8",t:"Formações vegetais",q:"geo/vegetacao",steps:[
   ["O clima decide",`<p>Formação vegetal é o conjunto de plantas que cobre uma região. O que mais decide qual vegetação cresce num lugar é o <b>clima</b>:</p>
    <ul><li><b>Temperatura:</b> quente, frio ou com quatro estações.</li><li><b>Chuva:</b> muita, pouca ou só em parte do ano.</li></ul>
    <p>Muito calor e muita chuva → florestas densas. Pouca chuva → plantas baixas e resistentes à seca. Muito frio → poucas plantas.</p>`],
   ["Florestas tropicais e equatoriais",`<p>Aparecem em clima <b>quente e úmido</b>, perto da linha do Equador.</p>
    <ul><li>Árvores <b>altas e muito próximas</b>, folhas largas e sempre verdes.</li><li><b>Maior biodiversidade</b> do planeta: muitas espécies de plantas e animais.</li></ul>
    <div class="ex">Exemplos: <b>Amazônia</b> (equatorial) e <b>Mata Atlântica</b> (tropical)</div>
    <details class="try"><summary>Tente você: por que essas florestas são tão densas?</summary><p>Porque há <b>muito calor e muita chuva</b> o ano todo.</p></details>`],
   ["Florestas temperadas e taiga",`<p><b>Floresta temperada:</b> clima com <b>quatro estações</b> bem definidas. As árvores <b>perdem as folhas no outono</b> e ficam peladas no inverno.</p>
    <p><b>Taiga (floresta boreal):</b> clima <b>frio</b>, no norte da América, da Europa e da Ásia. Formada por <b>pinheiros</b> (coníferas), com folhas finas como agulhas, que aguentam a neve.</p>`],
   ["Savanas e campos",`<p><b>Savana:</b> gramíneas (capim) com <b>árvores espalhadas</b>, de troncos tortos. Clima quente com uma <b>estação seca</b>. O <b>Cerrado</b>, no centro do Brasil, é uma savana.</p>
    <p><b>Estepes e pradarias:</b> campos de gramíneas, <b>quase sem árvores</b>, em clima temperado. O <b>Pampa</b>, no Rio Grande do Sul, é um exemplo.</p>
    <div class="box warn"><span class="lbl">Não confunda</span><p>Savana tem árvores espalhadas. Pradaria e estepe quase não têm árvores.</p></div>`],
   ["Desertos, tundra e mediterrânea",`<p><b>Deserto:</b> chove muito pouco. As plantas, como o <b>cacto</b>, guardam água, têm espinhos em vez de folhas e raízes longas.</p>
    <p><b>Tundra:</b> regiões <b>polares</b>, muito frias. O solo fica congelado quase o ano todo. Só crescem <b>musgos e liquens</b>.</p>
    <p><b>Vegetação mediterrânea:</b> <b>arbustos</b> e árvores baixas, em clima com <b>verão seco</b> e inverno chuvoso, perto do mar Mediterrâneo.</p>`],
   ["Resumo",`<div class="tbl"><table><tr><th>Vegetação</th><th>Clima</th><th>Plantas</th></tr>
     <tr><td>Tropical/equatorial</td><td>quente e úmido</td><td>árvores altas, muita biodiversidade</td></tr>
     <tr><td>Temperada</td><td>4 estações</td><td>folhas caem no outono</td></tr>
     <tr><td>Taiga</td><td>frio</td><td>pinheiros</td></tr>
     <tr><td>Savana</td><td>quente com seca</td><td>capim e árvores espalhadas</td></tr>
     <tr><td>Estepe/pradaria</td><td>temperado</td><td>campos de capim</td></tr>
     <tr><td>Deserto</td><td>muito seco</td><td>cactos</td></tr>
     <tr><td>Tundra</td><td>polar</td><td>musgos e liquens</td></tr></table></div>
    <div class="box tip"><span class="lbl">Atividade</span><p>Copie esta tabela no caderno e acrescente um exemplo de lugar para cada vegetação.</p></div>`]]},
  {id:"acao",cap:"Cap. 9",t:"Ação humana no clima e na vegetação",q:"geo/acao",steps:[
   ["Efeito estufa natural",`<p>A Terra é envolvida por gases, como o <b>gás carbônico (CO₂)</b> e o vapor d'água. Eles funcionam como o vidro de uma estufa: deixam o calor do Sol entrar e <b>seguram uma parte</b> dele.</p>
    <p>Esse é o <b>efeito estufa natural</b>, e ele é <b>bom</b>: sem ele, a Terra seria gelada demais para a vida.</p>`],
   ["Efeito estufa intensificado",`<p>O problema começa quando o ser humano joga <b>gás carbônico demais</b> no ar. Aí a camada fica mais "grossa", segura calor demais e o planeta esquenta: é o <b>aquecimento global</b>.</p>
    <p><b>O que libera mais CO₂:</b></p>
    <ul><li>queima de combustíveis (gasolina, diesel, carvão) em carros e fábricas;</li><li><b>queimadas</b> e <b>desmatamento</b> (as árvores que absorviam CO₂ deixam de existir).</li></ul>
    <details class="try"><summary>Tente você: qual a diferença entre o efeito estufa natural e o intensificado?</summary><p>O natural <b>mantém a Terra habitável</b>. O intensificado <b>aquece demais</b> por causa da ação humana.</p></details>`],
   ["Ilhas de calor",`<p>O centro das grandes cidades costuma ser <b>mais quente</b> que os bairros afastados e o campo. Isso é a <b>ilha de calor</b>.</p>
    <p><b>Por quê?</b> Asfalto e concreto <b>acumulam calor</b>, há <b>poucas árvores</b> e muitos carros e prédios.</p>
    <p><b>Como diminuir:</b> plantar árvores, criar parques e praças verdes.</p>`],
   ["Desmatamento e chuva ácida",`<p><b>Desmatamento</b> é a retirada da vegetação. Consequências:</p>
    <ul><li><b>perda de biodiversidade</b> (plantas e animais somem);</li><li><b>erosão:</b> sem raízes, a chuva e o vento levam o solo embora;</li><li><b>menos chuva:</b> as árvores devolvem umidade para o ar, que forma nuvens.</li></ul>
    <p><b>Chuva ácida:</b> poluentes de fábricas e veículos se misturam à água das nuvens. Ela danifica plantas, rios, estátuas e construções.</p>`],
   ["Vegetação e ação humana",`<p>O ser humano muda a vegetação para usar a terra. As principais causas da <b>destruição da vegetação</b> são:</p>
    <ul><li><b>Agropecuária:</b> derrubar a mata para plantar (soja, milho, cana) ou criar gado.</li><li><b>Extração de madeira</b>, muitas vezes ilegal.</li><li><b>Queimadas</b> para "limpar" o terreno.</li><li><b>Mineração.</b></li><li><b>Crescimento das cidades</b> (urbanização) e construção de estradas.</li></ul>
    <p><b>No Brasil:</b></p>
    <div class="ex"><b>Mata Atlântica:</b> a mais devastada; restam pouco mais de 10% da mata original, porque foi a primeira ocupada pelos portugueses e é onde estão as grandes cidades.<br><b>Cerrado:</b> muito desmatado para a plantação de soja e a criação de gado.<br><b>Amazônia:</b> sofre com queimadas, garimpo e extração ilegal de madeira.</div>
    <p>Quando a vegetação some, somem também os animais que viviam nela, o solo sofre <b>erosão</b> e o clima da região muda.</p>
    <details class="try"><summary>Tente você: cite duas causas do desmatamento.</summary><p>Por exemplo: <b>agropecuária</b> e <b>extração de madeira</b> (também valem queimadas, mineração e urbanização).</p></details>`],
   ["Consequências das mudanças climáticas",`<ul><li><b>Derretimento de geleiras</b> e <b>aumento do nível do mar</b>, ameaçando cidades do litoral.</li><li><b>Secas e enchentes</b> mais fortes e frequentes.</li><li><b>Ondas de calor.</b></li><li>Espécies de animais e plantas ameaçadas.</li></ul>
    <details class="try"><summary>Tente você: por que o nível do mar sobe?</summary><p>Por causa do <b>derretimento das geleiras</b>: a água vai para os oceanos.</p></details>`],
   ["O que fazer",`<ul><li><b>Reflorestar</b> e proteger as florestas.</li><li>Usar <b>energias renováveis</b>: <b>solar</b> (do Sol) e <b>eólica</b> (do vento).</li><li>Usar <b>transporte público</b> e bicicleta.</li><li>Economizar energia e água.</li><li>Criar e proteger <b>áreas de conservação</b>.</li></ul>
    <div class="box tip"><span class="lbl">Explique com suas palavras</span><p>Conte para alguém da família o que é o efeito estufa e por que ele ficou perigoso. Se você consegue explicar, você aprendeu.</p></div>`]]}
