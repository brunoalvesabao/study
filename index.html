 pinta:{gen(l){
  let label,target,hint;
  if(l===1){target=rnd(1,9)*10; label=`${target}%`; hint="Cada linha tem 10 quadradinhos, e cada linha é 10% do quadro."}
  else if(l===2){ if(Math.random()<.5){target=rnd(3,19)*5; label=fmtDec(target/100); hint=`${label} são ${target} centésimos, ou seja, ${target} quadradinhos de 100.`}
                  else {target=pick([25,75,35,45,15,65]); label=`${target}%`; hint=`${target}% quer dizer ${target} de cada 100.`}}
  else { const f=pick([["1/4",25],["3/4",75],["1/5",20],["2/5",40],["3/5",60],["1/2",50],["7/10",70],["3/10",30]]); label=f[0]; target=f[1];
         hint=`Transforme em centésimos: ${f[0]} = ?/100. Quanto é 1/${f[0].split("/")[1]} de 100?`}
  let cells=new Array(100).fill(false), grid;
  return {prompt:`Pinte <span class="bign">${label}</span> do quadro`,hint,
   answer:`${label} = ${target}/100 = ${target} quadradinhos pintados.`,
   mount(el,ctx){
    el.innerHTML=`<div class="row between"><span class="muted">Pintados: <b id="g100-n">0</b> de 100</span><button class="btn ghost" id="g100-clear">Limpar</button></div>
      <div class="g100" id="g100">${cells.map((c,i)=>`<i data-c="${i}"></i>`).join("")}</div>
      <p class="muted" style="text-align:center;font-size:14px">Arraste o dedo para pintar vários de uma vez.</p>`;
    grid=el.querySelector("#g100"); let mode=null;
    const upd=()=>{const n=cells.filter(Boolean).length; el.querySelector("#g100-n").textContent=n; ctx.ready(n>0)};
    const set=(t)=>{if(!t||t.dataset.c==null) return; const i=+t.dataset.c; cells[i]=mode; t.classList.toggle("on",mode); upd()};
    grid.addEventListener("pointerdown",e=>{const t=e.target.closest("[data-c]"); if(!t) return; mode=!cells[+t.dataset.c]; set(t); grid.setPointerCapture(e.pointerId)});
    grid.addEventListener("pointermove",e=>{if(mode===null) return; set(document.elementFromPoint(e.clientX,e.clientY)?.closest?.("[data-c]"))});
    const end=()=>mode=null; grid.addEventListener("pointerup",end); grid.addEventListener("pointercancel",end);
    el.querySelector("#g100-clear").onclick=()=>{cells.fill(false); grid.querySelectorAll("i").forEach(c=>c.classList.remove("on")); upd()};
   },
   check(){const n=cells.filter(Boolean).length;return {ok:n===target,info:`Você pintou ${n} quadradinhos, que são ${n}%.`}},
   reveal(){grid.querySelectorAll("i").forEach((c,i)=>{c.classList.toggle("ans",i<target)})}};
 }},

 liquida:{gen(l){
  const coisas=["O tênis","A mochila","O fone","A bicicleta","O jogo","O estojo","A bola","A camiseta"];
  let price,pct;
  if(l===1){price=pick([40,50,60,80,100,120,150,200]); pct=pick([10,20,30,50])}
  else if(l===2){price=pick([70,90,130,160,240,350,110]); pct=pick([10,20,30,40])}
  else {price=pick([45,64,85,36,125,58]); pct=pick([5,10,20])}
  const desc=Math.round(price*100*pct/100), novo=price*100-desc, blk=price*10; // centavos
  const item=pick(coisas);
  let val="", bar;
  return {prompt:`${item} custa <b>${money(price*100)}</b> e está com <span class="bign">${pct}%</span> de desconto. Qual o novo preço?`,
   hint:`Cada bloco da barra é 10% = ${money(blk)} (o preço dividido por 10). ${pct===5?"5% é metade de um bloco.":`${pct}% são ${pct/10} blocos.`} Depois tire o desconto do preço.`,
   answer:`Desconto: ${pct}% de ${money(price*100)} = ${money(desc)}. Novo preço: <b>${money(novo)}</b>.`,
   mount(el,ctx){
    el.innerHTML=`<p class="muted" style="font-size:14px">A barra é o preço inteiro, dividido em 10 blocos de 10%. Toque nos blocos para riscar o desconto.</p>
      <div class="bar10" id="bar10">${[...Array(10)].map((_,i)=>`<button data-b="${i}"><small>10%</small><span>${l===1?money(blk).replace("R$ ",""):"?"}</span></button>`).join("")}</div>
      ${keypadHtml("Novo preço","R$ ")}`;
    bar=el.querySelector("#bar10");
    bar.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>b.classList.toggle("cut"));
    keypadMount(el,ctx,"R$ ",v=>val=v);
   },
   check(){const c=Math.round(parseBR(val)*100);return {ok:c===novo,info:`Você respondeu ${money(c)}.`}},
   reveal(){bar.querySelectorAll("[data-b]").forEach((b,i)=>{b.classList.toggle("cut",i>=10-Math.ceil(pct/10)); b.querySelector("span").textContent=money(blk).replace("R$ ","")})}};
 }},

 sorte:{gen(l){
  const COR={azul:"var(--pen)",vermelha:"var(--red)",verde:"var(--ok)",amarela:"#E8B400"};
  let prompt,stageTop,num,den,hint,mode="frac",label;
  if(l===1||l===3){
    const cs=Object.keys(COR); const a=pick(cs); let b; do{b=pick(cs)}while(b===a);
    let na,nb; if(l===1){na=rnd(1,4); nb=rnd(1,4)} else {const tot=pick([4,5,10,20]); na=rnd(1,tot-1); nb=tot-na}
    const balls=[...Array(na).fill(a),...Array(nb).fill(b)].sort(()=>Math.random()-.5);
    const ask=Math.random()<.5?a:b; num=ask===a?na:nb; den=na+nb; label=`bola ${ask}`;
    stageTop=`<div class="bag">${balls.map(c=>`<i style="background:${COR[c]}"></i>`).join("")}</div>`;
    if(l===3){mode="pct"; prompt=`Sorteando uma bola sem olhar, qual a chance, <b>em porcentagem</b>, de sair ${label}?`; hint=`Primeiro a fração: bolas ${ask}s ÷ total de bolas. Depois transforme em ?/100.`}
    else {prompt=`Sorteando uma bola sem olhar, qual a chance de sair <b>${label}</b>?`; hint=`Em cima, quantas bolas ${ask}s tem. Embaixo, quantas bolas tem ao todo.`}
  } else {
    const ev=pick([["um número par",n=>n%2===0],["um número maior que 4",n=>n>4],["o número 6",n=>n===6],["um número menor que 3",n=>n<3],["um múltiplo de 3",n=>n%3===0],["um número ímpar",n=>n%2===1],["o número 7",n=>n===7]]);
    num=[1,2,3,4,5,6].filter(ev[1]).length; den=6; label=ev[0];
    stageTop=`<div class="dice">${[1,2,3,4,5,6].map(n=>`<i>${n}</i>`).join("")}</div>`;
    prompt=`Jogando um dado, qual a chance de sair <b>${ev[0]}</b>?`; hint=`O dado tem 6 lados (embaixo). Conte quais números servem (em cima).`;
  }
  const vals={n:0,d:1}; let val="";
  const fracTxt=`${num}/${den}`;
  return {prompt,hint,
   answer:mode==="pct"?`${fracTxt} = <b>${Math.round(100*num/den)}%</b>.`:`A chance é <b>${fracTxt}</b>${num===0?" (impossível)":""}.`,
   mount(el,ctx){
    el.innerHTML=stageTop+(mode==="pct"?keypadHtml("Chance",""):`<div class="frac-build">${stepperHtml("n","casos que eu quero",0)}<hr>${stepperHtml("d","casos possíveis",1)}</div>`);
    if(mode==="pct") keypadMount(el,ctx,"",v=>val=v);
    else stepperMount(el,vals,{n:[0,20],d:[1,20]},()=>ctx.ready(true));
   },
   check(){
    if(mode==="pct"){const p=parseBR(val);return {ok:Math.abs(p-100*num/den)<.01,info:`Você respondeu ${val}%.`}}
    const ok=num===0?vals.n===0:vals.n*den===num*vals.d; return {ok,info:`Você montou ${vals.n}/${vals.d}.`}},
   extra(){ if(num===0) return "Não tem como acontecer: probabilidade zero.";
    let hits=0; for(let i=0;i<60;i++) if(Math.random()<num/den) hits++; return `Teste: sorteando 60 vezes, saiu ${label} ${hits} vezes. A teoria diz ${Math.round(60*num/den)}.`}};
 }},

 tesouro:{gen(l){
  const G0=40,SZ=32,N=8,PX=v=>G0+v*SZ,PY=v=>G0+(N-v)*SZ;
  let tx,ty,prompt,hint,mode="tap",extraSvg="";
  if(l===1){tx=rnd(1,7);ty=rnd(1,7); prompt=`Toque no ponto <span class="bign">(${tx}, ${ty})</span> para achar o tesouro.`; hint=`Comece no 0. Ande ${tx} para a direita no eixo x e depois suba ${ty}.`}
  else if(l===2){tx=rnd(0,8);ty=rnd(1,8); mode="read"; prompt=`Quais são as coordenadas do tesouro?`; hint=`Primeiro o x: quantos passos para a direita. Depois o y: quantos para cima.`;
    extraSvg=`<g transform="translate(${PX(tx)} ${PY(ty)})"><path d="M0 -13 l3.8 7.8 8.6 1.2 -6.2 6 1.5 8.5 -7.7 -4 -7.7 4 1.5 -8.5 -6.2 -6 8.6 -1.2z" fill="#E8B400" stroke="var(--ink)" stroke-width="1.2"/></g>`}
  else {const a=rnd(1,3),b=rnd(1,3); tx=2*a;ty=2*b; prompt=`O triângulo vai ser <b>ampliado 2 vezes</b>. Toque onde vai parar o ponto <span class="bign">A(${a}, ${b})</span>.`;
    hint=`Na ampliação, multiplique as duas coordenadas por 2: (${a} × 2, ${b} × 2).`;
    extraSvg=`<path d="M${PX(a)} ${PY(b)} L${PX(a+1)} ${PY(b)} L${PX(a)} ${PY(b+1)}Z" fill="color-mix(in srgb,var(--port) 25%,transparent)" stroke="var(--port)" stroke-width="2"/><circle cx="${PX(a)}" cy="${PY(b)}" r="5" fill="var(--port)"/><text x="${PX(a)-14}" y="${PY(b)+16}" font-size="13" font-weight="700">A</text>`}
  const vals={x:0,y:0}; let sel=null, svg;
  const grid=`${[...Array(N+1)].map((_,i)=>`<line x1="${PX(i)}" y1="${PY(0)}" x2="${PX(i)}" y2="${PY(N)}" stroke="var(--line)"/><line x1="${PX(0)}" y1="${PY(i)}" x2="${PX(N)}" y2="${PY(i)}" stroke="var(--line)"/>
    <text x="${PX(i)}" y="${PY(0)+20}" text-anchor="middle" font-size="12">${i}</text>${i?`<text x="${PX(0)-14}" y="${PY(i)+4}" text-anchor="middle" font-size="12">${i}</text>`:""}`).join("")}
    <line x1="${PX(0)}" y1="${PY(0)}" x2="${PX(N)+10}" y2="${PY(0)}" stroke="var(--ink)" stroke-width="2.5"/><line x1="${PX(0)}" y1="${PY(0)}" x2="${PX(0)}" y2="${PY(N)-10}" stroke="var(--ink)" stroke-width="2.5"/>
    <text x="${PX(N)+14}" y="${PY(0)+4}" font-size="14" font-weight="700">x</text><text x="${PX(0)-4}" y="${PY(N)-16}" font-size="14" font-weight="700">y</text>`;
  const dot=(x,y,c)=>`<circle cx="${PX(x)}" cy="${PY(y)}" r="9" fill="${c}" stroke="var(--surface)" stroke-width="3"/>`;
  return {prompt,hint,answer:`O ponto certo é <b>(${tx}, ${ty})</b>, marcado em verde.`,
   mount(el,ctx){
    el.innerHTML=`<div class="gsvg-wrap"><svg viewBox="0 0 330 340" class="gsvg" id="tes-svg" role="img" aria-label="Plano cartesiano de 0 a 8">${grid}${extraSvg}<g id="tes-mk"></g><g id="tes-ans"></g></svg></div>
      ${mode==="read"?`<div class="frac-build row" style="justify-content:center;gap:24px">${stepperHtml("x","x (para o lado)",0)}${stepperHtml("y","y (para cima)",0)}</div>`:""}`;
    svg=el.querySelector("#tes-svg");
    if(mode==="read") stepperMount(el,vals,{x:[0,8],y:[0,8]},()=>ctx.ready(true));
    else svg.addEventListener("pointerdown",e=>{const p=svgPoint(svg,e); const x=Math.round((p.x-G0)/SZ), y=Math.round(N-(p.y-G0)/SZ);
      if(x<0||x>N||y<0||y>N) return; sel=[x,y]; svg.querySelector("#tes-mk").innerHTML=dot(x,y,"var(--pen)"); ctx.ready(true)});
   },
   check(){ if(mode==="read") return {ok:vals.x===tx&&vals.y===ty,info:`Você disse (${vals.x}, ${vals.y}).`};
     return {ok:sel[0]===tx&&sel[1]===ty,info:`Você tocou em (${sel[0]}, ${sel[1]}).`}},
   reveal(){svg.querySelector("#tes-ans").innerHTML=dot(tx,ty,"var(--ok)")}};
 }}
};

/* ---------- motor dos jogos ---------- */
let GM=null;
function startGame(id){
  if(id==="tabuada"){ tabSet(""); return go("tabuada") }
  GM={id,i:0,n:6,level:1,streak:0,score:0,tries:0,phase:"play",round:null,fb:null};
  GM.round=GAMEDEF[id].gen(1); go("jogo");
}
function vJogos(){
  const total=GAMES.reduce((a,g)=>a+gameStars(g.id),0);
  let lastCap="";
  return `<button class="back" data-nav2="praticar">${ICON.left} Praticar</button>
   <section class="lab-head"><span class="eyebrow">Matemática em jogo</span><h1>Laboratório</h1>
    <p>Mexa, teste e descubra. Cada jogo tem 6 desafios e fica mais difícil quando ela acerta seguido.</p>
    <div class="row">${starsHtml(1,1)}<b>${total} de ${GAMES.length*3} estrelas</b></div></section>
   <div class="map">${GAMES.map((g,i)=>{
     const head=g.cap!==lastCap?`<span class="eyebrow map-cap">${g.cap}</span>`:""; lastCap=g.cap;
     return `${head}<button class="node" style="--c:${g.c}" data-game="${g.id}"><span class="node-ic">${g.ic}</span>
       <span class="node-tx"><b>${g.t}</b><span>${g.d}</span></span>${starsHtml(gameStars(g.id))}</button>`}).join("")}</div>`;
}
function vJogo(){
  if(!GM) return vJogos();
  const g=GAMES.find(x=>x.id===GM.id);
  const top=`<div class="quiz-top"><button class="icon-btn" data-gquit aria-label="Sair do jogo">${ICON.x}</button>
    <div style="display:grid;gap:6px"><span class="eyebrow">${g.t}</span><div class="gdots">${[...Array(GM.n)].map((_,i)=>`<i class="${i<GM.i?"done":i===GM.i?"now":""}"></i>`).join("")}</div></div>
    <span class="lvl" style="--c:${g.c}">Nível ${GM.level}</span></div>`;
  if(GM.i>=GM.n){
    const pct=GM.score/GM.n, st=pct>=.9?3:pct>=.65?2:pct>0?1:0;
    return top+`<section class="card result" style="display:grid;--c:${g.c}"><div class="bigstars">${starsHtml(st)}</div>
      <h2>${st===3?"Mandou muito bem!":st===2?"Muito bom!":st===1?"Bom começo!":"Vamos tentar de novo?"}</h2>
      <p class="muted">${Math.round(GM.score*10)/10} de ${GM.n} pontos. Acertar de primeira vale 1 ponto; na segunda tentativa, meio.</p>
      ${blkNextHtml("G:"+GM.id)}
      <div class="row" style="justify-content:center"><button class="btn primary" data-game="${g.id}">Jogar de novo</button><button class="btn" data-nav2="jogos">Voltar ao laboratório</button></div></section>`;
  }
  const r=GM.round;
  return top+`<section class="card gcard" style="--c:${g.c}"><p class="q">${r.prompt}</p><div id="gstage" class="gstage"></div></section>
    <div id="gfb"></div><div id="gbtn"><button class="btn primary block" id="g-check" data-gcheck disabled>Verificar</button></div>`;
}
function gameMount(){ if(!GM||GM.i>=GM.n) return; GM.round.mount($("#gstage"),{ready:b=>{const x=$("#g-check"); if(x) x.disabled=!b}}) }
function gameCheck(){
  const r=GM.round, res=r.check(); let fb;
  if(res.ok){
    GM.score+=GM.tries===0?1:.5; GM.streak++; let up="";
    if(GM.streak>=2&&GM.level<3){GM.level++;GM.streak=0;up=`<br><b style="font-size:15px">Subiu para o nível ${GM.level}!</b>`}
    fb=`<div class="fb ok"><b>${pick(["Acertou!","Isso aí!","Perfeito!","Mandou bem!"])}</b><span>${r.extra?r.extra():""}${up}</span></div>`; GM.phase="done";
    if(r.reveal) r.reveal();
  } else {
    GM.tries++; GM.streak=0;
    if(GM.tries===1){fb=`<div class="fb no"><b>Quase! ${res.info}</b><span><b style="font-size:14px;font-family:var(--body)">Dica:</b> ${r.hint}</span></div>`}
    else {GM.phase="done"; if(GM.level>1) GM.level--; if(r.reveal) r.reveal(); fb=`<div class="fb no"><b>Vamos ver juntos</b><span>${r.answer}</span></div>`}
  }
  $("#gfb").innerHTML=fb;
  $("#gbtn").innerHTML=GM.phase==="done"?`<button class="btn primary block" data-gnext>${GM.i+1<GM.n?"Próximo desafio":"Ver estrelas"} ${ICON.arrow}</button>`
    :`<button class="btn primary block" id="g-check" data-gcheck>Verificar de novo</button>`;
  $("#gfb").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function gameNext(){
  GM.i++;
  if(GM.i<GM.n){GM.round=GAMEDEF[GM.id].gen(GM.level); GM.tries=0; GM.phase="play"}
  else {
    const pct=GM.score/GM.n, st=pct>=.9?3:pct>=.65?2:pct>0?1:0, g=GAMES.find(x=>x.id===GM.id);
    if(st>(S.jogos[GM.id]||0)) setItem("jogos",GM.id,st);
    logAct(`Jogo ${g.t}: ${st} ${st===1?"estrela":"estrelas"}`);
    blkComplete("G:"+GM.id);
  }
  render(); window.scrollTo({top:0});
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-game],[data-gcheck],[data-gnext],[data-gquit]"); if(!el) return;
  if(el.dataset.game) return startGame(el.dataset.game);
  if(el.dataset.gcheck!==undefined){ if(!el.disabled) gameCheck(); return }
  if(el.dataset.gnext!==undefined) return gameNext();
  if(el.dataset.gquit!==undefined){GM=null; go("jogos")}
});
/* =========================================================
/* =========================================================
   Progresso (painel para acompanhar)
   ========================================================= */
function fmtWhen(t){const d=new Date(t);return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<1)return"agora mesmo";if(m<60)return`há ${m} min`;const h=Math.round(m/60);if(h<24)return`há ${h} h`;const d=Math.round(h/24);return d===1?"ontem":`há ${d} dias`}
function syncText(){
  if(!CONFIGURED) return ["","Modo local: o progresso fica só neste aparelho"];
  if(SYNC.state==="busy") return ["busy","Sincronizando…"];
  if(SYNC.state==="ok") return ["ok",`Sincronizado às ${pad(new Date(SYNC.at).getHours())}:${pad(new Date(SYNC.at).getMinutes())}`];
  if(SYNC.state==="err") return ["err",SYNC.msg||"Sem conexão. O progresso fica salvo aqui e sobe depois."];
  return ["","Aguardando sincronização"];
}
function vProgresso(){
  const nome=STUDENT.nome, [cls,txt]=syncText(), last=S.activity[0];
  const who = !CONFIGURED ? `<p class="muted">Para acompanhar de outro aparelho, é preciso ligar o login: preencha SUPABASE_URL e SUPABASE_KEY no index.html.</p>`
    : `<div class="row between"><div style="display:grid"><b>${ROLE==="tutor"?TUTOR.nome:nome}</b><span class="muted" style="font-size:13px">${ROLE==="tutor"?"Tutor":"Aluna"}</span></div>
       <div class="row"><button class="btn" data-syncnow>${ICON.sync} Sincronizar</button><button class="btn" data-logout>Sair</button></div></div>
       ${ROLE==="tutor"&&STUDENTS.length>1?`<div class="chips">${STUDENTS.map(k=>`<button class="chip" aria-pressed="${k.id===STUDENT.id}" data-student="${k.id}">${k.nome}</button>`).join("")}</div>`:""}`;
  const days=`<div class="daygrid">${DAYS.map(([date,start,blocks])=>{
      const n=blocks.filter((b,i)=>S.checks[blockId(date,i)]).length, d=parse(date);
      return `<div class="dg ${n===blocks.length?"full":n?"part":""} ${date===today()?"today":""}"><span>${WD[d.getDay()].slice(0,3)}</span><b>${d.getDate()}</b><span>${n}/${blocks.length}</span></div>`}).join("")}</div>`;
  const subjects=ORDER.filter(s=>LESSONS[s].length).map(s=>{
    const e=EXAM_DAYS.find(x=>x.s.includes(s)), [dn,tot]=subjLessonsDone(s), er=errCount(s);
    return `<section class="card" style="display:grid;gap:10px;--c:${SUBJ[s].c}">
      <div class="row between"><h3 style="color:${SUBJ[s].c}">${SUBJ[s].n}</h3><span class="muted" style="font-size:13px">Prova ${dShort(e.d).toLowerCase()} · ${examDone(e.d)?"feita":whenTxt(e.d)}</span></div>
      <div class="progress"><i style="width:${100*dn/tot}%"></i></div>
      <div class="plist">${LESSONS[s].map(l=>`<div class="prow"><span>${l.t}</span>${S.lessons[lessonKey(s,l.id)]?`<span class="okmark">✓ estudada</span>`:`<span class="muted" style="font-size:13px">pendente</span>`}</div>`).join("")}</div>
      <span class="eyebrow" style="margin-top:6px">Treinos · melhor nota</span>
      <div class="plist">${[["all","Treino completo"],...TOPICS[s],["dificil","Desafio: só difíceis"]].map(([k,n])=>`<div class="prow"><span>${n}</span>${badge(S.best[s+"/"+k])}</div>`).join("")}
        <div class="prow"><span>Caderno de erros</span><span class="score-badge ${er?"low":"good"}">${er} para refazer</span></div></div>
    </section>`}).join("");
  return `<div class="hello"><span class="eyebrow">Acompanhamento</span><h1>Progresso da <span class="hl">${nome}</span></h1>
      <p class="muted">${last?`Última atividade ${ago(last.t)}: ${last.txt}`:"Ainda não há atividade registrada."}</p></div>
    <section class="card sync">${who}<span class="sdot ${cls}" data-sync-status>${txt}</span></section>
    ${statsRow(false)}
    <section class="card" style="display:grid;gap:12px"><h3>Blocos por dia</h3>${days}
      <p class="muted" style="font-size:13px">Verde: dia completo · Amarelo: dia pela metade</p></section>
    <section class="card" style="display:grid;gap:8px"><h3>Laboratório de Matemática</h3>
      <div class="plist">${GAMES.map(g=>`<div class="prow"><span>${g.t}<br><span class="sub">${g.id==="tabuada"?`Recorde: ${S.tabBest} acertos`:g.cap}</span></span>${starsHtml(gameStars(g.id))}</div>`).join("")}</div></section>
    ${subjects}
    <section class="card" style="display:grid;gap:8px"><h3>Atividade recente</h3>
      ${S.activity.length?`<ul class="act">${S.activity.slice(0,20).map(a=>`<li><time>${fmtWhen(a.t)}</time><span>${a.txt}</span></li>`).join("")}</ul>`:`<p class="muted">Nada ainda.</p>`}</section>`;
}

/* =========================================================
   Login e sincronização (Supabase)
   ========================================================= */
const CONFIGURED = !!(SUPABASE_URL && SUPABASE_KEY);
let SB=null, USER=null, STUDENTS=[], SYNC={state:"off",at:0,msg:""}, syncing=false, pushT=null, pollIv=null;
const KEYS=["checks","lessons","best","erros","meta","tabBest","activity","jogos"];

function loadState(){
  ["checks","lessons","best","erros","meta","jogos"].forEach(k=>S[k]=store.get(k,{}));
  S.tabBest=store.get("tabBest",0); S.activity=store.get("activity",[]);
}
function migrateLegacy(){ // leva o progresso feito antes do login para a conta da aluna
  try{KEYS.forEach(k=>{const old=localStorage.getItem("alice:"+k); if(old&&!localStorage.getItem(NS+k)) localStorage.setItem(NS+k,old)})}catch(e){}
}
function snapshot(){return {checks:S.checks,lessons:S.lessons,erros:S.erros,best:S.best,tabBest:S.tabBest,meta:S.meta,activity:S.activity,jogos:S.jogos}}
function mergeState(r){
  r=r||{}; const rm=r.meta||{};
  ["checks","lessons","erros","best","jogos"].forEach(kind=>{
    const R=r[kind]||{}, ids=new Set([...Object.keys(S[kind]),...Object.keys(R)]);
    ids.forEach(id=>{
      const k=kind+":"+id, lt=S.meta[k]||0, rt=rm[k]||0, lv=id in S[kind], rv=id in R;
      if(rt>lt||(rt===lt&&rv&&!lv)){ if(rv) S[kind][id]=R[id]; else delete S[kind][id]; if(rt) S.meta[k]=rt }
    });
  });
  S.tabBest=Math.max(S.tabBest||0,r.tabBest||0);
  const seen=new Set(), all=[...S.activity,...(r.activity||[])].filter(a=>{const k=a.t+"|"+a.txt;if(seen.has(k))return false;seen.add(k);return true});
  S.activity=all.sort((a,b)=>b.t-a.t).slice(0,60);
  KEYS.forEach(save);
}
function setSync(state,msg){
  SYNC={state,msg:msg||"",at:Date.now()}; const [cls,txt]=syncText();
  document.querySelectorAll("[data-sync-status]").forEach(el=>{el.className="sdot "+cls; el.textContent=txt});
}
function schedulePush(){ if(!SB||!USER) return; clearTimeout(pushT); pushT=setTimeout(syncNow,1500) }
async function syncNow(){
  if(!SB||!USER||!STUDENT.id||syncing) return; syncing=true; setSync("busy");
  try{
    const {data,error}=await SB.from("progresso").select("dados").eq("aluno_id",STUDENT.id).maybeSingle();
    if(error) throw error;
    const before=JSON.stringify(snapshot());
    if(data&&data.dados) mergeState(data.dados);
    const after=JSON.stringify(snapshot());
    if(!data || after!==JSON.stringify(Object.assign({checks:{},lessons:{},erros:{},best:{},tabBest:0,meta:{},activity:[],jogos:{}},data.dados))){
      const {error:e2}=await SB.from("progresso").upsert({aluno_id:STUDENT.id,dados:snapshot(),atualizado_em:new Date().toISOString()});
      if(e2) throw e2;
    }
    setSync("ok");
    if(after!==before && ["inicio","agenda","bloco","materias","materia","praticar","progresso"].includes(V.name)) render();
  }catch(e){ setSync("err") } finally{ syncing=false }
}

function screen(html){document.body.classList.add("locked"); $("#main").innerHTML=`<div class="view">${html}</div>`}
function brandHead(){return `<div style="text-align:center;display:grid;gap:10px;justify-items:center">
  <div style="width:96px;height:96px">${LOGO.replace(/ace-/g,'acel-').replace('class="logo"','class="logo" style="width:96px;height:96px"')}</div>
  <h1 style="font-size:44px;letter-spacing:.04em">ACE</h1><p style="font-weight:600">Aprender. Conquistar. Evoluir.</p>
  <p class="motto">Cada passo de hoje constrói o seu amanhã.</p></div>`}
function authMsg(error){ // traduz os erros do Supabase para a tela de login
  const m=String(error&&error.message||error||"");
  if(/fetch|network|load failed/i.test(m)) return "Sem conexão com a internet.";
  if(/invalid login credentials/i.test(m)) return "Usuário ou senha incorretos.";
  if(/already registered|already exists/i.test(m)) return "Já existe uma conta com esse e-mail. Entre com ela ou use \"Esqueceu a senha?\".";
  if(/signups? not allowed|signup.*disabled/i.test(m)) return "O cadastro de contas novas está desligado. Peça para o tutor.";
  if(/email not confirmed/i.test(m)) return "Confirme seu e-mail antes de entrar. Procure a mensagem na sua caixa de entrada.";
  if(/password.*(at least|characters|short|weak)/i.test(m)) return "A senha precisa ter pelo menos 6 caracteres.";
  if(/rate limit|too many|security purposes/i.test(m)) return "Muitas tentativas seguidas. Espere alguns minutos e tente de novo.";
  if(/invalid.*email|email.*invalid/i.test(m)) return "Esse e-mail não é válido.";
  return "Não deu certo: "+m;
}
const authLinks=(...l)=>`<p style="text-align:center;font-size:14px;display:grid;gap:6px">${l.join("")}</p>`;
const lnk=(attr,txt)=>`<button type="button" class="linkbtn" ${attr}>${txt}</button>`;
function authForm(id,fields,btn,err,ok){
  return `<form class="card" id="${id}" style="display:grid;gap:14px" novalidate>${fields}
    <p class="box warn" id="au-err" ${err?"":"hidden"}>${err||""}</p><p class="box tip" id="au-ok" ${ok?"":"hidden"}><span>${ok||""}</span></p>
    <button class="btn primary block" type="submit" id="au-btn">${btn}</button></form>`;
}
function authBusy(txt){const b=$("#au-btn"); b.disabled=true; b.textContent=txt}
function authFail(msg,btn){const x=$("#au-err"); x.hidden=false; x.textContent=msg; const b=$("#au-btn"); b.disabled=false; b.textContent=btn}
const fld=(id,label,attrs)=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" ${attrs}></div>`;

function showLogin(err,ok){
  screen(`${brandHead()}${authForm("login",
    fld("lg-user","Usuário ou e-mail",`autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required`)+
    fld("lg-pass","Senha",`type="password" autocomplete="current-password" required`),"Entrar",err,ok)}
    ${authLinks(lnk("data-auth=\"forgot\"","Esqueceu a senha?"),`<span class="muted">Ainda não tem conta? ${lnk("data-auth=\"signup\"","Criar conta")}</span>`)}`);
  $("#login").addEventListener("submit",async e=>{
    e.preventDefault();
    const u=$("#lg-user").value.trim(), p=$("#lg-pass").value;
    if(!u||!p) return authFail("Preencha usuário e senha.","Entrar");
    authBusy("Entrando…");
    const email=u.includes("@")?u.toLowerCase():`${u.toLowerCase()}@${EMAIL_DOMAIN}`;
    const {data,error}=await SB.auth.signInWithPassword({email,password:p});
    if(error && /not confirmed/i.test(error.message)) return showConfirmSent(email);
    if(error) return authFail(authMsg(error),"Entrar");
    afterLogin(data.user);
  });
}
function showSignup(){
  screen(`${brandHead()}<h2 style="text-align:center">Criar conta</h2>${authForm("signup",
    fld("su-nome","Seu nome",`autocomplete="given-name" required`)+
    fld("su-email","E-mail",`type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required`)+
    fld("su-pass","Senha (mínimo 6 caracteres)",`type="password" autocomplete="new-password" minlength="6" required`)+
    fld("su-pass2","Repita a senha",`type="password" autocomplete="new-password" required`),"Criar conta")}
    ${authLinks(`<span class="muted">Já tem conta? ${lnk("data-auth=\"login\"","Entrar")}</span>`)}`);
  $("#signup").addEventListener("submit",async e=>{
    e.preventDefault();
    const nome=$("#su-nome").value.trim(), email=$("#su-email").value.trim().toLowerCase(), p=$("#su-pass").value, p2=$("#su-pass2").value;
    if(!nome||!email||!p) return authFail("Preencha todos os campos.","Criar conta");
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return authFail("Digite um e-mail válido. Ele é usado para recuperar a senha.","Criar conta");
    if(p.length<6) return authFail("A senha precisa ter pelo menos 6 caracteres.","Criar conta");
    if(p!==p2) return authFail("As duas senhas estão diferentes.","Criar conta");
    authBusy("Criando conta…");
    const {data,error}=await SB.auth.signUp({email,password:p,options:{data:{nome},emailRedirectTo:SITE}});
    if(error) return authFail(authMsg(error),"Criar conta");
    if(data.session) return showWelcome(data.user,nome); // "Confirm email" desligado no Supabase: já entra
    showConfirmSent(email,nome); // só acontece se a confirmação por e-mail estiver ligada no Supabase
  });
}
const SITE=location.origin+location.pathname;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
function showWelcome(user,nome){ // conta criada com sucesso
  const first=esc(String(nome||"").trim().split(/\s+/)[0]);
  screen(`${brandHead()}<section class="card welcome" style="display:grid;gap:12px;text-align:center;justify-items:center">
      <span class="big-check">${ICON.check}</span>
      <span class="eyebrow">Conta criada com sucesso</span>
      <h2>Bem-vindo(a) ao ACE${first?`, ${first}`:""}!</h2>
      <p>Sua jornada começa agora. Aqui cada lição estudada, cada exercício resolvido e cada erro corrigido é um passo a mais rumo às suas conquistas.</p>
      <p class="muted" style="font-style:italic">Estamos juntos nessa. Bons estudos!</p>
      <button class="btn primary block" id="wl-go">Começar minha jornada ${ICON.arrow}</button></section>`);
  $("#wl-go").onclick=()=>afterLogin(user);
}
function showConfirmSent(email,nome){ // depois do cadastro, quando o Supabase pede confirmação
  screen(`${brandHead()}<section class="card" style="display:grid;gap:12px;text-align:center;justify-items:center">
      <span class="big-check">${ICON.check}</span>
      <h2>${nome?`Quase lá, ${esc(nome)}!`:"Confirme seu e-mail"}</h2>
      <p>Enviamos um e-mail de confirmação para <b>${esc(email)}</b>.</p>
      <p class="muted">Abra a mensagem e toque em <b>Confirmar meu e-mail</b> para ativar sua conta. Se não encontrar, confira a caixa de spam ou lixo eletrônico.</p>
      <p class="box warn" id="au-err" hidden style="width:100%"></p><p class="box tip" id="au-ok" hidden style="width:100%"></p>
      <button class="btn block" id="au-btn">Reenviar e-mail de confirmação</button>
      <button class="btn primary block" data-auth="login">Ir para o login</button></section>`);
  $("#au-btn").onclick=async()=>{
    authBusy("Reenviando…"); $("#au-ok").hidden=true;
    const {error}=await SB.auth.resend({type:"signup",email,options:{emailRedirectTo:SITE}});
    if(error) return authFail(authMsg(error),"Reenviar e-mail de confirmação");
    $("#au-err").hidden=true; $("#au-ok").hidden=false; $("#au-ok").textContent="Pronto! Enviamos um novo e-mail de confirmação.";
    const b=$("#au-btn"); b.textContent="Reenviar e-mail de confirmação"; setTimeout(()=>{b.disabled=false},30000); // evita cliques repetidos
  };
}
function showForgot(){
  screen(`${brandHead()}<h2 style="text-align:center">Esqueceu a senha?</h2>
    <p class="muted" style="text-align:center">Digite o e-mail da sua conta. Vamos mandar um link para você criar uma senha nova.</p>${authForm("forgot",
    fld("fg-email","E-mail",`type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required`),"Enviar link")}
    ${authLinks(lnk("data-auth=\"login\"","Voltar para o login"))}`);
  $("#forgot").addEventListener("submit",async e=>{
    e.preventDefault();
    const email=$("#fg-email").value.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return authFail("Digite um e-mail válido.","Enviar link");
    authBusy("Enviando…");
    const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:SITE});
    if(error) return authFail(authMsg(error),"Enviar link");
    showLogin(null,`Se <b>${email.replace(/</g,"&lt;")}</b> tiver uma conta, o link para criar uma senha nova chega em alguns minutos. Olhe também a caixa de spam.`);
  });
}
function showNewPassword(){ // aberto pelo link do e-mail de recuperação
  screen(`${brandHead()}<h2 style="text-align:center">Criar senha nova</h2>${authForm("newpass",
    fld("np-pass","Senha nova (mínimo 6 caracteres)",`type="password" autocomplete="new-password" minlength="6" required`)+
    fld("np-pass2","Repita a senha nova",`type="password" autocomplete="new-password" required`),"Salvar senha")}`);
  $("#newpass").addEventListener("submit",async e=>{
    e.preventDefault();
    const p=$("#np-pass").value, p2=$("#np-pass2").value;
    if(p.length<6) return authFail("A senha precisa ter pelo menos 6 caracteres.","Salvar senha");
    if(p!==p2) return authFail("As duas senhas estão diferentes.","Salvar senha");
    authBusy("Salvando…");
    const {data,error}=await SB.auth.updateUser({password:p});
    if(error) return authFail(/different from the old|same.*password/i.test(error.message)?"A senha nova precisa ser diferente da antiga.":authMsg(error),"Salvar senha");
    toast("Senha nova salva!"); afterLogin(data.user);
  });
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-auth]"); if(!b) return;
  ({login:()=>showLogin(),signup:showSignup,forgot:showForgot})[b.dataset.auth]();
});
function showProblem(title,msg){
  screen(`${brandHead()}<section class="card" style="display:grid;gap:10px"><h2>${title}</h2><p class="muted">${msg}</p>
    ${SB?`<button class="btn" data-logout>Sair e entrar com outra conta</button>`:""}</section>`);
}
async function pickStudent(id){
  STUDENT=STUDENTS.find(k=>k.id===id)||STUDENTS[0];
  NS=`estudos:tutor:${USER.id}:${STUDENT.id}:`; loadState();
  try{localStorage.setItem("alice:tutor-aluno",STUDENT.id)}catch(e){}
}
async function afterLogin(user){
  USER=user; screen(`${brandHead()}<p class="muted" style="text-align:center">Carregando…</p>`);
  const {data:prof,error}=await SB.from("profiles").select("id,nome,papel").eq("id",user.id).maybeSingle();
  if(error) return showProblem("Não foi possível carregar","Verifique a internet e tente de novo.");
  if(!prof) return showProblem("Conta ainda não configurada","Esta conta existe, mas não foi marcada como aluna ou tutor. Peça para o tutor rodar o arquivo cadastro.sql no Supabase.");
  ROLE=prof.papel;
  if(ROLE==="aluno"){ STUDENT={id:prof.id,nome:prof.nome}; NS=`estudos:${prof.id}:`; migrateLegacy(); loadState() }
  else {
    TUTOR=prof;
    const {data:kids}=await SB.from("profiles").select("id,nome").eq("tutor_id",prof.id).order("nome");
    STUDENTS=kids||[];
    if(!STUDENTS.length) return showProblem("Nenhum aluno ligado","Rode o passo 4 do arquivo supabase.sql para ligar a conta da Alice à sua.");
    let saved=null; try{saved=localStorage.getItem("alice:tutor-aluno")}catch(e){}
    await pickStudent(saved);
  }
  document.body.classList.remove("locked");
  go("inicio"); // depois do login, sempre começa no Início
  await syncNow();
  clearInterval(pollIv); pollIv=setInterval(()=>{if(document.visibilityState==="visible") syncNow()},30000);
}
async function logout(){
  clearInterval(pollIv); clearTimeout(pushT);
  try{await SB.auth.signOut()}catch(e){}
  USER=null; ROLE="local"; TUTOR=null; STUDENTS=[]; STUDENT={id:null,nome:"Alice"};
  showLogin();
}
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-syncnow],[data-logout],[data-student]"); if(!el) return;
  if(el.dataset.syncnow!==undefined) return syncNow();
  if(el.dataset.logout!==undefined) return logout();
  if(el.dataset.student){await pickStudent(el.dataset.student); render(); syncNow()}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible") syncNow()});

/* ---------- início ---------- */
(async function boot(){
  const h0=(location.hash||"").slice(1);
  if(!CONFIGURED) return go(["agenda","materias","praticar","progresso"].includes(h0)?h0:"inicio");
  if(!window.supabase) return showProblem("Sem conexão","Não foi possível carregar o sistema de login. Verifique a internet e recarregue a página.");
  const hs=new URLSearchParams((location.hash||"").slice(1)), recovery=hs.get("type")==="recovery", confirmed=hs.get("type")==="signup", linkErr=hs.get("error_description");
  SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  SB.auth.onAuthStateChange(ev=>{ if(ev==="PASSWORD_RECOVERY") setTimeout(showNewPassword) });
  const {data}=await SB.auth.getSession();
  if(recovery||confirmed||linkErr) try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  if(recovery && data&&data.session) return showNewPassword();
  if(linkErr) return showLogin("Este link expirou ou já foi usado. Para receber um novo link de confirmação, entre com seu e-mail e senha. Para trocar a senha, use \"Esqueceu a senha?\".");
  if(confirmed && data&&data.session) setTimeout(()=>toast("E-mail confirmado! Bem-vindo(a) ao ACE."),600);
  if(data&&data.session) afterLogin(data.session.user); else showLogin();
})();
</script>
